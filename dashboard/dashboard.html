/* /run-plan-all queue-role pill: stroke-free, no solid fill (color + mark cue)
   next to the solid lifecycle pill (additive; lifecycle pill and executing
   shimmer are untouched). */
.queue-role-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--mc-space-xs);
  font-size: var(--mc-chrome-meta-size);
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 1px 6px;
  border-radius: var(--mc-radius-pill);
  border: none;
  color: var(--text-muted);
  background: transparent;
  text-transform: uppercase;
}
.queue-role-pill-next-up { color: var(--blue); background: transparent; }
.queue-role-pill-queued { color: var(--cyan); background: transparent; }
.queue-role-pill-executing { color: var(--blue); background: transparent; }
.queue-role-pill-done { color: var(--green); background: transparent; }

/* ===== Plans tab accordions ===== */
.plan-accordion-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.plan-accordion-item {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
  overflow: hidden;
}
.plan-accordion-item.open { border-color: var(--border-active); }
.plan-accordion-trigger {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 12px;
  background: transparent;
  border: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.plan-accordion-trigger:hover { background: var(--bg-card-hover); }
.plan-accordion-trigger:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}
.plan-accordion-trigger-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.plan-accordion-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.plan-accordion-title {
  font-size: var(--mc-chrome-label-size);
  font-weight: var(--mc-chrome-label-weight);
  color: var(--text-primary);
  word-break: break-word;
}
.plan-accordion-overview {
  font-size: var(--mc-chrome-subtitle-size);
  font-weight: var(--mc-chrome-subtitle-weight);
  color: var(--text-muted);
  line-height: 1.4;
  word-break: break-word;
}
.plan-accordion-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--mc-space-sm) 10px;
  font-size: var(--mc-chrome-meta-size);
  font-weight: var(--mc-chrome-meta-weight);
  color: var(--text-muted);
}
.plan-accordion-chevron {
  flex-shrink: 0;
  font-size: 10px;
  color: var(--text-muted);
  transition: transform 0.15s ease;
  margin-top: 4px;
}
.plan-accordion-panel {
  display: none;
  padding: 0 12px 12px;
  border-top: 1px solid var(--border);
}
.plan-accordion-item.open .plan-accordion-panel { display: block; }
.plan-accordion-item.open .plan-accordion-chevron { transform: rotate(180deg); }
.plan-accordion-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 0 4px;
}
.plan-accordion-hint {
  font-size: 10px;
  color: var(--text-muted);
  margin: 0 0 8px;
  line-height: 1.4;
}
.plan-next-action {
  padding-top: 10px;
  font-size: var(--mc-chrome-meta-size);
  color: var(--text-secondary);
  line-height: 1.4;
}
.plan-next-action-label {
  color: var(--text-muted);
  font-weight: var(--mc-chrome-label-weight);
}
.plan-accordion-actions .plan-action-primary,
.plan-accordion-actions .plan-action-primary:hover {
  background: var(--blue);
  border-color: transparent;
  color: #fff;
}
.plan-accordion-actions .plan-action-primary:hover {
  filter: brightness(1.08);
}
.plan-todo-list-full {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.plan-todo-list-full .plan-todo-item {
  padding: 4px 0;
}

/* Flight Log empty state reuses attention-empty className with empty-state-cta. */
.attention-empty {
  padding: var(--mc-space-lg) var(--mc-space-md);
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.45;
}
.empty-state-cta.attention-empty,
.empty-state-cta.activity-feed-empty {
  /* Shared renderer already sets padding; keep panel chrome size. */
  padding: var(--mc-space-lg) var(--mc-space-md);
}

/* ===== Now execution panel (primary Current work) ===== */
.now-panel-header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
/* Solid chip family (see .lifecycle-pill): filled surface, no stroke. */
.now-status {
  display: inline-flex;
  align-items: center;
  gap: var(--mc-space-sm);
  font-size: var(--mc-chrome-meta-size);
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 3px var(--mc-space-md);
  border-radius: var(--mc-radius-chrome);
  border: none;
  color: var(--text-secondary);
  background: var(--bg-card);
  text-transform: uppercase;
}
.now-status-mark {
  font-size: 10px;
  line-height: 1;
}
/* Executing: green fill + ▶ mark (no glow; stepbar shimmer carries live motion) */
.now-status-executing {
  color: var(--green);
  background: var(--green-bg);
}
/* Awaiting: pause mark carries the non-color cue once the dashed stroke is gone */
.now-status-awaiting {
  color: var(--yellow);
  background: var(--yellow-bg);
}
/* Completed: green fill + check mark (terminal mission, not live, not idle) */
.now-status-completed {
  color: var(--green);
  background: var(--green-bg);
}
/* Idle: hollow mark + unfilled surface. The radius stopped carrying this cue
   when the pills squared off (design v2); the ○ mark is now the whole non-color
   signal, which is why it may not be dropped. */
.now-status-idle {
  color: var(--text-muted);
  background: var(--bg-card);
}
/* Busy-outside-plan chip: live run-loop activity while the mission is not
   executing. Advice-family blue tokens (kind palette); text-only so the dot
   and icon contracts stay untouched. */
.mc-busy-chip {
  display: inline-flex;
  align-items: center;
  font-size: var(--mc-chrome-meta-size);
  font-weight: var(--mc-chrome-meta-weight);
  letter-spacing: 0.02em;
  padding: 3px var(--mc-space-md);
  border-radius: var(--mc-radius-chrome);
  color: var(--blue);
  background: var(--blue-bg);
  text-transform: uppercase;
}
.now-plan-name {
  margin-top: 10px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  word-break: break-word;
}
/* Step progress bar: completed / current / remaining segments vs plan total */
.now-stepbar-row {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.now-stepbar {
  display: flex;
  flex: 1;
  min-width: 0;
  gap: 2px;
}
.now-stepbar-seg {
  flex: 1;
  min-width: 2px;
  height: 6px;
  border-radius: 2px;
  background: var(--border);
}
.now-stepbar-seg-done { background: var(--green); }
.now-stepbar-seg-current { background: var(--blue); }
@media (prefers-reduced-motion: no-preference) {
  .now-stepbar-seg-current {
    background-image: linear-gradient(
      105deg,
      var(--blue) 0%,
      var(--blue) 35%,
      rgba(255, 255, 255, 0.35) 50%,
      var(--blue) 65%,
      var(--blue) 100%
    );
    background-size: 200% 100%;
    animation: now-stepbar-shimmer 1.5s ease-in-out infinite;
  }
}
@keyframes now-stepbar-shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}
.now-stepbar-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}
/* Stepper: connected previous → current → next blocks */
.now-stepper {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
}
.now-step {
  position: relative;
  display: flex;
  gap: 10px;
  padding-bottom: 12px;
}
.now-step:last-child { padding-bottom: 0; }
.now-step:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 20px;
  bottom: 0;
  width: 2px;
  background: var(--border);
}
.now-step-done:not(:last-child)::before { background: var(--green); }
.now-step-marker {
  position: relative;
  z-index: 1;
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.now-step-done .now-step-marker {
  border-color: var(--green);
  background: var(--green-bg);
  color: var(--green);
}
.now-step-current .now-step-marker {
  border-color: var(--blue);
  background: var(--blue-bg);
  color: var(--blue);
}
.now-step-current.now-step-done .now-step-marker {
  border-color: var(--green);
  background: var(--green-bg);
  color: var(--green);
}
.now-step-body {
  flex: 1;
  min-width: 0;
}
.now-step-current .now-step-body {
  background: var(--bg-secondary);
  border: 1px solid var(--border-active);
  border-radius: 6px;
  padding: 6px 8px;
}
.now-step-label {
  display: block;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}
.now-step-text {
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-secondary);
  overflow-wrap: anywhere;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Spotlight: Previous/Next are compact context; Current stays the sole full body */
.now-step-previous,
.now-step-next {
  padding-bottom: 8px;
}
.now-step-previous .now-step-text,
.now-step-next .now-step-text {
  -webkit-line-clamp: 1;
  font-size: 11px;
  line-height: 1.35;
  color: var(--text-muted);
  font-weight: 400;
}
.now-step-previous .now-step-label,
.now-step-next .now-step-label {
  font-size: 9px;
  opacity: 0.9;
}
.now-step-previous .now-todo-id,
.now-step-next .now-todo-id {
  font-size: 10px;
  color: var(--text-secondary);
}
.now-step-current .now-step-text {
  -webkit-line-clamp: 3;
  color: var(--text-primary);
  font-weight: 500;
}
.now-step-empty .now-step-text {
  color: var(--text-muted);
  font-style: italic;
}
/* Completed mission: terminal step reads as done, closing row as no-work-left */
.now-step-final .now-step-body {
  background: var(--bg-secondary);
  border: 1px solid var(--green);
  border-radius: 6px;
  padding: 6px 8px;
}
.now-step-final .now-step-text {
  -webkit-line-clamp: 3;
  color: var(--text-primary);
  font-weight: 500;
}
.now-step-terminal .now-step-marker {
  border-color: var(--green);
  background: var(--green-bg);
  color: var(--green);
}
.now-step-terminal .now-step-text { color: var(--text-secondary); }
/* Quiet footer strip: meta under the stepper (Mode, Updated, timing). */
.now-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  line-height: 1.35;
}
.now-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  max-width: 100%;
}
.now-meta-icon {
  flex-shrink: 0;
  width: var(--mc-chrome-subtitle-size);
  height: var(--mc-chrome-subtitle-size);
  color: var(--text-muted);
  opacity: 0.85;
}
/* Loop Mode sunburst while Current mission is executing (static otherwise). */
.now-meta-icon.now-meta-icon-executing {
  animation: spin 1.6s linear infinite;
  transform-origin: 50% 50%;
}
.now-meta-value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-secondary);
  font-weight: 400;
}
/* HANDOFF Gaps alert moved to Flight Log; keep class for legacy CSS safety. */
.now-gaps {
  display: none;
}
/* Flight Log: live Gaps (large) + earlier (smaller) + Warnings lane */
.flight-log-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.flight-log-warnings {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 4px;
}
.flight-log-card {
  display: block;
  width: 100%;
  text-align: left;
  margin: 0;
  padding: var(--mc-card-padding-dense);
  border-radius: var(--mc-radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated, var(--bg-card));
  color: var(--text-primary);
  cursor: pointer;
  font: inherit;
  line-height: 1.4;
}
/* Base hover/focus: keyboard-visible ring via --border-active (not invisible --border); kind rules below set colors. */
.flight-log-card:hover,
.flight-log-card:focus-visible {
  outline: 2px solid var(--border-active);
  outline-offset: 1px;
}
.flight-log-card-current {
  padding: 12px 14px;
  font-size: 13px;
}
.flight-log-card-current.flight-log-kind-residual {
  border-color: var(--yellow);
  background: var(--yellow-bg);
}
.flight-log-card-current.flight-log-kind-residual .flight-log-card-label {
  color: var(--yellow);
}
.flight-log-card-current.flight-log-kind-residual:hover,
.flight-log-card-current.flight-log-kind-residual:focus-visible {
  border-color: var(--yellow);
  outline-color: var(--yellow);
}
.flight-log-card-current.flight-log-kind-advice {
  border-color: var(--blue);
  background: var(--blue-bg);
}
.flight-log-card-current.flight-log-kind-advice .flight-log-card-label {
  color: var(--blue);
}
.flight-log-card-current.flight-log-kind-advice:hover,
.flight-log-card-current.flight-log-kind-advice:focus-visible {
  border-color: var(--blue);
  outline-color: var(--blue);
}
.flight-log-card-current.flight-log-kind-ok {
  border-color: color-mix(in srgb, var(--green) 55%, var(--border));
  background: color-mix(in srgb, var(--green-bg) 40%, var(--bg-elevated, var(--bg-card)));
}
.flight-log-card-current.flight-log-kind-ok .flight-log-card-label {
  color: var(--green);
}
.flight-log-card-current.flight-log-kind-ok:hover,
.flight-log-card-current.flight-log-kind-ok:focus-visible {
  border-color: var(--green);
  outline-color: var(--green);
}
.flight-log-card-current.flight-log-kind-warning {
  border-color: color-mix(in srgb, var(--orange, var(--yellow)) 70%, var(--border));
  background: color-mix(in srgb, var(--orange-bg, var(--yellow-bg)) 55%, var(--bg-elevated, var(--bg-card)));
}
.flight-log-card-current.flight-log-kind-warning .flight-log-card-label {
  color: var(--orange, var(--yellow));
}
.flight-log-card-current.flight-log-kind-warning:hover,
.flight-log-card-current.flight-log-kind-warning:focus-visible {
  border-color: var(--orange, var(--yellow));
  outline-color: var(--orange, var(--yellow));
}
.flight-log-card-past {
  padding: 8px 10px;
  font-size: 11px;
  color: var(--text-secondary);
  opacity: 0.92;
}
.flight-log-card-past.flight-log-kind-residual {
  border-color: color-mix(in srgb, var(--yellow) 35%, var(--border));
}
/* Earlier: muted color-mix on hover; full kind token on focus-visible for ≥3:1 keyboard ring. */
.flight-log-card-past.flight-log-kind-residual:hover {
  border-color: color-mix(in srgb, var(--yellow) 55%, var(--border));
  outline-color: color-mix(in srgb, var(--yellow) 55%, var(--border));
}
.flight-log-card-past.flight-log-kind-residual:focus-visible {
  border-color: var(--yellow);
  outline-color: var(--yellow);
}
.flight-log-card-past.flight-log-kind-advice {
  border-color: color-mix(in srgb, var(--blue) 35%, var(--border));
}
.flight-log-card-past.flight-log-kind-advice:hover {
  border-color: color-mix(in srgb, var(--blue) 55%, var(--border));
  outline-color: color-mix(in srgb, var(--blue) 55%, var(--border));
}
.flight-log-card-past.flight-log-kind-advice:focus-visible {
  border-color: var(--blue);
  outline-color: var(--blue);
}
.flight-log-card-past.flight-log-kind-ok {
  border-color: color-mix(in srgb, var(--green) 30%, var(--border));
}
.flight-log-card-past.flight-log-kind-ok:hover {
  border-color: color-mix(in srgb, var(--green) 50%, var(--border));
  outline-color: color-mix(in srgb, var(--green) 50%, var(--border));
}
.flight-log-card-past.flight-log-kind-ok:focus-visible {
  border-color: var(--green);
  outline-color: var(--green);
}
.flight-log-card-past.flight-log-kind-warning {
  border-color: color-mix(in srgb, var(--orange, var(--yellow)) 30%, var(--border));
}
.flight-log-card-past.flight-log-kind-warning:hover {
  border-color: color-mix(in srgb, var(--orange, var(--yellow)) 50%, var(--border));
  outline-color: color-mix(in srgb, var(--orange, var(--yellow)) 50%, var(--border));
}
.flight-log-card-past.flight-log-kind-warning:focus-visible {
  border-color: var(--orange, var(--yellow));
  outline-color: var(--orange, var(--yellow));
}
.flight-log-card-warning {
  border-color: color-mix(in srgb, var(--orange, var(--yellow)) 70%, var(--border));
  background: color-mix(in srgb, var(--orange-bg, var(--yellow-bg)) 55%, var(--bg-elevated, var(--bg-card)));
  font-size: 12px;
  opacity: 0.96;
}
.flight-log-card-warning .flight-log-card-label {
  color: var(--orange, var(--yellow));
}
.flight-log-card-warning:hover,
.flight-log-card-warning:focus-visible {
  border-color: var(--orange, var(--yellow));
  outline-color: var(--orange, var(--yellow));
}
.flight-log-card-label {
  display: block;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: 10px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.flight-log-card-past .flight-log-card-label {
  color: var(--text-muted);
}
.flight-log-card-text {
  color: var(--text-primary);
  word-break: break-word;
  white-space: pre-wrap;
}
.flight-log-card-past .flight-log-card-text {
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.flight-log-card-meta {
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-muted);
}
.flight-log-card-actions {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.now-todo-id {
  font-family: var(--mc-font-mono);
  font-size: 11px;
  color: var(--text-primary);
}
.now-actions {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.now-mode-hint {
  margin: 8px 0 0;
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-secondary);
}
.now-mode-hint strong {
  color: var(--text-primary);
  font-weight: 600;
}

/* ===== Accessibility: reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .dot-pulse,
  .pulse,
  .pulse-badge,
  .pulse-text,
  .reconnecting-pulse,
  .card-flash,
  .activity-item.stagger-fade,
  .monitor-row.stagger-fade,
  .activity-filter-chip,
  .copied-toast.animating,
  .skeleton-card,
  .skeleton-line,
  .skeleton-line-sm,
  .skeleton-fade-in,
  .inline-spinner,
  .btn-refresh.is-refreshing .btn-refresh-icon,
  .plan-progress-fill.is-executing,
  .now-stepbar-seg-current {
    animation: none !important;
  }
  .health-item:active,
  .empty-state-btn:active {
    transform: none !important;
  }
}
</style>
</head>
<body>
<!-- Header: identity + one transport/freshness signal + refresh -->
<div class="header">
  <button type="button" class="header-brand" id="headerBrand" onclick="return goHome()" aria-label="Home, Overview" title="Home, Overview">
    <img class="logo" id="headerLogo" src="/logo.svg" width="28" height="28" alt="" aria-hidden="true"> Mission Control
    <span class="header-workspace" id="headerWorkspace" hidden></span>
  </button>

<script>
// ===== State =====
let data = null;
let refreshInterval = 5000;
let timer = null;
let sseSource = null;
let sseFailedAttempts = 0;
let sseMode = 'polling';
let activityLog = [];
let prevData = null;
let lastEventTime = Date.now();
/** Last SSE data payload only (poll must not reset silence detection). */
let lastSseDataTime = Date.now();
let sseTimerInterval = null;
let dataLoading = false;
let renderTimeout = null;
let sseReconnecting = false;
/** True when poll resumed because SSE delivered no data for SSE_SILENCE_MS. */
let sseSilentFallback = false;
let statusBarInterval = null;
/** Full capped terminal output for expand popup (keyed by terminal id). */
const terminalOutputStore = new Map();
/** Open Plans-tab accordion keys (survive SSE re-renders). */
const openPlanAccordions = new Set();
/** When true, narrow panels keep multiple accordions open. */
let planAccordionAllowMulti = false;
const RECENT_PLAN_CARD_LIMIT = 10;
/** Resume poll when SSE stays open but delivers no data payloads (ms). */
const SSE_SILENCE_MS = 20000;
const LIFECYCLE_SORT_RANK = {
  executing: 0,
  awaiting_user: 1,
  parked: 2,
  backlog: 3,
  incomplete: 4,
  completed: 5,
};
/** Checklist display order for /run-plan-all queue roles (not approved-queue index). */
const QUEUE_ROLE_SORT_RANK = {
  executing: 0,
  next_up: 1,
  queued: 2,
  completed_in_queue: 3,
  none: 4,
};

function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function isNarrowPanel() {
  return window.matchMedia('(max-width: 520px)').matches;
}

// ===== Debounce =====
function debounce(fn, ms) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

// ===== Escape helpers (XSS hardening) =====
function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(value) {
  return escapeHtml(value);
}

function escapeJsString(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r/g, '\\r')
    .replace(/\n/g, '\\n')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
}

// ===== Sections =====
/** Navigable section ids (More menu + hash deep links). */
const SECTION_IDS = [
  'overview',
  'plans',
  'activity',
  'agents',
  'skills',
  'commands',
  'health',
  'git',
  'memory',
  'terminals',
  'processes',
  'config',
];

/** Read the active section from the URL hash (`#health` -> `health`). */
function sectionFromHash() {
  try {
    const raw = (location.hash || '').replace(/^#\/?/, '').split('/')[0];
    return SECTION_IDS.includes(raw) ? raw : 'overview';
  } catch {
    return 'overview';
  }
}

/** Keep the URL hash in sync so every tab is a shareable deep link. */
function syncSectionHash(id) {
  try {
    const target = `#${id}`;
    if (location.hash !== target && history.replaceState) {
      history.replaceState(null, '', target);
    }
  } catch {
    // file:// or restricted contexts: hash sync is best-effort
  }
}

/** Active pane id (overview = Cockpit page; others = dropdown destinations). */
let activeSectionId = sectionFromHash();
/** Last Cockpit in-page anchor while overview is active. */
let activeCockpitAnchor = 'now-execution-panel';
/** Activity tab source filter chip id (`all` or a source key). */
let activitySourceFilter = 'all';

function setActiveCockpitAnchor(anchorId) {
  activeCockpitAnchor = anchorId || 'now-execution-panel';
  document.querySelectorAll('.top-nav-anchor').forEach((el) => {
    const selected = el.dataset.anchor === activeCockpitAnchor;
    el.classList.toggle('active', selected);
    if (selected) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
}

function clearCockpitAnchorActive() {
  document.querySelectorAll('.top-nav-anchor').forEach((el) => {
    el.classList.remove('active');
    el.removeAttribute('aria-current');
  });
}

function goHome() {
  return showSection('overview');
}

/** Fullscreen (zen) viewport mode: hide the app header; Escape or the floating exit control restores chrome. */
function toggleMcFullscreen(force) {
  const on = typeof force === 'boolean' ? force : !document.body.classList.contains('mc-fullscreen');
  document.body.classList.toggle('mc-fullscreen', on);
  const enterBtn = document.getElementById('fullscreenToggleBtn');
  if (enterBtn) enterBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  const exitBtn = document.getElementById('fullscreenExitBtn');
  if (exitBtn) exitBtn.hidden = !on;
  return false;
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !document.body.classList.contains('mc-fullscreen')) return;
  // Layered Escape: dismiss open menus first; only then exit fullscreen.
  if (typeof isNavMoreOpen === 'function' && isNavMoreOpen()) return;
  if (typeof openRecentPlanActionsKey !== 'undefined' && openRecentPlanActionsKey) return;
  e.preventDefault();
  toggleMcFullscreen(false);
});

/** Sync header Home chrome + section-title back control with active section. */
function updateHeaderHomeChrome() {
  const onOverview = activeSectionId === 'overview';
  const brand = document.getElementById('headerBrand');
  const homeBtn = document.getElementById('headerHomeBtn');
  if (brand) {
    if (onOverview) brand.setAttribute('aria-current', 'page');
    else brand.removeAttribute('aria-current');
    brand.title = onOverview ? 'Mission Control Overview' : 'Home, Overview';
  }
  if (homeBtn) {
    homeBtn.classList.toggle('is-return', !onOverview);
    if (onOverview) homeBtn.setAttribute('aria-current', 'page');
    else homeBtn.removeAttribute('aria-current');
  }
  document.querySelectorAll('.section-home-back').forEach((el) => el.remove());
  if (!onOverview) {
    const section = document.getElementById(`section-${activeSectionId}`);
    const title = section && section.querySelector('.section-title');
    if (title && !title.querySelector('.section-home-back')) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'section-home-back';
      btn.setAttribute('aria-label', 'Back to Home, Overview');
      btn.title = 'Back to Home, Overview';
      btn.onclick = () => goHome();
      btn.insertAdjacentHTML('afterbegin', spaceIconSvg('overview', { decorative: true }));
      btn.appendChild(document.createTextNode('Home'));
      title.insertBefore(btn, title.firstChild);
    }
  }
}

function showSection(id) {
  activeSectionId = id || 'overview';
  const menuWasOpen = isNavMoreOpen();
  closeNavMore({ restoreFocus: menuWasOpen });

  const tabs = document.querySelectorAll('.top-tab[data-section]');
  tabs.forEach((el) => {
    const selected = el.dataset.section === activeSectionId;
    el.classList.toggle('active', selected);
    el.setAttribute('aria-selected', selected ? 'true' : 'false');
  });

  document.querySelectorAll('.content-section').forEach((el) => el.classList.remove('active'));
  const section = document.getElementById(`section-${activeSectionId}`);
  if (section) section.classList.add('active');

  if (activeSectionId === 'overview') {
    setActiveCockpitAnchor(activeCockpitAnchor || 'now-execution-panel');
  } else {
    clearCockpitAnchorActive();
  }

  updateHeaderHomeChrome();
  syncSectionHash(activeSectionId);

  const content = document.getElementById('content');
  if (content) content.scrollTop = 0;
  return false;
}

/** Back/forward or pasted deep links switch tabs. */
window.addEventListener('hashchange', () => {
  const id = sectionFromHash();
  if (id !== activeSectionId) showSection(id);
});

/**
 * Anchor scroll still travelling. A snapshot re-render restores the scroll
 * position captured when it started, which would strand a smooth scroll part
 * way to its section, so the render re-issues the scroll while this is set.
 */
let pendingAnchorScroll = null;
const ANCHOR_SCROLL_SETTLE_MS = 1200;

function scrollToCockpitAnchor(anchorId, { track = true } = {}) {
  const el = document.getElementById(anchorId);
  if (!el || typeof el.scrollIntoView !== 'function') {
    pendingAnchorScroll = null;
    return;
  }
  const behavior = prefersReducedMotion() ? 'auto' : 'smooth';
  if (track) {
    // An instant scroll lands before any render can interrupt it.
    pendingAnchorScroll =
      behavior === 'smooth'
        ? { id: anchorId, until: Date.now() + ANCHOR_SCROLL_SETTLE_MS }
        : null;
  }
  el.scrollIntoView({ block: 'start', behavior });
}

/** Switch to Cockpit (overview) and scroll to an in-page section anchor. */
function goCockpitAnchor(anchorId) {
  const targetId = anchorId || 'now-execution-panel';
  activeCockpitAnchor = targetId;
  showSection('overview');
  setActiveCockpitAnchor(targetId);
  scrollToCockpitAnchor(targetId);
  return false;
}

// ===== Dashboard visual skins (More menu; local preference only) =====
const DASHBOARD_SKIN_KEY = 'agent-kit:dashboard-skin';
const DASHBOARD_SKINS = ['legacy', 'cursor'];

function normalizeDashboardSkin(skin) {
  return DASHBOARD_SKINS.includes(skin) ? skin : 'legacy';
}

function getStoredDashboardSkin() {
  try {
    return normalizeDashboardSkin(localStorage.getItem(DASHBOARD_SKIN_KEY));
  } catch (e) {
    return 'legacy';
  }
}

/** Apply skin via root data attribute; optionally persist to localStorage. */
function applyDashboardSkin(skin, opts) {
  const next = normalizeDashboardSkin(skin);
  document.documentElement.setAttribute('data-dashboard-skin', next);
  document.querySelectorAll('[data-dashboard-skin-option]').forEach((el) => {
    const selected = el.getAttribute('data-dashboard-skin-option') === next;
    el.setAttribute('aria-checked', selected ? 'true' : 'false');
    el.classList.toggle('active', selected);
  });
  const logoSrc = next === 'cursor' ? '/logo-cursor.svg' : '/logo.svg';
  const headerLogo = document.getElementById('headerLogo');
  if (headerLogo) headerLogo.setAttribute('src', logoSrc);
  const favicon = document.getElementById('favicon');
  if (favicon) favicon.setAttribute('href', logoSrc);
  if (!opts || opts.persist !== false) {
    try {
      localStorage.setItem(DASHBOARD_SKIN_KEY, next);
    } catch (e) { /* private mode / blocked storage */ }
  }
  return next;
}

function setDashboardSkin(skin) {
  applyDashboardSkin(skin);
  return false;
}

// ===== Crew Monitor row density (compact | comfortable; local preference) =====
const MONITOR_DENSITY_KEY = 'agent-kit:monitor-density';
const MONITOR_DENSITIES = ['compact', 'comfortable'];
/** Comfortable needs horizontal room for a two-line label to be worth the height. */
const MONITOR_DENSITY_COMFORTABLE_MIN_WIDTH = 900;

function normalizeMonitorDensity(density) {
  return MONITOR_DENSITIES.includes(density) ? density : null;
}

/** Viewport auto-pick, used only when the operator stored no preference. */
function autoMonitorDensity() {
  return (window.innerWidth || 0) >= MONITOR_DENSITY_COMFORTABLE_MIN_WIDTH
    ? 'comfortable'
    : 'compact';
}

function getStoredMonitorDensity() {
  try {
    return normalizeMonitorDensity(localStorage.getItem(MONITOR_DENSITY_KEY));
  } catch (e) {
    return null;
  }
}

/** Current mode from the root attribute (set pre-paint), else the auto-pick. */
function currentMonitorDensity() {
  return (
    normalizeMonitorDensity(document.documentElement.getAttribute('data-monitor-density')) ||
    getStoredMonitorDensity() ||
    autoMonitorDensity()
  );
}

/** Apply density via root data attribute; an explicit choice persists and wins. */
function applyMonitorDensity(density, opts) {
  const next = normalizeMonitorDensity(density) || autoMonitorDensity();
  document.documentElement.setAttribute('data-monitor-density', next);
  document.querySelectorAll('[data-monitor-density-toggle]').forEach((el) => {
    el.setAttribute('aria-pressed', next === 'comfortable' ? 'true' : 'false');
    el.textContent = next === 'comfortable' ? 'Comfortable' : 'Compact';
  });
  if (!opts || opts.persist !== false) {
    try {
      localStorage.setItem(MONITOR_DENSITY_KEY, next);
    } catch (e) { /* private mode / blocked storage */ }
  }
  return next;
}

function toggleMonitorDensity() {
  applyMonitorDensity(currentMonitorDensity() === 'comfortable' ? 'compact' : 'comfortable');
  return false;
}

// ===== More-sections dropdown =====
function isNavMoreOpen() {
  const menu = document.getElementById('navMoreMenu');
  return !!(menu && !menu.hidden);
}

/** Anchor the fixed menu under the trigger, right-aligned, clamped to the viewport. */
function positionNavMore() {
  const btn = document.getElementById('navMoreBtn');
  const menu = document.getElementById('navMoreMenu');
  if (!btn || !menu || menu.hidden) return;
  const gap = 4;
  const margin = 8;
  const rect = btn.getBoundingClientRect();
  const top = rect.bottom + gap;
  // Cap height to the space below the trigger so it scrolls internally, not off screen.
  const maxHeight = Math.max(120, window.innerHeight - top - margin);
  menu.style.maxHeight = `${maxHeight}px`;
  const width = menu.offsetWidth;
  let left = rect.right - width;
  const maxLeft = window.innerWidth - width - margin;
  if (left > maxLeft) left = maxLeft;
  if (left < margin) left = margin;
  menu.style.top = `${Math.round(top)}px`;
  menu.style.left = `${Math.round(left)}px`;
}

function openNavMore() {
  const btn = document.getElementById('navMoreBtn');
  const menu = document.getElementById('navMoreMenu');
  if (!btn || !menu || !menu.hidden) return;
  menu.hidden = false;
  menu.classList.remove('is-closing');
  btn.setAttribute('aria-expanded', 'true');
  positionNavMore();
  const first = menu.querySelector('.nav-more-item');
  if (first) first.focus();
}

function closeNavMore(opts) {
  const restoreFocus = !opts || opts.restoreFocus !== false;
  const btn = document.getElementById('navMoreBtn');
  const menu = document.getElementById('navMoreMenu');
  if (!btn || !menu || menu.hidden) return;
  const finish = () => {
    menu.hidden = true;
    menu.classList.remove('is-closing');
    btn.setAttribute('aria-expanded', 'false');
    if (restoreFocus) btn.focus();
  };
  if (prefersReducedMotion()) {
    finish();
    return;
  }
  menu.classList.add('is-closing');
  window.setTimeout(finish, 150);
}

function toggleNavMore() {
  if (isNavMoreOpen()) closeNavMore({ restoreFocus: true });
  else openNavMore();
}

function injectCockpitNavIcons() {
  document.querySelectorAll('.top-nav-anchor[data-icon]').forEach((el) => {
    if (el.querySelector('.space-icon')) return;
    const kind = el.getAttribute('data-icon');
    if (!kind) return;
    el.insertAdjacentHTML('afterbegin', spaceIconSvg(kind, { decorative: true }));
  });
  const moreBtn = document.getElementById('navMoreBtn');
  if (moreBtn && !moreBtn.querySelector('.space-icon')) {
    moreBtn.innerHTML = spaceIconSvg('more-sections', { decorative: false });
  }
  const homeBtn = document.getElementById('headerHomeBtn');
  if (homeBtn && !homeBtn.querySelector('.space-icon')) {
    homeBtn.innerHTML = spaceIconSvg('overview', { decorative: true });
  }
  // Inject section icons into More-menu items (replace redundant inline SVGs).
  document.querySelectorAll('#navMoreMenu .nav-more-item[data-section]').forEach((el) => {
    if (el.querySelector('.space-icon')) return;
    const kind = el.getAttribute('data-section');
    if (!kind) return;
    el.insertAdjacentHTML('afterbegin', spaceIconSvg(kind, { decorative: true }));
  });
  // Skins group label: palette glyph (distinct from Skills gear).
  const skinsLabel = document.getElementById('navSkinsLabel');
  if (skinsLabel && !skinsLabel.querySelector('.space-icon')) {

// ===== Cockpit nav + more-menu keyboard / outside click =====
document.addEventListener('DOMContentLoaded', () => {
  injectCockpitNavIcons();
  // Sync menuitemradio selected state with the early-boot skin attribute.
  applyDashboardSkin(
    document.documentElement.getAttribute('data-dashboard-skin') || getStoredDashboardSkin(),
    { persist: false },
  );

  const moreBtn = document.getElementById('navMoreBtn');
  const menu = document.getElementById('navMoreMenu');
  if (moreBtn) {
    moreBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleNavMore();
    });
  }
  if (menu) {
    menu.addEventListener('click', (e) => e.stopPropagation());
    menu.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeNavMore({ restoreFocus: true });
        return;
      }
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Home' && e.key !== 'End') return;
      const items = [...menu.querySelectorAll('.nav-more-item')];
      const i = items.indexOf(document.activeElement);
      if (i < 0 && items.length === 0) return;
      e.preventDefault();
      let next = i < 0 ? 0 : i;
      if (e.key === 'ArrowDown') next = (i + 1) % items.length;
      else if (e.key === 'ArrowUp') next = (i - 1 + items.length) % items.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = items.length - 1;
      items[next]?.focus();
    });
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isNavMoreOpen()) {
      e.preventDefault();
      closeNavMore({ restoreFocus: true });
    }
  });
  document.addEventListener('click', () => {
    if (isNavMoreOpen()) closeNavMore({ restoreFocus: true });
  });
  window.addEventListener('resize', () => {
    if (isNavMoreOpen()) positionNavMore();
  });

  // Manual scrolling wins over an anchor scroll still in flight.
  const releaseAnchorScroll = () => {
    pendingAnchorScroll = null;
  };
  window.addEventListener('wheel', releaseAnchorScroll, { passive: true });
  window.addEventListener('touchmove', releaseAnchorScroll, { passive: true });
});

// ===== Keyboard activation for interactive rows (Phase 3 a11y) =====
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[role="button"][tabindex="0"]');
  if (!el || el.tagName === 'BUTTON' || el.tagName === 'A') return;
  e.preventDefault();
  el.click();
});

// ===== Format helpers =====
function fmtTime(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function fmtDate(iso) {
  if (!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// Humanize a duration in seconds (mirrors formatSessionAge in the sessionStart hook).
function formatDuration(seconds) {
  const s = Number(seconds);
  if (!Number.isFinite(s) || s < 0) return 'unknown';
  if (s >= 86400) return Math.floor(s / 86400) + 'd';
  if (s >= 3600) return Math.floor(s / 3600) + 'h';
  if (s >= 60) return Math.floor(s / 60) + 'm';
  return Math.floor(s) + 's';
}

// Presentation contract (Phase 2): progress is never an error signal. Any
// in-flight percentage (0-99) renders the neutral accent; 100% renders green
// (lifecycle completed with total > 0 implies 100 per the Phase 0 contract).
function progressColor(pct) {
  return pct >= 100 ? 'green' : 'blue';
}

// Dot semantics: only state signals survive. completed = good, cancelled =
// attention. pending / in_progress are steady states and get no dot (the
// status text on the row stays the source of truth).
function statusDot(status) {
  const map = {
    completed: 'dot-green',
    cancelled: 'dot-red',
  };
  return map[status] || null;
}

// ===== Client diagnostic activity =====
const MAX_ACTIVITY_LABEL = 200;

function boundedActivityText(value) {
  const text = String(value ?? '').replace(/\s+/g, ' ').trim();
  return text.length <= MAX_ACTIVITY_LABEL ? text : `${text.slice(0, MAX_ACTIVITY_LABEL - 1)}\u2026`;
}

function diagnosticIdPart(value) {
  return String(value ?? '').replace(/\s+/g, ' ').trim().slice(0, 80);
}

function addActivity(label, type, event) {
  const details = event || {};
  const id = String(details.id || '').trim();
  if (!id) return;
  const existingIdx = activityLog.findIndex((item) => item.id === id);
  if (existingIdx !== -1 && !details.update) return;
  if (details.replacePrefix) {
    activityLog = activityLog.filter((item) => !item.id.startsWith(details.replacePrefix));
  } else if (existingIdx !== -1) {
    activityLog.splice(existingIdx, 1);
  }
  const firstSeenAt = new Date().toISOString();
  activityLog.push({
    id,
    kind: details.kind || 'diagnostic',
    source: details.source || 'system',
    at: firstSeenAt,
    firstSeenAt,
    label: boundedActivityText(label),
    accent: type || 'info',
  });
  if (activityLog.length > 100) activityLog.shift();
}

// ===== Relative time helper =====
function relativeTime(iso) {
  if (!iso) return '\u2014';
  const now = Date.now();
  const then = new Date(iso).getTime();
  const diff = Math.max(0, now - then);
  const secs = Math.floor(diff / 1000);
  if (secs < 5) return 'just now';
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

  // Delivery chip subclasses from refs.commitType (kind stays delivery; solid fills only).
  // Locked BMP map (hotfix 2026-07-27): feat✦ fix⚙ docs✎ chore⚒ pr⑂ ship✈
  if (kind === 'delivery' && commitType) {

/** Monitor hero allowlist (curated subset). Inventory kinds stay on the full stream. */
const MONITOR_ACTIVITY_KINDS = new Set([
  'run_plan', 'handoff', 'delivery', 'agent_step', 'subagent', 'plan_review',
]);
/**
 * Crew Monitor display cap from missionControl.monitorFeedCap
 * (SoT: MONITOR_FEED_CAP in dashboard/lib/semantic-model.mjs).
 * Fallback 20 only for malformed/missing snapshots.
 */
function monitorFeedCap(d) {
  const n = Number(d?.missionControl?.monitorFeedCap);
  return Number.isFinite(n) && n > 0 ? n : 20;
}

/** Full semantic stream with first-seen tracking (server dedupe is by id). */
function semanticFeedEvents(d) {
  const events = d.missionControl?.activity || [];
  const nowIso = new Date().toISOString();
  const currentIds = new Set();
  for (const ev of events) {
    if (!ev?.id) continue;
    currentIds.add(ev.id);
    if (!semanticSeenAt.has(ev.id)) semanticSeenAt.set(ev.id, nowIso);
  }
  // Bound the store: drop ids no longer present once it grows past the feed cap
  if (semanticSeenAt.size > 100) {
    for (const id of semanticSeenAt.keys()) {
      if (!currentIds.has(id)) semanticSeenAt.delete(id);
    }
  }
  return events;
}

function semanticEventSource(ev) {
  if (ev.source) return boundedActivityText(ev.source);
  if (ev.kind === 'handoff') return 'handoff';
  if (ev.kind === 'delivery') return 'git';
  if (ev.kind === 'commit') return 'git';
  if (ev.refs?.terminal) return 'terminals';
  return 'plans';
}

function unifiedActivityEvents(semanticEvents) {
  const byId = new Map();
  for (const ev of semanticEvents) {
    if (!ev?.id || byId.has(ev.id)) continue;
    byId.set(ev.id, {
      ...ev,
      source: semanticEventSource(ev),
      firstSeenAt: semanticSeenAt.get(ev.id) || null,
      label: boundedActivityText(ev.label),
      diagnostic: false,
    });
  }
  for (const ev of activityLog) {
    if (!byId.has(ev.id)) byId.set(ev.id, { ...ev, diagnostic: true });
  }
  return [...byId.values()]
    .sort((a, b) => {
      const aTime = Date.parse(a.at || a.firstSeenAt || '') || 0;
      const bTime = Date.parse(b.at || b.firstSeenAt || '') || 0;
      return bTime - aTime || String(a.id).localeCompare(String(b.id));
    })
    .slice(0, 100);
}

/** Per-source filter chips for the Activity tab (client-side only). */
const ACTIVITY_SOURCE_FILTERS = [
  { id: 'all', label: 'All', sources: null },
  { id: 'plans', label: 'Plans', sources: ['plans', 'handoff'] },
  { id: 'git', label: 'Git', sources: ['git'] },
  { id: 'agents', label: 'Agents', sources: ['agents'] },
  { id: 'skills', label: 'Skills', sources: ['skills'] },
  { id: 'commands', label: 'Commands', sources: ['commands'] },
  { id: 'memory', label: 'Memory', sources: ['memory'] },
  { id: 'terminals', label: 'Terminals', sources: ['terminals'] },
  { id: 'processes', label: 'Processes', sources: ['processes'] },
];

function activityFilterDef(filterId) {
  return ACTIVITY_SOURCE_FILTERS.find((f) => f.id === filterId) || ACTIVITY_SOURCE_FILTERS[0];
}

function filterUnifiedActivityEvents(events, filterId) {
  const def = activityFilterDef(filterId);
  if (!def.sources) return events;
  const allowed = new Set(def.sources);
  return events.filter((ev) => allowed.has(ev.source));
}

function setActivitySourceFilter(filterId) {
  const def = activityFilterDef(filterId);
  activitySourceFilter = def.id;
  render();
  return false;
}

function onActivityFilterKeydown(event) {
  const group = event.currentTarget;
  if (!group || !event.key) return;
  const chips = Array.from(group.querySelectorAll('[role="radio"]'));
  if (chips.length === 0) return;
  const currentIdx = chips.findIndex((el) => el === document.activeElement || el.getAttribute('aria-checked') === 'true');
  let nextIdx = currentIdx;
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    event.preventDefault();
    nextIdx = currentIdx < 0 ? 0 : (currentIdx + 1) % chips.length;
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    event.preventDefault();
    nextIdx = currentIdx < 0 ? chips.length - 1 : (currentIdx - 1 + chips.length) % chips.length;
  } else if (event.key === 'Home') {
    event.preventDefault();
    nextIdx = 0;
  } else if (event.key === 'End') {
    event.preventDefault();
    nextIdx = chips.length - 1;
  } else {
    return;
  }
  const next = chips[nextIdx];
  if (!next) return;
  next.focus();
  const nextId = next.getAttribute('data-activity-filter');
  if (nextId) setActivitySourceFilter(nextId);
}

function renderActivityFilterChips() {
  const current = activityFilterDef(activitySourceFilter).id;
  return `
    <div class="activity-filter-chips" role="radiogroup" aria-label="Filter activity by source" onkeydown="onActivityFilterKeydown(event)">
      ${ACTIVITY_SOURCE_FILTERS.map((f) => {
        const selected = f.id === current;
        return `
        <button type="button"
          class="activity-filter-chip"
          role="radio"
          aria-checked="${selected ? 'true' : 'false'}"
          aria-label="${escapeAttr(`Filter activity: ${f.label}`)}"
          data-activity-filter="${escapeAttr(f.id)}"
          data-focus-key="activity-filter-${escapeAttr(f.id)}"
          id="activity-filter-${escapeAttr(f.id)}"
          tabindex="${selected ? '0' : '-1'}"
          onclick="return setActivitySourceFilter('${escapeJsString(f.id)}')">
          ${escapeHtml(f.label)}
        </button>`;
      }).join('')}
    </div>
  `;
}

function unifiedEventTime(ev) {
  return relativeTime(ev.at || ev.firstSeenAt);
}

function activityEventInfo(ev) {
  return ev.diagnostic ? feedEventInfo(ev.accent) : semanticEventInfo(ev.kind, ev.refs?.commitType);
}

function activityTargetAttributes(ev, focusPrefix, opts) {
  const kindGloss = opts && opts.kindGloss ? String(opts.kindGloss) : '';
  const pathTarget = ev.sourcePath && isSafeRepoRelativePath(ev.sourcePath) ? ev.sourcePath : '';
  const shaTarget = !pathTarget && looksLikeCommitSha(ev.refs?.sha || '') ? ev.refs.sha : '';
  const target = pathTarget || shaTarget;
  if (!target) return '';
  const verb = pathTarget ? 'Copy path for' : 'Copy commit sha for';
  const title = pathTarget
    ? pathActionTitle(pathTarget)
    : copyActionTitle(`commit ${shaTarget}`, 'terminal');
  const handler = escapeAttr(`activateSemanticTarget('${escapeJsString(target)}')`);
  const aria = kindGloss
    ? `${kindGloss}. ${verb}: ${ev.label}`
    : `${verb}: ${ev.label}`;
  return ` role="button" tabindex="0" data-focus-key="${escapeAttr(focusPrefix)}-${escapeAttr(ev.id)}" aria-label="${escapeAttr(aria)}" title="${escapeAttr(title)}" onclick="${handler}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${handler}}" style="cursor:pointer"`;
}

/**
 * Time column: real source timestamp when present.
 * Missing `at` stays empty (never falls back to kind tag — that duplicated chip text).
 */
function semanticEventTime(ev, _info) {
  if (ev.at && /^\d{4}-\d{2}-\d{2}T/.test(ev.at)) return relativeTime(ev.at);
  if (ev.at) return escapeHtml(ev.at);
  return '';
}

/**
 * Crew feed time: source timestamp first, then the client first-seen stamp so
 * every row stays timestamped even when the emitter omits `at`.
 */
function crewEventTime(ev, info) {
  const source = semanticEventTime(ev, info);
  if (source) return source;
  const seenAt = ev && ev.id ? semanticSeenAt.get(ev.id) : null;
  return seenAt ? escapeHtml(relativeTime(seenAt)) : '';
}

/**
 * Crew feed actor — WIRE value, not display. Kit agent id, else Eng for
 * delivery, else SQ when a plan is present (never the full plan filename),
 * else Eng. Mirrors briefActivityActor() in dashboard/lib/semantic-model.mjs;
 * the two must not drift, which is why the masks below live in a separate
 * layer instead of being folded in here.
 *
 * `Eng` still collides between the delivery and system fallbacks on the wire.
 * The row no longer leaves it ambiguous: crewActorRole() splits it by kind.
 * Used directly only as the aria-label fallback when a row has no label.
 */
function crewEventActor(ev) {
  if (ev && ev.agent) return String(ev.agent);
  if (ev && ev.kind === 'delivery') return 'Eng';
  if (ev && ev.refs && ev.refs.plan) return 'SQ';
  return 'Eng';
}

/**
 * Operator lexicon (design v2, 2026-08-05): wire actor -> display role.
 * Display only. The wire format is frozen — `labelFull` keeps the raw seg0
 * (`Eng`, `docs-repo`, …) and the collectors emit exactly what they emitted
 * before, so nothing here is a backend change.
 */
const CREW_ACTOR_MASK = {
  'docs-repo': 'Tech Writer',
  explore: 'Product Analyst',
  generalPurpose: 'Analyst',
  SQ: 'Scrum Master',
  Dev: 'Developer',
  QA: 'QA',
  PO: 'Product Owner',
  PM: 'Project Manager',
};

/**
 * The `Eng` split. The lexicon maps two different roles onto the same wire
 * token, and six consecutive `Eng · merged` rows were the single worst thing in
 * the shipped feed. `kind` already carries the distinction, so no new wire
 * field is needed (ACCEPTANCE.md delta B): a delivery row's `Eng` is the
 * Platform Engineer, every other `Eng` is the Engineering Manager.
 */
function crewActorEngRole(ev) {
  return ev && ev.kind === 'delivery' ? 'DevOps' : 'Tech Lead';
}

/**
 * Display role for a Crew row. Resolution order (design contract):
 * per-event `ev.role` -> mask -> raw token. `ev.role` is optional and nothing
 * renders from it today; it is honoured so a collector can override the split
 * later without another dashboard change.
 * @param {object} ev
 * @param {string} raw seg0 of the row label (falls back to crewEventActor)
 */
function crewActorRole(ev, raw) {
  if (ev && ev.role) return String(ev.role);
  const token = String(raw || crewEventActor(ev) || '').trim();
  if (token === 'Eng') return crewActorEngRole(ev);
  return CREW_ACTOR_MASK[token] || token;
}

/**
 * Badge monogram for a display role. First letter of the first two words,
 * single word -> first two chars. Two explicit overrides: Developer and DevOps
 * both start `D`+`e`/`DV`-shaped and would otherwise collide on `DE`.
 * Distinct from agentInitials(), which monograms a kebab-case agent id for the
 * Agents card; this one monograms a spaced display role.
 */
function crewActorInitials(role) {
  const special = { Developer: 'DV', DevOps: 'DO' };
  if (special[role]) return special[role];
  const words = String(role || '').trim().split(/\s+/).filter(Boolean);
  if (words.length === 0) return '?';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

/**

/** Verb -> state icon. Replaces the 6px state dot (design v2). */
const CREW_VERB_ICON = {
