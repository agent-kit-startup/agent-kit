/** Decorative row icon; unknown verbs fall back to `info` rather than nothing. */
function crewRowIconSvg(name, className) {
  const paths = CREW_VERB_ICON_PATHS[name] || CREW_VERB_ICON_PATHS.info;
  return `<svg class="${className}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}

/**
 * Split a Crew row label into the v2 column contract.
 * Refs (PR, SHA, worker id, plan) leave the flexible text so they can render as
 * fixed-content chips that hide whole instead of ellipsising. Everything left
 * over joins the primary field — the row's only wide, only ellipsising column.
 * Plan detection prefers `refs.plan` over sniffing the rendered string, since
 * the string is capped at MAX_SEMANTIC_LABEL upstream and may not carry it.
 */
function parseCrewRow(ev) {
  const segs = String((ev && ev.label) || '').split(' · ');
  const planRef = ev && ev.refs && ev.refs.plan ? String(ev.refs.plan) : '';
  const planBase = planRef.replace(/\.plan\.md$/i, '');
  const out = {
    actor: segs[0] || '',
    verb: segs[1] || '',
    mids: [],
    pr: null,
    sha: null,
    worker: null,
    plan: planRef || null,
  };
  for (let i = 2; i < segs.length; i++) {
    const seg = segs[i];
    if (/\.plan\.md$/i.test(seg) || (planRef && (seg === planRef || seg === planBase))) {
      out.plan = out.plan || seg;
      continue;
    }
    if (/^PR #\d+/.test(seg)) {
      out.pr = seg.replace(/^PR /, '');
      continue;
    }
    if (/^[0-9a-f]{7,8}$/.test(seg)) {
      // A subagent's trailing hex is a worker id, not a commit — same shape,
      // different meaning, and only the SHA chip is droppable at ≤560px.
      if (ev && ev.kind === 'subagent') out.worker = seg;
      else out.sha = seg;
      continue;
    }
    out.mids.push(seg);
  }
  // A row with no mid segments still needs something in its wide column.
  out.primary = out.mids.join(' · ') || planBase || out.verb;
  return out;
}

/** Avatar-style monogram: first letters of the first two kebab/space parts, else first two chars. */
function agentInitials(id) {
  const clean = String(id || '').trim();
  if (!clean) return '';
  const parts = clean.split(/[-_\s.]+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return clean.slice(0, 2).toUpperCase();
}

/**
 * Mission Control is read-only: it copies text to the clipboard and a human
 * pastes it. The panel cannot open a file, a chat, or an editor, so no label,
 * tooltip, aria-label, or confirmation may promise an open. These are the only
 * destinations an action is allowed to name.
 */
const PASTE_DESTINATIONS = {
  filePicker: 'file picker (Cmd+P / Ctrl+P)',
  chatInput: 'chat input',
  pastChatPicker: 'past-chat picker',
  terminal: 'terminal',
};

/**
 * Mirror of `PROMPT_RESUME_GUIDANCE` in dashboard/lib/semantic-model.mjs.
 * Inline HTML cannot import that ESM export; keep the string identical.
 * Used for Copy chat id title / aria-label only (toast stays subject-prefixed).
 */
const PROMPT_RESUME_GUIDANCE =
  'Copy the chat id, paste it into the past-chat picker to resume, then answer the pending question.';

/** Accepts a key from PASTE_DESTINATIONS or an already-resolved label. */
function pasteDestinationLabel(destination) {
  return PASTE_DESTINATIONS[destination] || destination || PASTE_DESTINATIONS.chatInput;
}

/** True when the clipboard target is a paste-only launcher (second interactive hop). */
function isPasteOnlyShellTarget(text) {
  return /\b--paste-only\b/.test(String(text || ''));
}

/** Confirmation: what was copied, and where it is pasted. */
function copyToastMessage(subject, destination, text) {
  if (destination === 'pastChatPicker') {
    return `Copied ${subject}. Paste into the past-chat picker to resume that chat, then answer the pending question.`;
  }
  if (destination === 'terminal' && isPasteOnlyShellTarget(text)) {
    return `Copied ${subject}. Paste into the terminal and run (paste-only prepares a second interactive paste; review does not start from this panel).`;
  }
  return `Copied ${subject}. Paste into the ${pasteDestinationLabel(destination)}.`;
}

/** Control tooltip / aria: pastChatPicker uses the shared resume guidance SoT. */
function copyActionTitle(subject, destination, text) {
  if (destination === 'pastChatPicker') {
    return PROMPT_RESUME_GUIDANCE;
  }
  if (destination === 'terminal' && isPasteOnlyShellTarget(text)) {
    return `Copy ${subject}. Paste into the terminal and run (paste-only prepares a second interactive paste; review does not start from this panel).`;
  }
  return `Copy ${subject}. Paste into the ${pasteDestinationLabel(destination)}.`;
}

/** Copy and confirm in one call, so every action states its destination. */
function copyForPaste(text, subject, destination) {
  return copyToClipboard(text, {
    toastMessage: copyToastMessage(subject || text, destination, text),
  });
}

/**
 * Inline handler attribute value: escape the arguments for the JS string
 * context, then escape the whole expression for the double-quoted attribute.
 */
function copyForPasteHandler(text, subject, destination) {
  return escapeAttr(
    `copyForPaste('${escapeJsString(text)}', '${escapeJsString(subject)}', '${escapeJsString(destination)}')`,
  );
}

/**
 * Shared empty-state: optional section icon + headline + support + optional copy-only CTA.
 * Reuses .empty-state-cta / .empty-state-btn. CTA must name a paste destination
 * (via copyForPasteHandler); labels stay clipboard-honest.
 * iconKind reuses spaceIconSvg (decorative); CSS scales .empty-state-icon hero.
 *
 * @param {{
 *   headline?: string,
 *   support?: string,
 *   supportHtml?: string,
 *   iconKind?: 'current-mission'|'monitor'|'field-report'|'checklist'|'more-sections',
 *   cta?: { text: string, subject?: string, destination: string, label?: string, focusKey?: string } | null,
 *   className?: string,
 *   compact?: boolean,
 * }} opts
 */
function renderEmptyStateCta(opts) {
  const headline = opts?.headline || '';
  const support = opts?.support || '';
  const supportHtml = opts?.supportHtml || '';
  const iconKind = opts?.iconKind || '';
  const cta = opts?.cta || null;
  const extra = opts?.className ? ` ${opts.className}` : '';
  const compact = opts?.compact ? ' compact' : '';
  const iconSvg = iconKind ? spaceIconSvg(iconKind, { decorative: true }) : '';
  const iconBlock = iconSvg
    ? `<div class="empty-state-icon">${iconSvg}</div>`
    : '';
  const head = headline
    ? `<div class="empty-state-headline">${escapeHtml(headline)}</div>`
    : '';
  let supportBlock = '';
  if (supportHtml) {
    supportBlock = `<p class="empty-state-support">${supportHtml}</p>`;
  } else if (support) {
    supportBlock = `<p class="empty-state-support">${escapeHtml(support)}</p>`;
  }
  let ctaBlock = '';
  let hasCta = false;
  if (cta && cta.text && cta.destination) {
    hasCta = true;
    const subject = cta.subject || cta.text;
    const label = cta.label || `Copy ${cta.text}`;
    const focus = cta.focusKey
      ? ` data-focus-key="${escapeAttr(cta.focusKey)}"`
      : '';
    ctaBlock = `<button type="button" class="empty-state-btn"${focus} onclick="${copyForPasteHandler(cta.text, subject, cta.destination)}" title="${escapeAttr(copyActionTitle(subject, cta.destination))}">\u2192 ${escapeHtml(label)}</button>`;
  }
  const ctaClass = hasCta ? ' has-cta' : '';
  return `<div class="empty-state-cta${compact}${ctaClass}${extra}">${iconBlock}${head}${supportBlock}${ctaBlock}</div>`;
}

function copyRepoPathHandler(relPath) {
  return escapeAttr(`copyRepoPath('${escapeJsString(relPath)}')`);
}

/** Path actions are copy-only; the label never says Open. */
const PATH_COPY_LABEL = 'Copy path';

/** Checklist recent-plan Actions menu: locked clipboard strings (chatInput only). */
function checklistPlanBasename(plan) {
  const file = String(plan?.file || '').trim();
  if (file) return file.split('/').pop();
  const fromPath = String(plan?.path || '')
    .trim()
    .split('/')
    .pop();
  return fromPath || '';
}

function checklistPlanActionCommands(plan) {
  const basename = checklistPlanBasename(plan);
  return {
    runManual: `/continue-plan ${basename}`,
    runAuto: `/run-plan ${basename}`,
    edit: `/backlog-edit ${basename}`,
    cancel: `/archive-plan ${basename}`,
  };
}

/**
 * Plans tab v2: next actionable to-do (in_progress first, else first pending).
 * Terminal plans return null (no next step to surface).
 */
function planNextActionTodo(items) {
  if (!Array.isArray(items) || items.length === 0) return null;
  const current = items.find((t) => t.status === 'in_progress');
  if (current) return { id: current.id || '', content: current.content || '' };
  const next = items.find((t) => t.status === 'pending');
  if (next) return { id: next.id || '', content: next.content || '' };
  return null;
}

/**
 * Plans tab v2: status-aware copy-only actions. Chat commands name the chat
 * input as paste destination; the path action names the file picker (open =
 * copy path). The first action is the row's primary next step per lifecycle:
 * active resumes, backlog runs, parked resumes, exhausted (incomplete)
 * resumes, completed opens/archives.
 */
function planTabActions(p) {
  const basename = checklistPlanBasename(p);
  const resume = { kind: 'chat', label: 'Copy resume prompt', command: `/continue-plan ${basename}` };
  const run = { kind: 'chat', label: 'Copy run command', command: `/run-plan ${basename}` };
  const edit = { kind: 'chat', label: 'Copy edit command', command: `/backlog-edit ${basename}` };
  const archive = { kind: 'chat', label: 'Copy archive command', command: `/archive-plan ${basename}` };
  const path = { kind: 'path', label: 'Copy plan path' };
  switch (p?.lifecycle) {
    case 'executing':
    case 'awaiting_user':
      return [resume, run, path];
    case 'backlog':
      return [run, edit, path];
    case 'parked':
      return [resume, path];
    case 'incomplete':
      return [resume, run, path];
    case 'completed':
      return [path, archive];
    default:
      return [resume, path];
  }
}

function renderPlanTabActionButton(action, p, key, idx) {
  const primary = idx === 0 ? ' plan-action-primary' : '';
  const focusKey = `plan-act-${escapeAttr(key)}-${idx}`;
  if (action.kind === 'path') {
    return `<button type="button" class="status-bar-btn${primary}" data-focus-key="${focusKey}" onclick="event.stopPropagation();${copyRepoPathHandler(p.path)}" title="${escapeAttr(pathActionTitle(p.path))}">${escapeHtml(action.label)}</button>`;
  }
  return `<button type="button" class="status-bar-btn${primary}" data-focus-key="${focusKey}" onclick="event.stopPropagation();${copyForPasteHandler(action.command, action.command, 'chatInput')}" title="${escapeAttr(copyActionTitle(action.command, 'chatInput'))}">${escapeHtml(action.label)}</button>`;
}

let openRecentPlanActionsKey = null;

/** Anchor the fixed Actions menu above or below the trigger; escape panel overflow. */
function positionRecentPlanActions() {
  const key = openRecentPlanActionsKey;
  if (!key) return;
  const btn = document.getElementById(`recent-plan-actions-${key}`);
  const menu = document.getElementById(`recent-plan-menu-${key}`);
  if (!btn || !menu || menu.hidden) return;
  const gap = 4;
  const margin = 8;
  const rect = btn.getBoundingClientRect();
  // Clear prior max-height so natural height drives the above/below choice.
  menu.style.maxHeight = '';
  const naturalHeight = menu.offsetHeight;
  const spaceAbove = rect.top - margin;
  const spaceBelow = window.innerHeight - rect.bottom - margin;
  const need = naturalHeight + gap;
  let openAbove;
  if (spaceAbove >= need) openAbove = true;
  else if (spaceBelow >= need) openAbove = false;
  else openAbove = spaceAbove >= spaceBelow;

  let top;
  if (openAbove) {
    const maxHeight = Math.max(80, spaceAbove - gap);
    menu.style.maxHeight = `${maxHeight}px`;
    const h = menu.offsetHeight;
    top = rect.top - gap - h;
    if (top < margin) top = margin;
  } else {
    const maxHeight = Math.max(80, spaceBelow - gap);
    menu.style.maxHeight = `${maxHeight}px`;
    top = rect.bottom + gap;
  }

  const width = menu.offsetWidth || 160;
  let left = rect.right - width;
  const maxLeft = window.innerWidth - width - margin;
  if (left > maxLeft) left = maxLeft;
  if (left < margin) left = margin;
  menu.style.top = `${Math.round(top)}px`;
  menu.style.left = `${Math.round(left)}px`;
}

function closeRecentPlanActions(opts) {
  const restoreFocus = !opts || opts.restoreFocus !== false;
  const key = openRecentPlanActionsKey;
  if (!key) return;
  const btn = document.getElementById(`recent-plan-actions-${key}`);
  const menu = document.getElementById(`recent-plan-menu-${key}`);
  if (menu) {
    menu.hidden = true;
    menu.style.top = '';
    menu.style.left = '';
    menu.style.maxHeight = '';
  }
  if (btn) {
    btn.setAttribute('aria-expanded', 'false');
    if (restoreFocus) btn.focus();
  }
  openRecentPlanActionsKey = null;
}

function openRecentPlanActions(key) {
  if (openRecentPlanActionsKey && openRecentPlanActionsKey !== key) {
    closeRecentPlanActions({ restoreFocus: false });
  }
  const btn = document.getElementById(`recent-plan-actions-${key}`);
  const menu = document.getElementById(`recent-plan-menu-${key}`);
  if (!btn || !menu) return;
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  openRecentPlanActionsKey = key;
  positionRecentPlanActions();
  const first = menu.querySelector('.recent-plan-actions-item');
  if (first) first.focus();
}

function toggleRecentPlanActions(key) {
  if (openRecentPlanActionsKey === key) closeRecentPlanActions({ restoreFocus: true });
  else openRecentPlanActions(key);
}

function copyChecklistPlanAction(text, subject) {
  copyForPaste(text, subject, 'chatInput');
  closeRecentPlanActions({ restoreFocus: false });
}

/** Checklist Actions: path copy (filePicker), not chat paste. */
function copyChecklistPlanPath(relPath) {
  copyRepoPath(relPath);
  closeRecentPlanActions({ restoreFocus: false });
}

document.addEventListener('click', (e) => {
  if (!openRecentPlanActionsKey) return;
  const wrap = e.target.closest?.('.recent-plan-actions');
  if (wrap) return;
  closeRecentPlanActions({ restoreFocus: false });
});

document.addEventListener('keydown', (e) => {
  if (!openRecentPlanActionsKey) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeRecentPlanActions({ restoreFocus: true });
    return;
  }
  const menu = document.getElementById(`recent-plan-menu-${openRecentPlanActionsKey}`);
  if (!menu || menu.hidden) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Home' && e.key !== 'End') return;
  const items = [...menu.querySelectorAll('.recent-plan-actions-item')];
  if (items.length === 0) return;
  const i = items.indexOf(document.activeElement);
  e.preventDefault();
  let next = i < 0 ? 0 : i;
  if (e.key === 'ArrowDown') next = (i + 1) % items.length;
  else if (e.key === 'ArrowUp') next = (i - 1 + items.length) % items.length;
  else if (e.key === 'Home') next = 0;
  else if (e.key === 'End') next = items.length - 1;
  items[next]?.focus();
});

window.addEventListener('resize', () => {
  if (openRecentPlanActionsKey) positionRecentPlanActions();
});
// Capture scroll on Checklist panel (and any ancestor) while the menu is open.
document.addEventListener(
  'scroll',
  () => {
    if (openRecentPlanActionsKey) positionRecentPlanActions();
  },
  true,
);

function pathCopyToastMessage(relPath) {
  return copyToastMessage(relPath, 'filePicker');
}

function pathActionTitle(relPath) {
  return copyActionTitle(`path ${relPath}`, 'filePicker');
}

/** Keep in sync with dashboard/lib/guards.mjs isSafeRepoRelativePath. */
function isSafeRepoRelativePath(relPath) {
  if (typeof relPath !== 'string') return false;
  const p = relPath.trim().replace(/\\/g, '/');
  if (!p || p.length > 240) return false;
  if (p.startsWith('/') || /^[A-Za-z]:\//.test(p)) return false;
  if (p.includes('\0') || p.includes('://')) return false;
  const parts = p.split('/');
  if (parts.some((part) => part === '' || part === '.' || part === '..')) return false;
  return true;
}

function looksLikeCommitSha(target) {
  return typeof target === 'string' && /^[0-9a-f]{7,40}$/i.test(target.trim());
}

/** Copy a repo-relative path and name the destination that receives it. */
async function copyRepoPath(relPath) {
  if (!relPath) return;
  await copyToClipboard(relPath, {
    toastMessage: pathCopyToastMessage(relPath),
  });
}

/** Activity rows: copy a repo path, or copy a commit sha for the terminal. */
function activateSemanticTarget(target) {
  if (!target) return;
  if (isSafeRepoRelativePath(target)) {
    copyRepoPath(target);
    return;
  }
  copyForPaste(target, `commit ${target}`, 'terminal');
}

// ===== Plan file path action (copy + paste destination) =====
function copyPlanPath(planPath) {
  if (!planPath) return;
  copyRepoPath(planPath);
}

// ===== Copy /git-staging (no server-side git mutation) =====
function copyGitStagingCommand() {
  copyForPaste('/git-staging', '/git-staging', 'chatInput');
}

/**
 * Manual / continue-plan Mode strings (HANDOFF `- **Mode:**`).
 * Continuous (`run-plan`) and queue (`run-plan-all`) are never manual.
 */
function isManualPlanMode(modeLabel) {
  if (!modeLabel || typeof modeLabel !== 'string') return false;
  const m = modeLabel.trim().toLowerCase();
  if (!m) return false;
  if (/\brun-plan(?:-all)?\b/.test(m)) return false;
  return m === 'manual' || m.startsWith('manual') || /\bcontinue-plan\b/.test(m);
}

/**
 * Display-only Mode label for Current mission meta.
 * Maps slash-command Mode tokens to operator-friendly copy.
 * Never rewrite HANDOFF `- **Mode:**`; parsers keep using the raw string.
 * @param {string|null|undefined} modeLabel
 * @returns {string}
 */
function formatModeDisplayLabel(modeLabel) {
  if (!modeLabel || typeof modeLabel !== 'string') return '';
  const raw = modeLabel.trim();
  if (!raw) return '';

  // Preserve leading STOPPED forms, mapping any inner run-plan* tokens.
  const stoppedLead = raw.match(/^STOPPED\b(.*)$/i);
  if (stoppedLead) {
    const rest = stoppedLead[1].trim();
    if (!rest) return 'STOPPED';
    const innerParen = rest.match(/^\((.+)\)$/);
    if (innerParen) {
      return `STOPPED (${mapModeDisplayCore(innerParen[1])})`;
    }
    return `STOPPED ${mapModeDisplayCore(rest)}`.trim();
  }

  // Preserve trailing hard-stop cue (em dash / en dash / hyphen before STOPPED).
  const stoppedTrail = raw.match(/^(.+?)\s*[—–-]\s*(STOPPED\b.*)$/i);
  if (stoppedTrail) {
    return `${mapModeDisplayCore(stoppedTrail[1])} — ${stoppedTrail[2].trim()}`;
  }

  return mapModeDisplayCore(raw);
}

/** Core Mode token → friendly label (no STOPPED handling). */
function mapModeDisplayCore(core) {
  const text = String(core || '').trim();
  if (!text) return '';
  const lower = text.toLowerCase();

  if (/\brun-plan-all\b/.test(lower)) {
    return 'run all (batch auto mode)';
  }
  if (/\brun-plan\b/.test(lower)) {
    const strat = text.match(/\(([^)]+)\)/);
    if (strat) return `auto mode (${strat[1].trim()})`;
    return 'auto mode';
  }
  if (
    lower === 'manual' ||
    lower.startsWith('manual') ||
    /\bcontinue-plan\b/.test(lower)
  ) {
    return 'human-in-the-loop (manual)';
  }
  return text;
}

/** Paste text for Current mission continue CTA (optional plan basename). */
function continuePlanPasteText(planName) {
  const base = String(planName || '')
    .trim()
    .split('/')
    .pop();
  if (base) return `/continue-plan ${base}`;
  return '/continue-plan';
}

function copyContinuePlanCommand(planName) {
  const text = continuePlanPasteText(planName);
  copyForPaste(text, text, 'chatInput');
}

/** Short operator note when Mode is manual (copy-only; never mutates git). */
function renderNowModeHint(modeLabel) {
  if (!isManualPlanMode(modeLabel)) return '';
  return `<p class="now-mode-hint" role="note">Manual mode: confirm the unit in chat, then open a <strong>new conversation</strong> and paste /continue-plan for the next phase. Copy /git-staging when there is a diff. Never auto /git-prod.</p>`;
}

// ===== Git file helpers (Phase 2) =====
function shellQuotePath(path) {
  return `"${String(path ?? '').replace(/"/g, '\\"')}"`;
}

function gitFileStatusLabel(f) {
  if (f.untracked) return 'untracked';
  const parts = [];
  if (f.staged) parts.push('staged');
  if (f.unstaged) parts.push('unstaged');
  if (parts.length) return parts.join(' + ');
  return f.status || 'changed';
}

function gitFileStatusClass(f) {
  if (f.untracked) return 'untracked';
  if (f.staged && !f.unstaged) return 'staged';
  if (f.unstaged) return 'unstaged';
  return '';
}

function gitFileDiffCommand(f, kind) {
  const q = shellQuotePath(f.path);
  if (kind === 'staged') return `git diff --cached -- ${q}`;
  return `git diff -- ${q}`;
}

function renderGitFileRow(f) {
  const label = gitFileStatusLabel(f);
  const statusClass = gitFileStatusClass(f);
  const title = f.oldPath ? `${f.oldPath} → ${f.path}` : f.path;
  let actions = '';
  if (f.untracked) {
    actions = '<span style="font-size:10px;color:var(--text-muted)">no diff vs HEAD</span>';
  } else {
    const btns = [];
    if (f.unstaged) {
      const cmd = gitFileDiffCommand(f, 'unstaged');
      const subject = 'unstaged diff command';
      btns.push(`<button type="button" class="git-file-copy-btn" onclick="event.stopPropagation();${copyForPasteHandler(cmd, subject, 'terminal')}" title="${escapeAttr(copyActionTitle(subject, 'terminal'))}">Copy unstaged diff</button>`);
    }
    if (f.staged) {
      const cmd = gitFileDiffCommand(f, 'staged');
      const subject = 'staged diff command';
      btns.push(`<button type="button" class="git-file-copy-btn" onclick="event.stopPropagation();${copyForPasteHandler(cmd, subject, 'terminal')}" title="${escapeAttr(copyActionTitle(subject, 'terminal'))}">Copy staged diff</button>`);
    }
    actions = btns.join('');
  }
  return `
    <div class="git-file-item">
      <span class="git-file-status ${escapeAttr(statusClass)}" title="${escapeAttr(f.status || '')}">${escapeHtml(label)}</span>
      <span class="git-file-path" title="${escapeAttr(title)}">${escapeHtml(f.path)}</span>
      <span class="git-file-actions">${actions}</span>
    </div>
  `;
}

function renderGitFileList(git) {
  const files = git?.files || [];
  if (!files.length) return '';
  const hasStaged = files.some(f => f.staged);
  const hasUnstaged = files.some(f => f.unstaged);
  const truncatedNote = git.filesTruncated
    ? `<div style="font-size:10px;color:var(--text-muted);margin-top:4px">Showing first ${files.length} of ${git.dirtyCount} files</div>`
    : '';
  return `
    <div class="git-file-list">
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-weight:600">${git.dirtyCount} changed file${git.dirtyCount !== 1 ? 's' : ''}</div>
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <button type="button" class="git-action-btn primary" onclick="copyGitStagingCommand()" title="${escapeAttr(copyActionTitle('/git-staging', 'chatInput'))}">Copy /git-staging</button>
        ${hasUnstaged ? `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler('git diff', 'git diff for all files', 'terminal')}" title="${escapeAttr(copyActionTitle('git diff for all files', 'terminal'))}">Copy git diff</button>` : ''}
        ${hasStaged ? `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler('git diff --cached', 'git diff --cached for all files', 'terminal')}" title="${escapeAttr(copyActionTitle('git diff --cached for all files', 'terminal'))}">Copy git diff --cached</button>` : ''}
      </div>
      ${files.map(renderGitFileRow).join('')}
      ${truncatedNote}
    </div>
  `;
}

// ===== Git tab v2: promotion flow lanes + graph + staging hygiene (Phase 4) =====
/** Divergence badge: sync (green), ahead (yellow), behind (orange). */
function gitFlowBadge(div) {
  if (!div) return '<span class="git-flow-badge">no upstream</span>';
  const bits = [];
  if (div.ahead > 0) bits.push(`<span class="git-flow-badge is-ahead">ahead ${div.ahead}</span>`);
  if (div.behind > 0) bits.push(`<span class="git-flow-badge is-behind">behind ${div.behind}</span>`);
  if (!bits.length) bits.push('<span class="git-flow-badge is-sync">in sync</span>');
  return bits.join(' ');
}

/**
 * State label + dot per Phase 1 dot semantics (state only, always paired
 * with a label). tone: green = good/in sync, yellow = important (promotion
 * pending or branch ahead), red never used here (git surface is read-only).
 */
function gitFlowStateLabel(div, { syncText, aheadText, behindText }) {
  if (!div) return { tone: null, text: 'upstream unavailable' };
  if (div.ahead === 0 && div.behind === 0) return { tone: 'green', text: syncText };
  if (div.ahead > 0 && div.behind === 0) return { tone: 'yellow', text: aheadText(div.ahead) };
  if (div.ahead === 0 && div.behind > 0) return { tone: 'yellow', text: behindText(div.behind) };
  return { tone: 'yellow', text: `diverged (ahead ${div.ahead}, behind ${div.behind})` };
}

function gitFlowDot(tone) {
  return tone ? `<span class="dot dot-${tone}" aria-hidden="true"></span>` : '';
}

function renderGitFlowRow({ from, to, div, texts, cta }) {
  const state = gitFlowStateLabel(div, texts);
  return `
    <div class="git-flow-row">
      <span class="git-flow-lane">${escapeHtml(from)}</span>
      <span class="git-flow-arrow" aria-hidden="true">&rarr;</span>
      <span class="git-flow-lane">${escapeHtml(to)}</span>
      <span class="git-flow-state">${gitFlowDot(state.tone)}<span>${escapeHtml(state.text)}</span>${gitFlowBadge(div)}</span>
      ${cta || ''}
    </div>
  `;
}

/** Promotion flow lanes: work -> staging -> main (what Cursor's git panel does not show). */
function renderGitFlowCard(git) {
  const flow = git?.flow || {};
  const branch = git?.branch || 'HEAD';
  const rows = [];
  rows.push(renderGitFlowRow({
    from: branch,
    to: 'origin/staging',
    div: flow.vsStaging,
    texts: {
      syncText: 'Nothing to promote',
      aheadText: (n) => `${n} commit${n !== 1 ? 's' : ''} ready for staging`,
      behindText: (n) => `${n} commit${n !== 1 ? 's' : ''} behind staging`,
    },
    cta: flow.vsStaging && flow.vsStaging.ahead > 0
      ? `<button type="button" class="git-action-btn primary git-flow-cta" onclick="copyGitStagingCommand()" title="${escapeAttr(copyActionTitle('/git-staging', 'chatInput'))}">Copy /git-staging</button>`
      : '',
  }));
  rows.push(renderGitFlowRow({
    from: 'origin/staging',
    to: 'origin/main',
    div: flow.stagingVsMain,
    texts: {
      syncText: 'main is current',
      aheadText: (n) => `${n} commit${n !== 1 ? 's' : ''} awaiting promotion to main`,
      behindText: (n) => `staging is ${n} commit${n !== 1 ? 's' : ''} behind main`,
    },
    cta: flow.stagingVsMain && flow.stagingVsMain.ahead > 0
      ? `<button type="button" class="git-action-btn git-flow-cta" onclick="${copyForPasteHandler('/git-prod', '/git-prod', 'chatInput')}" title="${escapeAttr(copyActionTitle('/git-prod', 'chatInput'))}">Copy /git-prod</button>`
      : '',
  }));
  rows.push(renderGitFlowRow({
    from: branch,
    to: 'origin/main',
    div: flow.vsMain,
    texts: {
      syncText: 'In sync with main',
      aheadText: (n) => `${n} commit${n !== 1 ? 's' : ''} not yet in main`,
      behindText: (n) => `${n} commit${n !== 1 ? 's' : ''} behind main`,
    },
    cta: '',
  }));
  return `<div class="git-flow" aria-label="Promotion flow: work to staging to main">${rows.join('')}</div>`;
}

/** Readable git graph: pre-rendered branch lanes + merges from git log --graph. */
function renderGitGraphCard(git) {
  const lines = Array.isArray(git?.graph) ? git.graph : [];
  if (!lines.length) return '';
  return `
    <div class="git-graph-title">Recent history (all branches, ${lines.length} lines)</div>
    <pre class="git-graph" aria-label="Git commit graph with branch lanes and merges">${escapeHtml(lines.join('\n'))}</pre>
  `;
}

/** Staging hygiene: untracked plan-monitor WIP (add-by-name only; ADR 2026-07-29 R14). */
function renderGitHygieneHint(git) {
  const wip = git?.hygiene?.monitorWip || [];
  if (!wip.length) return '';
  return `
    <div class="git-hygiene" role="status">
      <div class="git-hygiene-body">
        <div class="git-hygiene-title"><span class="dot dot-yellow" aria-hidden="true"></span> Staging hygiene: ${wip.length} untracked plan-monitor file${wip.length !== 1 ? 's' : ''}</div>
        <div>Stage monitor files add-by-name only; never a broad <code>git add</code> of <code>.cursor/memory/</code>.</div>
        <div class="git-hygiene-paths">${wip.map((p) => escapeHtml(p)).join('<br>')}</div>
      </div>
      <button type="button" class="git-action-btn git-flow-cta" onclick="copyGitStagingCommand()" title="${escapeAttr(copyActionTitle('/git-staging', 'chatInput'))}">Copy /git-staging</button>
    </div>
  `;
}

// ===== Copy to clipboard + toast (Phase 1) =====
/** Fallback confirmation. Callers should pass a destination-aware message. */
function copyToastLabel(text) {
  return text ? `Copied ${text}` : 'Copied';
}

async function copyToClipboard(text, options) {
  const opts = options || {};
  const label = opts.toastMessage || copyToastLabel(text);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      if (!opts.silent) showToast(label, !!opts.isError);
      return;
    }
    throw new Error('Clipboard API unavailable');
  } catch {
    const raw = String(text || '');
    const preview = raw.length > 120 ? `${raw.slice(0, 117)}...` : raw;
    showToast(`Copy failed - select manually: ${preview}`, true);
  }
}

// ===== Show toast notification (Phase 1/3) =====
let toastTimeout = null;
function showToast(message, isError) {
  let toast = document.querySelector('.copied-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'copied-toast';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    toast.setAttribute('aria-atomic', 'true');
    document.body.appendChild(toast);
  }
  toast.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  toast.style.color = isError ? 'var(--red)' : 'var(--green)';
  toast.innerHTML = (isError ? '<span>\u2715</span> ' : '<span>\u2713</span> ') + escapeHtml(message);
  // Remove any previous animation class to restart
  toast.classList.remove('visible', 'animating');
  void toast.offsetWidth;
  toast.classList.add('animating');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('animating');
  }, 2000);
}

function collectMissionConfigPayload() {
  const autoHandoff = !!document.getElementById('config-autoHandoff')?.checked;
  const cooldownRaw = document.getElementById('config-interTickCooldownMs')?.value;
  const interTickCooldownMs = Number.parseInt(String(cooldownRaw || '0'), 10);
  const payload = {
    autoHandoff,
    interTickCooldownMs: Number.isFinite(interTickCooldownMs) ? interTickCooldownMs : 0,
    fieldReportReviewCadence: {
      enabled: !!document.getElementById('config-cadence-enabled')?.checked,
      tickThreshold: (() => {
        const raw = document.getElementById('config-cadence-threshold')?.value;
        const n = Number.parseInt(String(raw || '3'), 10);
        return Number.isFinite(n) && n >= 1 ? n : 3;
      })(),
    },
    updateCheck: {
      enabled: !!document.getElementById('config-updateCheck-enabled')?.checked,
      intervalDays: (() => {
        const raw = document.getElementById('config-updateCheck-intervalDays')?.value;
        const n = Number.parseInt(String(raw || '7'), 10);
        return Number.isFinite(n) && n >= 1 ? n : 7;
      })(),
    },
    externalPlanReview: {
      enabled: !!document.getElementById('config-epr-enabled')?.checked,
      offerOnExhausted: !!document.getElementById('config-epr-offer')?.checked,
      autoRemediate: !!document.getElementById('config-epr-auto')?.checked,
      backend: document.getElementById('config-epr-backend')?.value || 'claude',
      reviewerModel: (document.getElementById('config-epr-reviewerModel')?.value || 'sonnet').trim(),
      advisorModel: (document.getElementById('config-epr-advisorModel')?.value || 'opus').trim(),
      waitSliceSeconds: (() => {
        const raw = document.getElementById('config-epr-waitSlice')?.value;
        const n = Number.parseInt(String(raw || '90'), 10);
        return Number.isFinite(n) && n >= 1 ? n : 90;
      })(),
      waitTimeoutSeconds: (() => {
        const raw = document.getElementById('config-epr-waitTimeout')?.value;
        const n = Number.parseInt(String(raw || '900'), 10);
        return Number.isFinite(n) && n >= 1 ? n : 900;
      })(),
      mode: document.getElementById('config-epr-mode')?.value || 'paste',
      midBatchAudits: !!document.getElementById('config-epr-midBatch')?.checked,
      preflight: document.getElementById('config-epr-preflight')?.value || 'off',
    },
    agentPersona: {
      default: document.getElementById('config-persona-default')?.value || 'autopilot',
      modes: {},
    },
  };
  for (const mode of CONFIG_PERSONA_MODES) {
    const el = document.getElementById(`config-persona-${mode.id}`);
    if (!el) continue;
    // Empty = Inherit default: send null so merge deletes a stored override.
    payload.agentPersona.modes[mode.id] = el.value ? el.value : null;
  }
  return payload;
}

/* Copy-only CRUD fallback: snippets reflect current form values and go to the
   clipboard only. No write surface is added; paste target is config.json. */
const CONFIG_SNIPPET_GROUPS = {
  session: ['autoHandoff', 'interTickCooldownMs', 'fieldReportReviewCadence'],
  updateCheck: ['updateCheck'],
  audits: ['externalPlanReview'],
  personas: ['agentPersona'],
};

function copyConfigSnippet(group) {
  const keys = CONFIG_SNIPPET_GROUPS[group];
  if (!keys) return false;
  const payload = collectMissionConfigPayload();
  const snippet = {};
  for (const key of keys) snippet[key] = payload[key];
  void copyToClipboard(JSON.stringify(snippet, null, 2), {
    toastMessage: 'Copied config snippet - paste into .cursor/context/config.json',
  });
  return false;
}

/* Static copy-only snippets for knobs the tab can never write (allowlist unchanged). */
const CONFIG_STATIC_SNIPPETS = {
  updateApply: { updateApply: { auto: false } },
  dogfood: { dogfood: { factoryRoot: '/absolute/path/to/agent-kit-dev' } },
};

function copyStaticConfigSnippet(id) {
  const snippet = CONFIG_STATIC_SNIPPETS[id];
  if (!snippet) return false;
  void copyToClipboard(JSON.stringify(snippet, null, 2), {
    toastMessage: 'Copied config snippet - paste into .cursor/context/config.json (not writable via tab)',
  });
  return false;
}

async function saveMissionConfig(event) {
  if (event && typeof event.preventDefault === 'function') event.preventDefault();
  const btn = document.getElementById('config-save-btn');
  if (btn) btn.disabled = true;

  const payload = collectMissionConfigPayload();

  try {
    const res = await fetch('/api/config', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    let body = null;
    try {
      body = await res.json();
    } catch (_) {
      body = null;
    }
    if (!res.ok) {
      const msg = body && body.error ? String(body.error) : `Save failed (${res.status})`;
      showToast(msg, true);
      return false;
    }
    if (body && body.config && data && data.system) {
      data.system.config = body.config;
    }
    showToast('Config saved', false);
    if (typeof fetchData === 'function') {
      try { await fetchData({ force: true }); } catch (_) { /* ignore */ }
    }
  } catch (err) {
    showToast(err && err.message ? err.message : 'Save failed', true);
  } finally {
    if (btn) btn.disabled = false;
  }
  return false;

function healthCheckSeverity(check, aggregateStatus) {
  // Per-check levels are ok | warning | degraded only. Aggregate snapshot/serve
  // `error` is empty-checks (presence + empty state); producers never emit
  // status:error with checks present, so do not invent a per-check error sev.
  if (check && check.ok) return 'ok';
  if (aggregateStatus === 'degraded') return 'degraded';
  return 'warning';
}

// ===== Get connection uptime (Phase 2) =====
function getConnectionUptime() {
  if (sseMode !== 'live') return '';
  const secs = Math.round((Date.now() - lastEventTime) / 1000);
  if (secs < 5) return 'just connected';
  if (secs < 60) return `Live for ${secs}s`;
  const mins = Math.floor(secs / 60);
  const remainSecs = secs % 60;
  if (mins < 60) return `Live for ${mins}m ${remainSecs}s`;
  const hrs = Math.floor(mins / 60);
  return `Live for ${hrs}h ${mins % 60}m`;
}

function showTerminalPopup(content, title) {
  const overlay = document.createElement('div');
  overlay.className = 'terminal-popup-overlay';

  const popup = document.createElement('div');
  popup.className = 'terminal-popup';

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'terminal-popup-close';
  closeBtn.textContent = '\u2715';
  closeBtn.addEventListener('click', () => overlay.remove());

  const titleEl = document.createElement('div');
  titleEl.style.fontWeight = '600';
  titleEl.style.color = 'var(--text-primary)';
  titleEl.style.marginBottom = '10px';
  titleEl.textContent = title;

  pre.style.margin = '0';

// ===== Single header transport + freshness signal =====
function updateTransportChrome() {
  const statusDot = document.getElementById('statusDot');
  const statusLabel = document.getElementById('statusLabel');
  const sseTimer = document.getElementById('sseTimer');
  const headerStatus = document.getElementById('headerStatus');
  if (!statusDot || !statusLabel) return;

  const healthStatus = data?.health?.status || 'ok';
  const healthChrome = healthSeverityChrome(healthStatus);
  const healthTone = healthChrome.tone;

  if (sseReconnecting) {
    statusDot.className = 'dot dot-yellow dot-pulse reconnecting-pulse';
    statusLabel.textContent = sseFailedAttempts > 0
      ? `Reconnecting (${sseFailedAttempts})`
      : 'Reconnecting…';
  } else if (sseMode === 'live' && sseSilentFallback) {
    // Stream still open, but no data payloads: poll is the active transport.
    statusDot.className = 'dot dot-yellow';
    statusLabel.textContent = 'Catching up';
  } else if (sseMode === 'live') {
    // Steady dot while healthy; pulse only when health is not ok
    statusDot.className = healthStatus === 'ok'
      ? 'dot dot-green'
      : `dot dot-${healthTone} dot-pulse`;
    statusLabel.textContent = healthStatus === 'ok'
      ? 'Live'
      : healthChrome.label.charAt(0).toUpperCase() + healthChrome.label.slice(1);
  } else {
    statusDot.className = `dot dot-${healthStatus === 'ok' ? 'yellow' : healthTone}`;
    statusLabel.textContent = healthStatus === 'ok'
      ? 'Polling'
      : healthChrome.label.charAt(0).toUpperCase() + healthChrome.label.slice(1);
  }

  if (sseTimer) {
    if (sseMode === 'live' && sseSilentFallback) {
      sseTimer.textContent = 'every 5s';
    } else if (sseMode === 'live') {
      const secs = Math.round((Date.now() - lastSseDataTime) / 1000);
      sseTimer.textContent = secs < 60 ? `${secs}s ago` : `${Math.floor(secs / 60)}m ago`;
    } else if (sseMode === 'polling') {
      sseTimer.textContent = 'every 5s';
    } else {
      sseTimer.textContent = '';
    }
  }

  if (headerStatus) {
    const secs = Math.round((Date.now() - lastEventTime) / 1000);
    const freshness = Number.isFinite(secs)
      ? (secs < 60 ? `${secs}s since last event` : `${Math.floor(secs / 60)}m since last event`)
      : 'awaiting first event';
    headerStatus.title = `${statusLabel.textContent} · ${freshness}`;
  }
}

// ===== Diffing helpers =====
function diffProcesses(prev, curr) {
  if (!prev || !curr) return;
  const prevPids = new Set(prev.map(p => p.pid));
  const currPids = new Set(curr.map(p => p.pid));
  for (const p of curr) {
    if (!prevPids.has(p.pid)) {
      addActivity(`Process started: ${p.label} (PID ${p.pid})`, 'started', {
        id: `diag:process:started:${diagnosticIdPart(p.pid)}`,
        kind: 'process',
        source: 'processes',
      });
    }
  }
  for (const p of prev) {
    if (!currPids.has(p.pid)) {
      addActivity(`Process stopped: ${p.label} (PID ${p.pid})`, 'stopped', {
        id: `diag:process:stopped:${diagnosticIdPart(p.pid)}`,
        kind: 'process',
        source: 'processes',
      });
    }
  }
}

function diffTerminals(prev, curr) {
  if (!prev || !curr) return;
  const prevMap = new Map(prev.map(t => [t.id, t]));
  const currMap = new Map(curr.map(t => [t.id, t]));
  for (const t of curr) {
    const prevT = prevMap.get(t.id);
    if (!prevT) {
      addActivity(`Terminal added: ${t.id}`, 'started', {
        id: `diag:terminal:added:${diagnosticIdPart(t.id)}`,
        kind: 'terminal',
        source: 'terminals',
      });
    } else if (t.outputLines > prevT.outputLines) {
      addActivity(`Terminal activity: ${t.id} (${prevT.outputLines} -> ${t.outputLines} lines)`, 'info', {
        id: `diag:terminal:activity:${diagnosticIdPart(t.id)}`,
        kind: 'terminal',
        source: 'terminals',
        update: true,
      });
    }
  }
  for (const t of prev) {
    if (!currMap.has(t.id)) {
      addActivity(`Terminal removed: ${t.id}`, 'stopped', {
        id: `diag:terminal:removed:${diagnosticIdPart(t.id)}`,
        kind: 'terminal',
        source: 'terminals',
      });
    }
  }
}

function capturePanelScrollOffsets() {

function restorePanelScrollOffsets(panelScrolls) {
  if (!panelScrolls || panelScrolls.length === 0) return;
  for (const entry of panelScrolls) {

    const host = document.getElementById(entry.hostId);

function captureUiState() {
  const contentEl = document.getElementById('content');
  const active = document.activeElement;
  let focusKey = null;
  if (active && contentEl && contentEl.contains(active)) {
    if (active.id) focusKey = { type: 'id', value: active.id };
    else if (active.getAttribute('data-focus-key')) {
      focusKey = { type: 'focus-key', value: active.getAttribute('data-focus-key') };
    } else if (active.classList.contains('status-bar-btn') || active.classList.contains('empty-state-btn')) {
      focusKey = { type: 'text', value: (active.textContent || '').trim() };
    }
  }
  return {
    scrollTop: contentEl ? contentEl.scrollTop : 0,
    focusKey,
    panelScrolls: capturePanelScrollOffsets(),
    openRecentPlanActionsKey,
  };
}

function restoreUiState(state) {
  if (!state) return;
  const contentEl = document.getElementById('content');
  if (contentEl) {
    if (pendingAnchorScroll && Date.now() < pendingAnchorScroll.until) {
      // Keep the deadline: repeated ticks must not extend the takeover.
      scrollToCockpitAnchor(pendingAnchorScroll.id, { track: false });
    } else {
      pendingAnchorScroll = null;
      contentEl.scrollTop = state.scrollTop || 0;
      restorePanelScrollOffsets(state.panelScrolls);
    }
  }
  if (state.openRecentPlanActionsKey) {
    const key = state.openRecentPlanActionsKey;
    if (document.getElementById(`recent-plan-actions-${key}`)) {
      openRecentPlanActions(key);
    }
  }
  if (!state.focusKey) return;
  let target = null;
  if (state.focusKey.type === 'id') {
    target = document.getElementById(state.focusKey.value);
  } else if (state.focusKey.type === 'focus-key') {
    target = document.querySelector(`[data-focus-key="${CSS.escape(state.focusKey.value)}"]`);
  } else if (state.focusKey.type === 'text') {
    target = Array.from(document.querySelectorAll('button')).find(
      (btn) => (btn.textContent || '').trim() === state.focusKey.value,
    );
  }
  if (target && typeof target.focus === 'function') {
    try {
      target.focus({ preventScroll: true });
    } catch {
      target.focus();
    }
  }
}

function nowStatusMeta(status) {
  if (status === 'executing') {

  }
  if (status === 'completed') {
    return { key: 'completed', label: 'Completed', mark: '\u2713', live: false };
  }
  return { key: 'idle', label: 'Idle', mark: '\u25CB', live: false };
}

function lifecycleMeta(lifecycle) {
  const map = {
    executing: { key: 'executing', label: 'Executing', mark: '\u25B6' },
    awaiting_user: { key: 'awaiting', label: 'Awaiting', mark: '\u23EF' },
    parked: { key: 'parked', label: 'Parked', mark: '\u20E0' },
    backlog: { key: 'backlog', label: 'Backlog', mark: '\u23F9' },
    incomplete: { key: 'incomplete', label: 'Incomplete', mark: '\u26A0' },
    completed: { key: 'completed', label: 'Completed', mark: '\u2713' },
  };
  return map[lifecycle] || { key: 'unknown', label: lifecycle || 'Unknown', mark: '\u25CB' };
}

function planDomKey(plan) {
  return String(plan?.file || plan?.id || plan?.path || 'plan')
    .replace(/[^a-zA-Z0-9_-]/g, '_');
}

/** Merge snapshot plans with missionControl lifecycle enrichment. */
function mergePlansForUi(d) {
  const classified = d.missionControl?.plans || [];
  const byKey = new Map();
  for (const c of classified) {
    const key = String(c.file || c.path || c.id || '')
      .split('/')
      .pop();
    if (key) byKey.set(key, c);
  }
  return (d.plans || []).map((raw) => {
    const key = String(raw.file || raw.path || raw.id || '')
      .split('/')
      .pop();
    const enriched = byKey.get(key) || {};
    // Live status bar data: frontmatter to-do items are the source of truth.
    // Summary fields only fill in when items are absent (malformed frontmatter).
    const items = Array.isArray(raw.todos?.items) ? raw.todos.items : [];
    const fromItems = items.length > 0;
    const completed = fromItems
      ? items.filter((t) => t.status === 'completed').length
      : (raw.todos?.completed ?? enriched.progress?.completed ?? 0);
    const total = fromItems
      ? items.length
      : (raw.todos?.total ?? enriched.progress?.total ?? 0);
    const inProgress = fromItems
      ? items.filter((t) => t.status === 'in_progress').length
      : (raw.todos?.inProgress ?? 0);
    // Cancelled counts toward the fill numerator (terminal work, mirrors
    // TERMINAL_TODO_STATUSES / todoStats in dashboard/lib/semantic-model.mjs)
    // so the bar reaches 100% whenever the lifecycle pill says COMPLETED.
    const cancelled = fromItems
      ? items.filter((t) => t.status === 'cancelled').length
      : (raw.todos?.cancelled ?? enriched.progress?.cancelled ?? 0);
    const nextActionTodo = planNextActionTodo(items);
    let lifecycle = enriched.lifecycle;
    if (!lifecycle) {
      // Mirrors classifyPlan: terminal (completed + cancelled) exhausting the
      // list means todoStats.open === 0 → completed.
      if (total > 0 && completed + cancelled >= total && inProgress === 0) {
        lifecycle = 'completed';
      } else {
        lifecycle = 'incomplete';
      }
    }
    return {
      id: raw.id,
      file: raw.file,
      path: raw.path || enriched.path || '',
      overview: raw.overview || enriched.overview || '',
      modifiedAt: raw.modifiedAt || enriched.modifiedAt || null,
      progressPct:
        total > 0
          ? Math.round(((completed + cancelled) / total) * 100)
          : typeof raw.progress === 'number'
            ? raw.progress
            : 0,
      progressLabel: `${completed} of ${total} complete` + (cancelled > 0 ? ` · ${cancelled} cancelled` : ''),
      progressCompleted: completed,
      progressCancelled: cancelled,
      progressTotal: total,
      progressInProgress: inProgress,
      nextActionTodo,
      lifecycle,
      // /run-plan-all layer from the semantic model (display-only; the panel
      // never writes the queue). 'none' / null outside queue mode.
      queueRole: enriched.queueRole || 'none',
      queueIndex: Number.isInteger(enriched.queueIndex) ? enriched.queueIndex : null,
      todos: raw.todos || {
        items: [],
        total: 0,
        completed: 0,
        pending: 0,
        inProgress: 0,
      },
    };
  });
}

/**
 * Checklist display sort: role-priority when queue roles are present
 * (executing → next_up → queued → completed_in_queue → none), then lifecycle
 * rank, then recency. Approved-queue index is not the card order (copy-only;
 * queue reorder happens in chat). Outside a live queue, lifecycle sort is unchanged.
 */
function sortPlansForPortfolio(plans) {
  return [...plans].sort((a, b) => {
    const roleA = a.queueRole && a.queueRole !== 'none' ? a.queueRole : 'none';
    const roleB = b.queueRole && b.queueRole !== 'none' ? b.queueRole : 'none';
    const qra = QUEUE_ROLE_SORT_RANK[roleA] ?? QUEUE_ROLE_SORT_RANK.none;
    const qrb = QUEUE_ROLE_SORT_RANK[roleB] ?? QUEUE_ROLE_SORT_RANK.none;
    if (qra !== qrb) return qra - qrb;
    const ra = LIFECYCLE_SORT_RANK[a.lifecycle] ?? 9;
    const rb = LIFECYCLE_SORT_RANK[b.lifecycle] ?? 9;
    if (ra !== rb) return ra - rb;
    const ta = a.modifiedAt ? new Date(a.modifiedAt).getTime() : 0;
    const tb = b.modifiedAt ? new Date(b.modifiedAt).getTime() : 0;
    return tb - ta;
  });
}

/**
 * Additive /run-plan-all queue-role pill next to the lifecycle pill. Skipped
 * when it would repeat the lifecycle pill's own label (Executing/Executing,
 * Completed/queue done) and for plans outside the queue. Never replaces the
 * lifecycle pill: the executing shimmer keys on lifecycle only.
 */
function queueRolePill(p) {
  const map = {
    next_up: { key: 'next-up', label: 'Next up', mark: 'SVG' },
    queued: { key: 'queued', label: 'Queued', mark: '\u23F1' },
    executing: { key: 'executing', label: 'Executing', mark: '\u25B6' },
    completed_in_queue: { key: 'done', label: 'Queue done', mark: '\u2713' },
  };
  const meta = map[p?.queueRole];
  if (!meta) return '';
  if (p.queueRole === 'executing' && p.lifecycle === 'executing') return '';
  if (p.queueRole === 'completed_in_queue' && p.lifecycle === 'completed') return '';
  const svgMark = meta.mark === 'SVG'
    ? `<svg class="queue-role-mark" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="currentColor"><polygon points="1,0 1,10 7,5"/><polygon points="4,0 4,10 10,5"/></svg>`
    : `<span class="queue-role-mark" aria-hidden="true">${meta.mark}</span>`;
  return `<span class="queue-role-pill queue-role-pill-${meta.key}">${svgMark}${escapeHtml(meta.label)}</span>`;
}

function togglePlanAccordion(planKey, event) {
  if (!planKey) return;
  const exclusive =
    isNarrowPanel() &&
    !planAccordionAllowMulti &&
    !(event && (event.shiftKey || event.metaKey || event.ctrlKey));
  if (openPlanAccordions.has(planKey)) {
    openPlanAccordions.delete(planKey);
  } else {
    if (exclusive) openPlanAccordions.clear();
    openPlanAccordions.add(planKey);
  }
  applyPlanAccordionState();
}

function setPlanAccordionMulti(enabled) {
  planAccordionAllowMulti = !!enabled;
  const toggle = document.getElementById('plan-accordion-multi-toggle');
  if (toggle) {
    toggle.setAttribute('aria-pressed', planAccordionAllowMulti ? 'true' : 'false');
    toggle.textContent = planAccordionAllowMulti
      ? 'Multiple open: on'
      : 'Multiple open: off';
  }
  if (!planAccordionAllowMulti && isNarrowPanel() && openPlanAccordions.size > 1) {
    const keep = [...openPlanAccordions].pop();
    openPlanAccordions.clear();
    if (keep) openPlanAccordions.add(keep);
    applyPlanAccordionState();
  }
}

function applyPlanAccordionState() {
  document.querySelectorAll('.plan-accordion-item').forEach((item) => {
    const key = item.getAttribute('data-plan-key');
    const open = openPlanAccordions.has(key);
    item.classList.toggle('open', open);
    const trigger = item.querySelector('.plan-accordion-trigger');
    if (trigger) trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    const panel = item.querySelector('.plan-accordion-panel');
    if (panel) panel.hidden = !open;
  });
  const toggle = document.getElementById('plan-accordion-multi-toggle');
  if (toggle) {
    toggle.setAttribute('aria-pressed', planAccordionAllowMulti ? 'true' : 'false');
    toggle.textContent = planAccordionAllowMulti
      ? 'Multiple open: on'
      : 'Multiple open: off';
  }
}

function formatNowUpdated(modifiedAt) {
  if (!modifiedAt) return '\u2014';
  if (/^\d{4}-\d{2}-\d{2}T/.test(modifiedAt)) return fmtDate(modifiedAt);
  return escapeHtml(modifiedAt);
}

/** Plain display string for tooltips (no HTML entities). */
function formatNowUpdatedPlain(modifiedAt) {
  if (!modifiedAt) return '\u2014';
  if (/^\d{4}-\d{2}-\d{2}T/.test(modifiedAt)) return fmtDate(modifiedAt);
  return String(modifiedAt);
}

/** Compact elapsed for Current mission meta (e.g. 12m 04s). */
function formatElapsedCompact(ms) {
  if (ms == null || !Number.isFinite(ms) || ms < 0) return '';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) {
    return `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
  }
  return `${m}m ${String(s).padStart(2, '0')}s`;
}

/** Plain-language elapsed for aria-label / title. */
function formatElapsedPlain(ms) {
  if (ms == null || !Number.isFinite(ms) || ms < 0) return '';
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const parts = [];
  if (h > 0) parts.push(`${h} hour${h === 1 ? '' : 's'}`);
  if (m > 0 || h > 0) parts.push(`${m} minute${m === 1 ? '' : 's'}`);
  parts.push(`${s} second${s === 1 ? '' : 's'}`);
  return parts.join(' ');
}

/** Live or frozen elapsed from timing anchors on missionControl.now. */
function computeNowTimingElapsed(now) {
  if (!now || now.totalElapsedMs == null || !now.timingStartedAt) return null;
  const startMs = Date.parse(now.timingStartedAt);
  if (!Number.isFinite(startMs)) return null;
  const frozenMs = now.timingFrozenAt ? Date.parse(now.timingFrozenAt) : NaN;
  const endMs = Number.isFinite(frozenMs) ? frozenMs : Date.now();
  const total = Math.max(0, endMs - startMs);
  let stage = now.currentStageElapsedMs;
  if (now.currentStageStartedAt) {
    const stageStart = Date.parse(now.currentStageStartedAt);
    if (Number.isFinite(stageStart)) {
      stage = Math.max(0, endMs - stageStart);
    }
  }
  return { total, stage };
}

/** Inline SVG meta icons (no icon font). Accessible name via aria-label + title. */
function nowMetaIconSvg(kind, opts) {
  const executingClass =
    kind === 'mode' && opts && opts.executing ? ' now-meta-icon-executing' : '';
  if (kind === 'mode') {

  }
  if (kind === 'elapsed') {

    return `<svg class="now-meta-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Elapsed" title="Elapsed"><path d="M6.25 2.25h3.5M8 2.25v1.5"/><circle cx="8" cy="9" r="4.25"/><path d="M8 9V6.75"/></svg>`;

      '<path d="M6.5 11.5a2 2 0 100-4 2 2 0 000 4z"/>' +
      '<path d="M10.5 6.5v2"/>',
    // Chip (memory) — two internal lines 3 units apart; a third line would drop clearance below the stroke floor
    memory:
      '<path d="M4.5 2.5h7a1 1 0 011 1v9a1 1 0 01-1 1h-7a1 1 0 01-1-1v-9a1 1 0 011-1z"/>' +
      '<path d="M6.5 1.5v2M9.5 1.5v2M6.5 12.5v2M9.5 12.5v2"/>' +
      '<path d="M6 6.5h4M6 9.5h2.5"/>',
    // Screen (terminals)
    terminals:
      '<path d="M1.5 3.5h13a1 1 0 011 1v7a1 1 0 01-1 1H1.5a1 1 0 01-1-1v-7a1 1 0 011-1z"/>' +
      '<path d="M5.5 12.5v2M10.5 12.5v2M4 14.5h8"/>',
    // Layers (processes)
    processes:
      '<path d="M8 2.5l6 3-6 3-6-3 6-3z"/>' +
      '<path d="M2 7.5l6 3 6-3"/>' +
      '<path d="M2 10.5l6 3 6-3"/>',
    // Sliders (config)
    config:
      '<path d="M2.5 4.5h3M11 4.5h3"/>' +
      '<circle cx="7.5" cy="4.5" r="1.5"/>' +
      '<path d="M2.5 11.5h5M13 11.5h1"/>' +
      '<circle cx="10" cy="11.5" r="1.5"/>',
  };
  const body = paths[kind];
  const label = names[kind];
  if (!body || !label) return '';
  const a11y = decorative
    ? 'aria-hidden="true"'
    : `role="img" aria-label="${label}" title="${label}"`;
  return `<svg class="space-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${body}</svg>`;
}

/**
 * Discreet Mode + Updated + optional elapsed row: icons replace bold labels.
 * Timing omitted when idle / null (no timer chrome).
 * Mode value uses formatModeDisplayLabel (display-only; raw Mode stays on HANDOFF).
 * Mode icon loops only while now.status === 'executing' (idle/parked/STOPPED static).
 */
function renderNowMeta(modeLabel, updatedSource, now) {
  const updatedLabel = formatNowUpdated(updatedSource);
  const updatedPlain = formatNowUpdatedPlain(updatedSource);
  const displayMode = formatModeDisplayLabel(modeLabel);
  const modeExecuting = (now?.status || '') === 'executing';
  const modeItem = displayMode
    ? `<span class="now-meta-item" title="${escapeAttr('Mode: ' + displayMode)}">${nowMetaIconSvg('mode', { executing: modeExecuting })}<span class="now-meta-value">${escapeHtml(displayMode)}</span></span>`
    : '';
  const updatedItem = `<span class="now-meta-item" title="${escapeAttr('Updated: ' + updatedPlain)}">${nowMetaIconSvg('updated')}<span class="now-meta-value">${updatedLabel}</span></span>`;
  const elapsed = computeNowTimingElapsed(now);
  let timingItem = '';
  if (elapsed) {
    const totalLabel = formatElapsedCompact(elapsed.total);
    const stageLabel =
      elapsed.stage != null && Number.isFinite(elapsed.stage)
        ? formatElapsedCompact(elapsed.stage)
        : '';
    const valueText = stageLabel
      ? `${totalLabel} total \u00b7 ${stageLabel} this step`
      : `${totalLabel} total`;
    const ariaPlain = stageLabel
      ? `Total elapsed ${formatElapsedPlain(elapsed.total)}, current step ${formatElapsedPlain(elapsed.stage)}`
      : `Total elapsed ${formatElapsedPlain(elapsed.total)}`;
    const frozen = Boolean(now?.timingFrozenAt);
    timingItem = `<span class="now-meta-item now-meta-timing" title="${escapeAttr(ariaPlain)}" data-now-timing${frozen ? ' data-now-timing-frozen="1"' : ''}><span data-now-timing-anchors hidden data-started="${escapeAttr(now.timingStartedAt || '')}" data-frozen="${escapeAttr(now.timingFrozenAt || '')}" data-stage-started="${escapeAttr(now.currentStageStartedAt || '')}"></span>${nowMetaIconSvg('elapsed')}<span class="now-meta-value" data-now-timing-value aria-label="${escapeAttr(ariaPlain)}">${escapeHtml(valueText)}</span></span>`;
  }
  return `<div class="now-meta" role="group" aria-label="Plan metadata">${modeItem}${updatedItem}${timingItem}</div>`;
}

/**
 * Legacy Gaps strip on Current mission (retired). Flight Log owns Gaps.
 * Kept as empty stub so older string contracts do not throw if referenced.
 * @param {string|null|undefined} _gapsText
 */
function renderNowGaps(_gapsText) {
  return '';
}

/**
 * Flight Log typed notification kind → CSS modifier (palette-by-type).
 * Mirrors dashboard/lib/semantic-model.mjs classifyFlightLogMessageKind /
 * flightLogKindClass. Not Crew Monitor kinds.
 * @param {string | null | undefined} text
 * @param {{ lane?: string, kind?: string }} [opts]
 */
function flightLogMessageKind(text, opts = {}) {
  if (opts.lane === 'warning') return 'warning';
  if (typeof opts.kind === 'string' && opts.kind.trim()) {
    const k = opts.kind.trim().toLowerCase();
    if (k === 'ok' || k === 'advice' || k === 'prompt' || k === 'warning' || k === 'residual') {
      return k;
    }
    if (k === 'api_limit' || k === 'orchestrator_heads_up') return 'warning';
  }
  const raw = typeof text === 'string' ? text.replace(/\s+/g, ' ').trim() : '';
  if (!raw) return 'ok';
  if (/^(none|n\/a)$/i.test(raw)) return 'ok';
  if (/^(none|n\/a)\s*[.:,;\/(\-–—…]/i.test(raw)) return 'ok';
  if (/^([-–—.…]|empty|no gaps?|cleared|all clear|ok)$/i.test(raw)) return 'ok';
  if (
    /\bAPI\s*\/\s*usage\s+limit\b|\bAPI\s+usage\s+limit\b|\bSTOPPED:\s*API\b/i.test(raw) ||
    /\b(hard.?stop|quota\s+pause)\b/i.test(raw)
  ) {
    return 'warning';
  }
  if (/\b(confirm|ask questions|hitl|\bpaste\b|choose\b|approve\b|operator yes)\b/i.test(raw)) {
    return 'prompt';
  }
  if (/\b(tip:|advice:|consider\b|recommends?\b|recommended\b|prefer\b)/i.test(raw)) {
    return 'advice';
  }
  return 'residual';
}

function flightLogKindClassName(kind) {
  switch (kind) {
    case 'ok':
      return 'flight-log-kind-ok';
    case 'advice':
    case 'prompt':
      return 'flight-log-kind-advice';
    case 'warning':
      return 'flight-log-kind-warning';
    case 'residual':
    default:
      return 'flight-log-kind-residual';
  }
}

/**
 * Gaps card on Flight Log (NOW large / Earlier smaller). Labels locked.
 * Kind selects Mission Control palette tokens (typed notification chrome).
 * One composed action button per entry (semantic model action; fallback compose).
 * @param {{ text?: string, at?: string|null, sourcePath?: string, variant?: string, kind?: string, action?: { label?: string, command?: string, sourcePath?: string } }} entry
 * @param {number} idx
 */
function renderFlightLogCard(entry, idx) {
  const text = typeof entry?.text === 'string' ? entry.text.trim() : '';
  if (!text) return '';
  const sourcePath =
    typeof entry?.sourcePath === 'string' && entry.sourcePath.trim()
      ? entry.sourcePath.trim()
      : '.cursor/HANDOFF.md';
  const variant = entry?.variant === 'past' ? 'past' : 'current';
  const label = variant === 'current' ? 'NOW' : 'Earlier';
  const kind = flightLogMessageKind(text, { kind: entry?.kind });
  const kindClass = flightLogKindClassName(kind);
  const metaBits = [];
  if (variant === 'past' && entry?.at) {
    metaBits.push(escapeHtml(String(entry.at)));
  }
  metaBits.push(escapeHtml(sourcePath));
  const action = entry?.action && typeof entry.action === 'object' ? entry.action : null;
  const actionLabel =
    typeof action?.label === 'string' && action.label.trim()
      ? action.label.trim()
      : 'Copy fix prompt';
  const actionCommand =
    typeof action?.command === 'string' && action.command.trim()
      ? action.command
      : `${variant === 'current' ? 'Act on these open residuals:' : 'Act on these earlier residuals:'}\n${text}\n${sourcePath}`;
  const copyActionHandler = copyForPasteHandler(actionCommand, 'fix prompt', 'chatInput');
  const cardClass =
    variant === 'current'
      ? `flight-log-card flight-log-card-current ${kindClass}`
      : `flight-log-card flight-log-card-past ${kindClass}`;
  const aria = `${label}: ${text}`;
  return `
    <div class="${cardClass}" role="listitem" tabindex="0" data-focus-key="flight-log-${variant}-${idx}" data-flight-log-kind="${escapeAttr(kind)}" aria-label="${escapeAttr(aria)}">
      <span class="flight-log-card-label">${escapeHtml(label)}</span>
      <div class="flight-log-card-text">${escapeHtml(text)}</div>
      <div class="flight-log-card-meta">${metaBits.join(' · ')}</div>
      <div class="flight-log-card-actions">
        <button type="button" class="status-bar-btn" data-focus-key="flight-log-action-${variant}-${idx}" onclick="${copyActionHandler}" style="font-size:11px;padding:3px 10px" title="${escapeAttr(copyActionTitle('fix prompt', 'chatInput'))}">${escapeHtml(actionLabel)}</button>
      </div>
    </div>
  `;
}

/**
 * Operator Warning card on Flight Log (API/usage or orchestrator heads-up).
 * No Review all / Resolve all / cadence CTAs. One composed action button
 * per entry (semantic model action; fallback compose).
 * @param {{ id?: string, kind?: string, title?: string, text?: string, sourcePath?: string, action?: { label?: string, command?: string, sourcePath?: string } }} warning
 * @param {number} idx
 */
function renderFlightLogWarningCard(warning, idx) {
  const text = typeof warning?.text === 'string' ? warning.text.trim() : '';
  if (!text) return '';
  const title =
    typeof warning?.title === 'string' && warning.title.trim()
      ? warning.title.trim()
      : 'Warning';
  const sourcePath =
    typeof warning?.sourcePath === 'string' && warning.sourcePath.trim()
      ? warning.sourcePath.trim()
      : '.cursor/HANDOFF.md';
  const kind = typeof warning?.kind === 'string' ? warning.kind : 'warning';
  const actionSubject = kind === 'api_limit' ? 'recovery prompt' : 'follow-up prompt';
  const action = warning?.action && typeof warning.action === 'object' ? warning.action : null;
  const actionLabel =
    typeof action?.label === 'string' && action.label.trim()
      ? action.label.trim()
      : `Copy ${actionSubject}`;
  const actionCommand =
    typeof action?.command === 'string' && action.command.trim()
      ? action.command
      : `${kind === 'api_limit' ? 'Resume after this quota pause:' : 'Act on this heads-up:'}\n${text}\n${sourcePath}`;
  const copyActionHandler = copyForPasteHandler(actionCommand, actionSubject, 'chatInput');
  const aria = `${title}: ${text}`;
  return `
    <div class="flight-log-card flight-log-card-warning" role="listitem" tabindex="0" data-focus-key="flight-log-warning-${idx}" data-warning-kind="${escapeAttr(kind)}" aria-label="${escapeAttr(aria)}">
      <span class="flight-log-card-label">${escapeHtml(title)}</span>
      <div class="flight-log-card-text">${escapeHtml(text)}</div>
      <div class="flight-log-card-meta">${escapeHtml(sourcePath)}</div>
      <div class="flight-log-card-actions">
        <button type="button" class="status-bar-btn" data-focus-key="flight-log-warning-action-${idx}" onclick="${copyActionHandler}" style="font-size:11px;padding:3px 10px" title="${escapeAttr(copyActionTitle(actionSubject, 'chatInput'))}">${escapeHtml(actionLabel)}</button>
      </div>
    </div>
  `;
}

/**
 * Quiet-state open-triage row (untriaged external review). Prompt chrome;
 * one composed triage-command button per row. No Review all / Resolve all.
 * Kind class from flightLogKindClassName('prompt') (SoT map; not a literal).
 * @param {{ id?: string, label?: string, sourcePath?: string, action?: { target?: string, label?: string, subject?: string, command?: string } }} item
 * @param {number} idx
 */
function renderFlightLogQuietOpenTriageCard(item, idx) {
  const sourcePath =
    typeof item?.sourcePath === 'string' && item.sourcePath.trim()
      ? item.sourcePath.trim()
      : '';
  if (!sourcePath) return '';
  const label =
    typeof item?.label === 'string' && item.label.trim()
      ? item.label.trim()
      : 'Awaiting triage';
  const triageCmd =
    typeof item?.action?.target === 'string' && item.action.target.trim()
      ? item.action.target.trim()
      : `/plan-review-triage ${sourcePath}`;
  const actionSubject =
    typeof item?.action?.subject === 'string' && item.action.subject.trim()
      ? item.action.subject.trim()
      : 'triage command';
  const actionLabel =
    typeof item?.action?.label === 'string' && item.action.label.trim()
      ? item.action.label.trim()
      : 'Copy triage command';
  const actionCommand =
    typeof item?.action?.command === 'string' && item.action.command.trim()
      ? item.action.command
      : triageCmd;
  const copyActionHandler = copyForPasteHandler(actionCommand, actionSubject, 'chatInput');
  const aria = `Review: ${label}`;
  const kindClass = flightLogKindClassName('prompt');
  return `
    <div class="flight-log-card flight-log-card-current ${kindClass}" role="listitem" tabindex="0" data-focus-key="flight-log-open-triage-${idx}" data-flight-log-kind="prompt" aria-label="${escapeAttr(aria)}">
      <span class="flight-log-card-label">Review</span>
      <div class="flight-log-card-text">${escapeHtml(label)}</div>
      <div class="flight-log-card-meta">${escapeHtml(sourcePath)}</div>
      <div class="flight-log-card-actions">
        <button type="button" class="status-bar-btn" data-focus-key="flight-log-open-triage-action-${idx}" onclick="${copyActionHandler}" style="font-size:11px;padding:3px 10px" title="${escapeAttr(copyActionTitle(actionSubject, 'chatInput'))}">${escapeHtml(actionLabel)}</button>
      </div>
    </div>
  `;
}

/**
 * Resolve Live Gaps text for Flight Log render + fingerprint (same fallback chain).
 * Prefer fl.current; with Plan:none, fall back to now.gaps then system.handoff.gaps.
 */
function resolveFlightLogCurrent(d) {
  const fl = d?.missionControl?.flightLog ?? d?.flightLog ?? null;
  if (typeof fl?.current === 'string' && fl.current.trim()) return fl.current.trim();
  const nowGaps = d?.missionControl?.now?.gaps ?? d?.now?.gaps;
  if (typeof nowGaps === 'string' && nowGaps.trim()) return nowGaps.trim();
  const handoffGaps = d?.system?.handoff?.gaps;
  if (typeof handoffGaps === 'string' && handoffGaps.trim()) return handoffGaps.trim();
  return null;
}

function flightLogHasPastEntries(fl) {
  if (!fl || !Array.isArray(fl.past)) return false;
  return fl.past.some((e) => {
    if (typeof e === 'string') return Boolean(e.trim());
    return Boolean(e && typeof e.text === 'string' && e.text.trim());
  });
}

/** Match renderFlightLogWarningCard: text-less warnings do not count. */
function flightLogHasWarningEntries(fl) {
  if (!fl || !Array.isArray(fl.warnings)) return false;
  return fl.warnings.some((w) => {
    if (typeof w === 'string') return Boolean(w.trim());
    return Boolean(w && typeof w.text === 'string' && w.text.trim());
  });
}

/** Shared quiet gate for renderAttentionPanel + flightLogFingerprint. */
function isFlightLogQuiet(d) {
  const fl = d?.missionControl?.flightLog ?? d?.flightLog ?? null;
  return !resolveFlightLogCurrent(d) && !flightLogHasPastEntries(fl) && !flightLogHasWarningEntries(fl);
}

/**
 * Flight Log panel: HANDOFF Gaps log (live large + earlier smaller) + Warnings lane.
 * When Gaps + Warnings are empty, may show bounded quiet open-triage rows.
 * Field Report attention inbox / bulk CTAs stay off this card.
 */
function renderAttentionPanel(d, attentionChanged) {
  const fl = d.missionControl?.flightLog || null;
  const sourcePath =
    (typeof fl?.sourcePath === 'string' && fl.sourcePath.trim()) ||
    '.cursor/HANDOFF.md';
  const current = resolveFlightLogCurrent(d);
  const past = Array.isArray(fl?.past) ? fl.past : [];
  const warnings = Array.isArray(fl?.warnings) ? fl.warnings : [];
  const quietCap =
    typeof d.missionControl?.flightLogQuietOpenTriagesCap === 'number' &&
    d.missionControl.flightLogQuietOpenTriagesCap > 0
      ? Math.floor(d.missionControl.flightLogQuietOpenTriagesCap)
      : 0;
  const quietOpenTriages = Array.isArray(fl?.quietOpenTriages)
    ? fl.quietOpenTriages
    : Array.isArray(d.missionControl?.attention)
      ? d.missionControl.attention
          .filter(
            (i) => i && i.kind === 'report' && typeof i.sourcePath === 'string' && i.sourcePath.trim(),
          )
          .slice(0, quietCap)
      : [];
  const pastCards = past
    .filter((e) => e && typeof e.text === 'string' && e.text.trim())
    .map((e, idx) =>
      renderFlightLogCard(
        {
          text: e.text,
          at: e.at || null,
          sourcePath: e.sourcePath || sourcePath,
          variant: 'past',
          kind: e.kind || null,
          action: e.action && typeof e.action === 'object' ? e.action : null,
        },
        idx,
      ),
    )
    .join('');
  const warningCards = warnings
    .map((w, idx) => renderFlightLogWarningCard(w, idx))
    .filter(Boolean)
    .join('');
  const warningsBlock = warningCards
    ? `<div class="flight-log-warnings" role="list" aria-label="Operator warnings">${warningCards}</div>`
    : '';
  const openTriageCards = quietOpenTriages
    .map((item, idx) => renderFlightLogQuietOpenTriageCard(item, idx))
    .filter(Boolean)
    .join('');
  const hasOpenTriages = openTriageCards.length > 0;

  let body;
  const hasCurrent = Boolean(current);
  const hasPast = pastCards.length > 0;
  const hasWarnings = warningCards.length > 0;
  // Keep local flags aligned with isFlightLogQuiet(d) for the quiet branch.
  if (!hasCurrent && !hasPast && !hasWarnings) {
    if (hasOpenTriages) {
      body = `<div class="flight-log-stack" role="list" aria-label="Reviews awaiting triage">${openTriageCards}</div>`;
    } else {
      body = renderEmptyStateCta({
        headline: 'All clear',
        iconKind: 'field-report',
        support: 'Quiet cockpit. Residuals show up here when Gaps change.',
        compact: true,
        className: 'attention-empty',
      });
    }
  } else if (!hasCurrent && !hasPast && hasWarnings) {
    body = `${warningsBlock}`;
  } else {
    const currentCard = hasCurrent
      ? renderFlightLogCard(
          {
            text: current,
            sourcePath,
            variant: 'current',
            kind: typeof fl?.currentKind === 'string' ? fl.currentKind : null,
            action:
              fl?.currentAction && typeof fl.currentAction === 'object'
                ? fl.currentAction
                : null,
          },
          0,
        )
      : `<div class="flight-log-card flight-log-card-current flight-log-kind-ok" role="status" data-flight-log-kind="ok" aria-label="No Gaps now">
          <span class="flight-log-card-label">NOW</span>
          <div class="flight-log-card-text" style="color:var(--text-muted)">Quiet · nothing live</div>
        </div>`;
    body = `${warningsBlock}<div class="flight-log-stack" role="list">${currentCard}${pastCards}</div>`;
  }

  const countLabel = hasCurrent
    ? hasPast
      ? `1 · ${past.length} earlier${hasWarnings ? ` · ${warnings.length} warn` : ''}`
      : hasWarnings
        ? `1 · ${warnings.length} warn`
        : '1'
    : hasPast
      ? `${past.length} earlier${hasWarnings ? ` · ${warnings.length} warn` : ''}`
      : hasWarnings
        ? `${warnings.length} warn`
        : hasOpenTriages
          ? `${quietOpenTriages.length} review`
          : 'Clear';

  return `
    <div class="card${attentionChanged ? ' card-flash' : ''}" id="attention-panel">
      <div class="card-header now-panel-header">
        <span class="card-title">${spaceIconSvg('field-report')}Flight Log</span>
        ${renderBusyOutsideChip(d.missionControl?.now)}
        <span class="section-subtitle" style="margin-left:auto">${escapeHtml(countLabel)}</span>
      </div>
      <div class="panel-scroll-body">${body}</div>
    </div>
  `;
}

/** 1s text-only tick for live mission elapsed (no animation; reduced-motion safe). */
let nowTimingTickTimer = null;
function stopNowTimingTick() {
  if (nowTimingTickTimer != null) {
    clearInterval(nowTimingTickTimer);
    nowTimingTickTimer = null;
  }
}
function syncNowTimingTick(now) {
  stopNowTimingTick();
  if (!now || now.timingFrozenAt || now.totalElapsedMs == null || !now.timingStartedAt) return;
  const status = now.status || 'idle';
  if (status !== 'executing' && status !== 'awaiting_user') return;
  const tick = () => {
    const valueEl = document.querySelector('[data-now-timing-value]');
    const item = document.querySelector('[data-now-timing]');
    if (!valueEl || !item || item.getAttribute('data-now-timing-frozen') === '1') {
      stopNowTimingTick();
      return;
    }
    const live = computeNowTimingElapsed(now);
    if (!live) return;
    const totalLabel = formatElapsedCompact(live.total);
    const stageLabel =
      live.stage != null && Number.isFinite(live.stage) ? formatElapsedCompact(live.stage) : '';
    const valueText = stageLabel
      ? `${totalLabel} total \u00b7 ${stageLabel} this step`
      : `${totalLabel} total`;
    const ariaPlain = stageLabel
      ? `Total elapsed ${formatElapsedPlain(live.total)}, current step ${formatElapsedPlain(live.stage)}`
      : `Total elapsed ${formatElapsedPlain(live.total)}`;
    valueEl.textContent = valueText;
    valueEl.setAttribute('aria-label', ariaPlain);
    item.setAttribute('title', ariaPlain);
  };
  tick();
  nowTimingTickTimer = setInterval(tick, 1000);
}

/** Optional previous-step duration for stepper title (discreet, no table). */
function previousStageElapsedTitle(now) {
  const prevId = now?.previousTodo?.id;
  if (!prevId || !Array.isArray(now?.stages)) return '';
  const row = now.stages.find((s) => s && s.id === prevId);
  if (!row || row.elapsedMs == null || !Number.isFinite(row.elapsedMs)) return '';
  return `Previous step elapsed ${formatElapsedPlain(row.elapsedMs)}`;
}

/**
 * Fingerprint Flight Log for SSE re-render. Accepts full dashboard `d` or a
 * slim prev snapshot `{ flightLog, now, system }` so quiet-gate matches render.
 */
function flightLogFingerprint(d) {
  if (!d || typeof d !== 'object') return '';
  const fl = d.missionControl?.flightLog ?? d.flightLog ?? null;
  if (!fl || typeof fl !== 'object') return '';
  const current = resolveFlightLogCurrent(d) || '';
  const past = Array.isArray(fl.past)
    ? fl.past
        .map((e) =>
          typeof e === 'string' ? e : e && typeof e.text === 'string' ? e.text : '',
        )
        .join('\n')
    : '';
  const warnings = Array.isArray(fl.warnings)
    ? fl.warnings
        .map((w) =>
          typeof w === 'string'
            ? w
            : w && (w.id || w.text)
              ? String(w.id || w.text)
              : '',
        )
        .join('\n')
    : '';
  // Quiet-only: include open-triage ids when Gaps + Warnings are empty so a new
  // monitor does not flash the non-quiet Flight Log card with no visible change.
  // Must use the same gate as renderAttentionPanel (Plan:none Gaps fallback).
  const openTriages =
    isFlightLogQuiet(d) && Array.isArray(fl.quietOpenTriages)
      ? fl.quietOpenTriages
          .map((i) =>
            typeof i === 'string'
              ? i
              : i && (i.id || i.sourcePath)
                ? String(i.id || i.sourcePath)
                : '',
          )
          .join('\n')
      : '';
  // Busy-outside-plan header chip must re-render the card on flip.
  const busy = (d.missionControl?.now ?? d.now)?.busyOutsidePlan?.active === true;
  return `${current}\0${past}\0${warnings}\0${openTriages}\0${busy ? 'busy' : ''}`;
}

// Step progress bar: one segment per plan step (completed / current / remaining).
function renderNowStepBar(now) {
  const total = now?.progress?.total ?? 0;
  if (total <= 0) return '';
  const completed = Math.min(Math.max(now?.progress?.completed ?? 0, 0), total);
  const hasCurrent = !!now?.currentTodo && completed < total;
  const remaining = Math.max(0, total - completed - (hasCurrent ? 1 : 0));
  const segs =
    '<span class="now-stepbar-seg now-stepbar-seg-done" aria-hidden="true"></span>'.repeat(completed) +
    (hasCurrent ? '<span class="now-stepbar-seg now-stepbar-seg-current" aria-hidden="true"></span>' : '') +
    '<span class="now-stepbar-seg" aria-hidden="true"></span>'.repeat(remaining);
  const aria = `Step progress: ${completed} of ${total} steps complete${hasCurrent ? ', 1 in progress' : ''}`;
  return `
    <div class="now-stepbar-row">
      <div class="now-stepbar" role="img" aria-label="${escapeAttr(aria)}">${segs}</div>
      <span class="now-stepbar-label" aria-hidden="true">${completed} of ${total}</span>
    </div>
  `;
}

function nowStepTodoText(todo) {
  return `<span class="now-todo-id">${escapeHtml(todo.id)}</span>${todo.content ? ` \u2014 ${escapeHtml(todo.content)}` : ''}`;
}

/** Next-up row text for a completed mission inside a /run-plan-all queue. */
function nowNextUpText(nextUpPlan) {
  return `<span class="now-todo-id">${escapeHtml(nextUpPlan)}</span> (next plan in the run queue)`;
}

// Completed mission: the last completed to-do is the terminal step. When the
