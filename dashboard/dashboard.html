// HANDOFF run queue (/run-plan-all) holds a later plan, the closing row names
// that plan as Next up; otherwise it states there is no next action. A HANDOFF
// instruction is never promoted here: the run is over.
function renderNowCompletedStepper(now) {
  const total = now?.progress?.total ?? 0;
  const completed = Math.min(Math.max(now?.progress?.completed ?? 0, 0), total);
  const finalTodo = now?.currentTodo || now?.previousTodo || null;
  const finalText = finalTodo ? nowStepTodoText(finalTodo) : escapeHtml('Plan complete');
  const doneCount = total > 0 ? `${completed} of ${total} steps done` : 'no steps recorded';
  const nextUpPlan = now?.nextUpPlan || null;
  const aria = nextUpPlan
    ? `Mission complete: final step done, next up ${nextUpPlan} (${doneCount})`
    : `Mission complete: final step done, no next step (${doneCount})`;
  const nextLabel = nextUpPlan ? 'Next up' : 'Next';
  const nextText = nextUpPlan
    ? nowNextUpText(nextUpPlan)
    : escapeHtml(`None: mission complete (${doneCount})`);
  return `
    <ol class="now-stepper now-stepper-complete" aria-label="${escapeAttr(aria)}">
      <li class="now-step now-step-final now-step-done">
        <span class="now-step-marker" aria-hidden="true">\u2713</span>
        <div class="now-step-body">
          <span class="now-step-label">Final step</span>
          <div class="now-step-text">${finalText}</div>
        </div>
      </li>
      <li class="now-step now-step-next${nextUpPlan ? '' : ' now-step-terminal'}">
        <span class="now-step-marker" aria-hidden="true">${nextUpPlan ? '\u25CB' : '\u2014'}</span>
        <div class="now-step-body">
          <span class="now-step-label">${nextLabel}</span>
          <div class="now-step-text">${nextText}</div>
        </div>
      </li>
    </ol>
  `;
}

// Connected previous → current → next blocks derived from plan todo statuses.
function renderNowStepper(now, handoff, status, meta) {
  if (status === 'completed') return renderNowCompletedStepper(now);
  const total = now?.progress?.total ?? 0;
  const completed = now?.progress?.completed ?? 0;
  const planDone = total > 0 && completed >= total;
  const previousTodo = now?.previousTodo || null;
  const currentTodo = now?.currentTodo || null;
  const nextTodo = now?.nextTodo || null;

  const prevText = previousTodo
    ? nowStepTodoText(previousTodo)
    : escapeHtml('None \u2014 first step');
  const currentText = currentTodo
    ? nowStepTodoText(currentTodo)
    : escapeHtml(
        planDone
          ? 'Plan complete'
          : status === 'awaiting_user'
            ? 'Awaiting user decision'
            : '\u2014',
      );
  const nextText = nextTodo
    ? nowStepTodoText(nextTodo)
    : planDone && now?.nextUpPlan
      ? nowNextUpText(now.nextUpPlan)
      : escapeHtml(
          planDone
            ? 'None \u2014 plan complete'
            : handoff?.instruction
              ? handoff.instruction
              : status === 'awaiting_user'
                ? 'Awaiting user decision'
                : 'None \u2014 last step',
        );

  const currentMark = planDone ? '\u2713' : meta.mark;
  const prevElapsedTitle = previousStageElapsedTitle(now);
  const prevTitleAttr = prevElapsedTitle ? ` title="${escapeAttr(prevElapsedTitle)}"` : '';
  return `
    <ol class="now-stepper" aria-label="Work progression: previous, current, next">
      <li class="now-step now-step-previous${previousTodo ? ' now-step-done' : ' now-step-empty'}"${prevTitleAttr}>
        <span class="now-step-marker" aria-hidden="true">${previousTodo ? '\u2713' : '\u25CB'}</span>
        <div class="now-step-body">
          <span class="now-step-label">Previous</span>
          <div class="now-step-text">${prevText}</div>
        </div>
      </li>
      <li class="now-step now-step-current${planDone ? ' now-step-done' : ''}${currentTodo || planDone ? '' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">${currentMark}</span>
        <div class="now-step-body">
          <span class="now-step-label">Current</span>
          <div class="now-step-text">${currentText}</div>
        </div>
      </li>
      <li class="now-step now-step-next${nextTodo ? '' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">\u25CB</span>
        <div class="now-step-body">
          <span class="now-step-label">Next</span>
          <div class="now-step-text">${nextText}</div>
        </div>
      </li>
    </ol>
  `;
}

// Live "busy outside the plan" header chip (Current mission + Flight Log).
// Text-only on the advice-family blue tokens; not a Flight Log entry, so the
// Gaps voice, kind, and NOW/Earlier/All clear label contracts stay untouched.
function renderBusyOutsideChip(now) {
  if (!now?.busyOutsidePlan?.active) return '';
  return `<span class="mc-busy-chip" role="status" aria-label="Agents working outside the active plan" title="Run-loop activity outside the active plan">Busy \u00b7 outside plan</span>`;
}

function renderNowExecutionPanel(d, nowChanged) {
  const now = d.missionControl?.now || null;
  const handoff = d.system?.handoff || null;
  const status = now?.status || 'idle';
  const isLive = status === 'executing' || status === 'awaiting_user';
  const isCompleted = status === 'completed';
  // Keep the mission card populated for live and completed; IDLE empty card only without a mission.
  const showMission = isLive || isCompleted;
  const meta = nowStatusMeta(status);
  const planName = now?.planId || now?.planFile || handoff?.plan || '';
  const planPath =
    now?.planPath ||
    handoff?.planPath ||
    (handoff?.plan ? `.cursor/plans/${handoff.plan}` : '');
  const modeLabel = now?.mode || handoff?.mode || null;
  const updatedSource = now?.modifiedAt || handoff?.lastUpdated || null;

  const statusClass = `now-status now-status-${meta.key}${meta.live ? ' now-status-live' : ''}`;
  const busyChip = renderBusyOutsideChip(now);

  // True idle: no HANDOFF plan reference (or non-mission status). Reserve empty IDLE for that case.
  if (!showMission) {
    stopNowTimingTick();
    return `
      <div class="card${nowChanged ? ' card-flash' : ''}" id="now-execution-panel">
        <div class="card-header now-panel-header">
          <span class="card-title">${spaceIconSvg('current-mission')}Current mission</span>
          <span class="${statusClass}" aria-label="Status: ${escapeAttr(meta.label)}">
            <span class="now-status-mark" aria-hidden="true">${meta.mark}</span>
            ${escapeHtml(meta.label)}
          </span>
          ${busyChip}
        </div>
        <div class="panel-scroll-body">
          ${renderEmptyStateCta({
            headline: 'Quiet cockpit',
            iconKind: 'current-mission',
            support: 'No active plan. Start one when you are ready.',
            compact: true,
            cta: {
              text: '/start-project',
              subject: '/start-project',
              destination: 'chatInput',
              label: 'Copy /start-project',
              focusKey: 'cta-start-project',
            },
          })}
        </div>
      </div>
    `;
  }

  // Schedule text-only elapsed tick after this HTML is inserted (see renderUnsafe).
  queueMicrotask(() => syncNowTimingTick(now));

  return `
    <div class="card${nowChanged ? ' card-flash' : ''}" id="now-execution-panel">
      <div class="card-header now-panel-header">
        <span class="card-title">${spaceIconSvg('current-mission')}Current mission</span>
        <span class="${statusClass}" aria-label="Status: ${escapeAttr(meta.label)}">
          <span class="now-status-mark" aria-hidden="true">${meta.mark}</span>
          ${escapeHtml(meta.label)}
        </span>
        ${busyChip}
      </div>
      <div class="panel-scroll-body">
        <div class="now-plan-name">${escapeHtml(planName)}</div>
        ${renderNowStepBar(now)}
        ${renderNowStepper(now, handoff, status, meta)}
        ${renderNowMeta(modeLabel, updatedSource, now)}
        ${renderNowModeHint(modeLabel)}
        <div class="now-actions">
          <button class="status-bar-btn" data-focus-key="cta-copy-plan-path" onclick="${escapeAttr(`copyPlanPath('${escapeJsString(planPath)}')`)}" style="font-size:11px;padding:4px 14px" title="${escapeAttr(pathActionTitle(planPath))}">Copy plan path</button>
          ${
            isManualPlanMode(modeLabel)
              ? `<button class="status-bar-btn" data-focus-key="cta-copy-continue-plan" onclick="${escapeAttr(`copyContinuePlanCommand('${escapeJsString(planName)}')`)}" style="font-size:11px;padding:4px 14px" title="${escapeAttr(copyActionTitle(continuePlanPasteText(planName), 'chatInput'))}">Copy /continue-plan</button>`
              : ''
          }
          <button class="status-bar-btn" data-focus-key="cta-copy-staging" onclick="copyGitStagingCommand()" style="font-size:11px;padding:4px 14px" title="${escapeAttr(copyActionTitle('/git-staging', 'chatInput'))}">Copy /git-staging</button>
        </div>
      </div>
    </div>
  `;
}

// ===== Render =====
function render() {
  if (!data) return;
  try {
    renderUnsafe();
  } catch (err) {
    console.error('Dashboard render failed', err);
    dataLoading = false;
    const contentEl = document.getElementById('content');
    if (contentEl) {
      const errMsg = err && err.message ? err.message : String(err);
      const errStack = err && err.stack ? err.stack : '';
      contentEl.innerHTML = `
        <div class="empty-state" style="padding:60px 20px">
          <div style="font-size:16px;font-weight:600;color:var(--red)">Render Failed</div>
          <div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">${escapeHtml(errMsg)}</div>
          <button class="error-retry-btn" onclick="refresh()">
            <span>\u21bb</span> Retry
          </button>
          ${errStack ? `
            <div style="margin-top:12px">
              <button class="error-stack-toggle" onclick="(function(el){
                var detail = el.nextElementSibling;
                if(detail) detail.classList.toggle('open');
              })(this)">Show stack trace \u25bc</button>
              <div class="error-stack-detail">${escapeHtml(errStack)}</div>
            </div>
          ` : ''}
        </div>
      `;
    }
    resetRefreshBtn();
  }
}

function renderUnsafe() {
  const d = data;

  // Diffing (compare with prevData)
  if (prevData) {
    diffProcesses(prevData.processes, d.processes);
    diffTerminals(prevData.terminals, d.terminals);
  }
  if (prevData) {
    // Health status change
    if (prevData.health && d.health && prevData.health.status !== d.health.status) {
      addActivity(`Health status changed: ${prevData.health.status} \u2192 ${d.health.status}`, 'warning', {
        id: `diag:health:${diagnosticIdPart(prevData.health.status)}->${diagnosticIdPart(d.health.status)}`,
        kind: 'health',
        source: 'health',
      });
    }
    // Git dirty status change
    if (prevData.git && d.git) {
      if (!prevData.git.dirty && d.git.dirty) {
        addActivity(`Git: ${d.git.dirtyCount} file${d.git.dirtyCount !== 1 ? 's' : ''} modified`, 'git', {
          id: 'diag:git_dirty:dirty',
          kind: 'git_dirty',
          source: 'git',
          replacePrefix: 'diag:git_dirty:',
        });
      } else if (prevData.git.dirty && !d.git.dirty) {
        addActivity('Git: working tree clean', 'git', {
          id: 'diag:git_dirty:clean',
          kind: 'git_dirty',
          source: 'git',
          replacePrefix: 'diag:git_dirty:',
        });
      }
    }
  }
  const handoffChanged = prevData && JSON.stringify(d.system?.handoff) !== JSON.stringify(prevData.system?.handoff);
  const nowChanged = prevData && nowFingerprint(d.missionControl?.now) !== nowFingerprint(prevData.now);
  const attentionChanged =
    prevData &&
    flightLogFingerprint(d) !==
      flightLogFingerprint({
        flightLog: prevData.flightLog,
        now: prevData.now,
        system: prevData.system,
      });
  prevData = snapshotPrevData(d);

  dataLoading = false;

  const contentEl = document.getElementById('content');
  const uiState = captureUiState();

  // Update SSE timer
  updateSSETimer();

  // Meta (hidden chrome; kept for tooling / future use)
  const versionEl = document.getElementById('version');
  if (versionEl) versionEl.textContent = `v${d.system?.version || '\u2014'}`;
  const dataVersionEl = document.getElementById('dataVersion');
  if (dataVersionEl) dataVersionEl.textContent = `schema ${d.dashboardDataVersion || '\u2014'}`;
  const lastUpdatedEl = document.getElementById('lastUpdated');
  if (lastUpdatedEl) lastUpdatedEl.textContent = `Updated ${fmtTime(d.generatedAt)}`;

  const workspaceEl = document.getElementById('headerWorkspace');
  if (workspaceEl) {
    const root = typeof d.system?.repoRoot === 'string' ? d.system.repoRoot.trim() : '';
    const base = root ? root.replace(/\\/g, '/').replace(/\/$/, '').split('/').pop() : '';
    const port = d.system?.port;
    if (base) {
      workspaceEl.hidden = false;
      workspaceEl.textContent = base;
      workspaceEl.title = port ? `${root} · :${port}` : root;
      document.title = `Mission Control · ${base}`;
    } else {
      workspaceEl.hidden = true;
      workspaceEl.textContent = '';
      workspaceEl.removeAttribute('title');
      document.title = 'Mission Control';
    }
  }

  const health = d.health;
  updateTransportChrome();

  // Nav badges (counts only; no decorative pulse)
  const navOverviewBadge = document.getElementById('navOverviewBadge');
  navOverviewBadge.textContent = d.plans.length;
  navOverviewBadge.className = 'top-tab-badge';
  const navPlansBadge = document.getElementById('navPlansBadge');
  navPlansBadge.textContent = d.plans.length;
  navPlansBadge.className = 'top-tab-badge';
  const navAgentsBadge = document.getElementById('navAgentsBadge');
  navAgentsBadge.textContent = d.agents.length;
  navAgentsBadge.className = 'top-tab-badge';
  const navSkillsBadge = document.getElementById('navSkillsBadge');
  navSkillsBadge.textContent = d.skills.length;
  navSkillsBadge.className = 'top-tab-badge';
  const navCommandsBadge = document.getElementById('navCommandsBadge');
  navCommandsBadge.textContent = d.commands.length;
  navCommandsBadge.className = 'top-tab-badge';
  const navTerminalsBadge = document.getElementById('navTerminalsBadge');
  navTerminalsBadge.textContent = d.terminals.length;
  navTerminalsBadge.className = 'top-tab-badge';
  const navProcessesBadge = document.getElementById('navProcessesBadge');
  navProcessesBadge.textContent = d.processes.length;
  navProcessesBadge.className = 'top-tab-badge';

  // Nav health dot
  const healthDot = document.getElementById('navHealthDot');
  healthDot.className = `dot dot-${health.status === 'ok' ? 'green' : health.status === 'warning' ? 'yellow' : 'red'}`;

  // Git nav dot
  const gitDot = document.getElementById('navGitDot');
  if (d.git?.dirty) {
    gitDot.className = 'dot dot-yellow';
  } else if (d.git?.branch) {
    gitDot.className = 'dot dot-green';
  }

  // Terminals / processes nav items carry count badges only (no decorative dots).

  // Build full HTML string once
  const parts = [];

  // ===== Overview (narrow plugin shell: now stack first) =====
  // Primary history = semantic sequence (run-plan ticks, merges, staging, plan progress).
  // Raw terminal/process churn stays in the Activity diagnostic tab.
  const semanticEvents = semanticFeedEvents(d);
  const feedEvents = semanticEvents.filter((ev) => MONITOR_ACTIVITY_KINDS.has(ev?.kind)).slice(0, monitorFeedCap(d));
  const unifiedEvents = unifiedActivityEvents(semanticEvents);
  const filteredActivityEvents = filterUnifiedActivityEvents(unifiedEvents, activitySourceFilter);
  const activityFilterId = activityFilterDef(activitySourceFilter).id;
  const activityCountLabel = activityFilterId === 'all'
    ? `${unifiedEvents.length} events`
    : `${filteredActivityEvents.length} of ${unifiedEvents.length} events`;

  const navActivityBadge = document.getElementById('navActivityBadge');
  navActivityBadge.textContent = unifiedEvents.length;
  navActivityBadge.className = 'top-tab-badge';
  parts.push(`
    <div class="content-section active" id="section-overview">
      <div class="overview-stack">
        ${renderNowExecutionPanel(d, !!(nowChanged || handoffChanged))}

        ${renderAttentionPanel(d, !!attentionChanged)}

        ${renderRecentPlanCards(d)}

        <div class="section-hero" id="hero-activity">
          <div class="live-activity-header">
            <span class="card-title">${spaceIconSvg('monitor')}Crew Monitor</span>
            <span class="section-subtitle" style="margin-left:auto">${feedEvents.length} shown</span>
            <button type="button" class="git-action-btn monitor-density-btn" data-monitor-density-toggle data-focus-key="monitor-density-toggle" aria-pressed="${currentMonitorDensity() === 'comfortable' ? 'true' : 'false'}" title="Toggle Crew Monitor row density (compact single-line rows vs comfortable two-line rows)" onclick="toggleMonitorDensity()">${currentMonitorDensity() === 'comfortable' ? 'Comfortable' : 'Compact'}</button>
          </div>
          <div class="live-activity-feed monitor-cq">
            ${feedEvents.length === 0
              ? renderEmptyStateCta({
                  headline: 'Listening',
                  iconKind: 'monitor',
                  support:
                    'No agent activity yet. Events appear as agents run plans and ship deliveries.',
                  compact: true,
                  className: 'activity-feed-empty',
                })
              : feedEvents.map((ev, idx) => {
                  const info = semanticEventInfo(ev.kind, ev.refs?.commitType);
                  const gloss = info.gloss || info.tag || ev.kind || 'event';
                  const staggerIdx = Math.min(idx, 5);
                  const row = parseCrewRow(ev);
                  const role = crewActorRole(ev, row.actor);
                  const rawActor = row.actor || crewEventActor(ev);
                  const actionAttrs = activityTargetAttributes(ev, 'monitor-activity', { kindGloss: gloss });
                  const rowA11y = actionAttrs
                    ? actionAttrs
                    : ` aria-label="${escapeAttr(`${gloss}: ${ev.label || role}`)}"`;
                  // Row order (design v2, 2026-08-05): team badge, actor, verb,
                  // primary, ref chips, time. The kind glyph is gone — its colour
                  // moved onto the badge and its meaning onto the badge tooltip, so
                  // nothing composes a glyph into the text and a flat single-segment
                  // label cannot misplace one. `info.bg` tints the badge; that is the
                  // only place a Crew row carries it.
                  const badgeHtml = `<span class="monitor-row-badge" style="background:${info.bg};color:${info.color}" title="${escapeAttr(gloss)}" aria-hidden="true">${escapeHtml(crewActorInitials(role))}</span>`;
                  // Actor tooltip keeps the wire token next to the mask, so an
                  // operator reading `Tech Lead` can still see it came from `Eng`.
                  const actorHtml = `<span class="monitor-row-actor" title="${escapeAttr(`${role} (${rawActor})`)}">${escapeHtml(role)}</span>`;
                  const verbIcon = crewRowIconSvg(CREW_VERB_ICON[row.verb] || 'info', 'monitor-row-verb-icon');
                  const verbHtml = row.verb
                    ? `<span class="monitor-row-verb v-${escapeAttr(row.verb)}" title="${escapeAttr(row.verb)}">${verbIcon}<em>${escapeHtml(row.verb)}</em></span>`
                    : '';
                  // Ref chips: fixed content, dropped whole by the @container
                  // ladder. Never ellipsised — half a SHA is worse than no SHA.
                  const refsHtml = [
                    row.pr ? `<span class="monitor-row-ref ref-pr">${escapeHtml(row.pr)}</span>` : '',
                    row.sha ? `<span class="monitor-row-ref ref-sha">${escapeHtml(row.sha)}</span>` : '',
                    row.worker ? `<span class="monitor-row-ref ref-worker" title="worker id">${escapeHtml(row.worker)}</span>` : '',
                    row.plan
                      ? `<span class="monitor-row-plan" title="${escapeAttr(row.plan)}">${crewRowIconSvg('flag', 'monitor-row-plan-flag')}<span class="monitor-row-plan-name">${escapeHtml(row.plan.replace(/\.plan\.md$/i, ''))}</span></span>`
                      : '',
                  ].join('');
                  // labelFull (+ sourcePath) must be reachable in every layout:
                  // display `label` is capped at MAX_SEMANTIC_LABEL upstream, so
                  // no layout is a substitute for it. It rides on .monitor-row-
                  // primary rather than the row, because an actionable row's own
                  // title is already spoken for by activityTargetAttributes
                  // (the copy-path/copy-sha affordance) and a second title
                  // attribute on the same element is silently dropped. Primary is
                  // also the only field that ellipsises, so the full text sits on
                  // exactly the element whose text is cut.
                  const feedTitle = (ev.labelFull || ev.label || '') + (ev.sourcePath ? `\n${ev.sourcePath}` : '');
                  const rowTitle = actionAttrs ? '' : ` title="${escapeAttr(feedTitle)}"`;
                  return `
                    <div class="monitor-row stagger-fade stagger-${staggerIdx}"${rowA11y}${rowTitle}>
                      ${badgeHtml}
                      ${actorHtml}
                      ${verbHtml}
                      <span class="monitor-row-primary" title="${escapeAttr(feedTitle)}">${escapeHtml(row.primary)}</span>
                      <span class="monitor-row-meta">${refsHtml}</span>
                      <span class="monitor-row-time">${crewEventTime(ev, info)}</span>
                    </div>`;
                }).join('')}
          </div>
        </div>
      </div>
    </div>
  `);

  // ===== Plans (accordion portfolio) =====
  parts.push(`
    <div class="content-section" id="section-plans">
      <div class="section-title">
        Plans
        <span class="section-subtitle">${d.plans.length} total</span>
      </div>
      ${renderPlansAccordion(d)}
    </div>
  `);

  // ===== Agents =====
  const agents = d.agents || [];
  const agentLockSvg = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`;
  const agentCreatePrompt = 'Create a new agent definition under .cursor/agents/ (markdown file with a description plus the behavior body). Ask me for the name and behavior first.';
  const agentEditableCount = agents.filter(a => a.kitManaged !== true).length;
  parts.push(`
    <div class="content-section" id="section-agents">
      <div class="section-title">
        Agents
        <span class="section-subtitle">${agents.length} agents · ${agentEditableCount} editable</span>
        <button type="button" class="git-action-btn primary agent-create-btn" data-focus-key="cta-agent-create" onclick="${copyForPasteHandler(agentCreatePrompt, 'create prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('create prompt', 'chatInput'))}">Copy create prompt</button>
      </div>
      ${agents.length === 0
        ? renderEmptyStateCta({
            headline: 'No agents aboard',
            supportHtml: 'Add <code>.md</code> files under <code>.cursor/agents/</code>.',
            cta: {
              text: '.cursor/agents/',
              subject: 'path .cursor/agents/',
              destination: 'filePicker',
              label: 'Copy .cursor/agents/ path',
              focusKey: 'cta-agents-path',
            },
          })
        : ''}
      <div class="agent-grid">
        ${agents.map(a => {
          const kitManaged = a.kitManaged === true;
          const lockBadge = kitManaged
            ? `<span class="agent-lock" title="Kit managed: owned by kit updates, read-only here">${agentLockSvg}Kit managed</span>`
            : '';
          const agentPath = a.path || `.cursor/agents/${a.file || `${a.id}.md`}`;
          const usePrompt = `Use this agent definition when it matches the task:\n${agentPath}`;
          const useBtn = `<button type="button" class="git-action-btn primary" onclick="${copyForPasteHandler(usePrompt, 'use prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('use prompt', 'chatInput'))}">Copy use prompt</button>`;
          const editPrompt = `Edit this agent definition file (markdown body):\n${agentPath}`;
          const editBtn = kitManaged
            ? ''
            : `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler(editPrompt, 'edit prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('edit prompt', 'chatInput'))}">Copy edit prompt</button>`;
          const deletePrompt = `Delete this agent definition file after confirming with me:\n${agentPath}`;
          const deleteBtn = kitManaged
            ? ''
            : `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler(deletePrompt, 'delete prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('delete prompt', 'chatInput'))}">Copy delete prompt</button>`;
          return `
          <div class="agent-card"${kitManaged ? ' data-kit-managed="true"' : ''}>
            <div class="agent-card-head">
              <span class="agent-name"><span class="agent-monogram" aria-hidden="true">${escapeHtml(agentInitials(a.id))}</span>${escapeHtml(a.id)}</span>
              ${lockBadge}
            </div>
            <div class="agent-desc">${escapeHtml(a.description || 'No description available.')}</div>
            <div class="agent-file">${escapeHtml(agentPath)}</div>
            <div class="agent-actions">${useBtn}${editBtn}${deleteBtn}</div>
          </div>
        `;
        }).join('')}
      </div>
    </div>
  `);

  // ===== Commands =====
  const commandLockSvg = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`;
  const commandCreatePrompt = 'Create a new slash command under .cursor/commands/ (plain markdown body, no frontmatter). Ask me for the name and behavior first.';
  const commandEditableCount = d.commands.filter(c => c.kitManaged !== true).length;
  parts.push(`
    <div class="content-section" id="section-commands">
      <div class="section-title">
        Commands
        <span class="section-subtitle">${d.commands.length} slash commands · ${commandEditableCount} editable</span>
        <button type="button" class="git-action-btn primary command-create-btn" data-focus-key="cta-command-create" onclick="${copyForPasteHandler(commandCreatePrompt, 'create prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('create prompt', 'chatInput'))}">Copy create prompt</button>
      </div>
      ${d.commands.length === 0
        ? renderEmptyStateCta({
            headline: 'No slash commands',
            supportHtml:
              'L0 setup required: commands live in <code>.cursor/commands/</code>.',
            cta: {
              text: '.cursor/commands/',
              subject: 'path .cursor/commands/',
              destination: 'filePicker',
              label: 'Copy .cursor/commands/ path',
              focusKey: 'cta-commands-path',
            },
          })
        : ''}
      <div class="command-grid">
        ${d.commands.map(c => {
          const slash = `/${c.id}`;
          const cmdPath = c.path || `.cursor/commands/${c.file || `${c.id}.md`}`;
          const kitManaged = c.kitManaged === true;
          const lockBadge = kitManaged
            ? `<span class="command-lock" title="Kit managed: owned by kit updates, read-only here">${commandLockSvg}Kit managed</span>`
            : '';
          const runBtn = `<button type="button" class="git-action-btn primary" onclick="${copyForPasteHandler(slash, slash, 'chatInput')}" title="${escapeAttr(copyActionTitle(slash, 'chatInput'))}">Copy run command</button>`;
          const editPrompt = `Edit this slash command file (plain markdown body, no frontmatter):\n${cmdPath}`;
          const editBtn = kitManaged
            ? ''
            : `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler(editPrompt, 'edit prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('edit prompt', 'chatInput'))}">Copy edit prompt</button>`;
          const deletePrompt = `Delete this slash command file after confirming with me:\n${cmdPath}`;
          const deleteBtn = kitManaged
            ? ''
            : `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler(deletePrompt, 'delete prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('delete prompt', 'chatInput'))}">Copy delete prompt</button>`;
          return `
          <div class="command-card"${kitManaged ? ' data-kit-managed="true"' : ''}>
            <div class="command-card-head">
              <span class="command-name">${escapeHtml(slash)}</span>
              ${lockBadge}
            </div>
            <div class="command-file">${escapeHtml(cmdPath)}</div>
            <div class="command-actions">${runBtn}${editBtn}${deleteBtn}</div>
          </div>
        `;
        }).join('')}
      </div>
    </div>
  `);

  // ===== Healthcenter (More → Health) =====
  const checks = health.checks || [];
  const healthStatus = health.status || 'ok';
  const passing = checks.filter(c => c.ok).length;
  const isSnapshotError = healthStatus === 'error' && checks.length === 0;
  const isOffline = !isSnapshotError && checks.length === 0;
  const presenceTone = healthSeverityChrome(healthStatus).tone;
  const presencePulse = healthStatus !== 'ok' ? ' dot-pulse' : '';
  const presenceLabel = isSnapshotError
    ? 'Snapshot error'
    : isOffline
      ? 'Health offline'
      : healthStatus === 'ok'
        ? 'Live'
        : healthStatus === 'warning'
          ? 'Warning'
          : healthStatus === 'degraded'
            ? 'Degraded'
            : 'Error';
  const subtitle = isSnapshotError
    ? 'Snapshot unavailable'
    : isOffline
      ? 'No health data'
      : `${passing}/${checks.length} checks passing`;

  let healthBody = '';
  if (isSnapshotError) {
    healthBody = renderEmptyStateCta({
      headline: 'Health snapshot error',
      support: (typeof d.error === 'string' && d.error)
        || 'The dashboard could not load health checks (serve/snapshot failure). This is not a per-check fail.',
      iconKind: 'health',
      cta: {
        text: 'agent-kit doctor',
        subject: 'agent-kit doctor',
        destination: 'terminal',
        label: 'Autofix: copy agent-kit doctor',
        focusKey: 'cta-health-snapshot-error',
      },
    });
  } else if (isOffline) {
    healthBody = renderEmptyStateCta({
      headline: 'Health offline',
      support: 'No health data available yet. Refresh after the snapshot loads, or run doctor if the panel stays empty.',
      iconKind: 'health',
      cta: {
        text: 'agent-kit doctor',
        subject: 'agent-kit doctor',
        destination: 'terminal',
        label: 'Autofix: copy agent-kit doctor',
        focusKey: 'cta-health-offline',
      },
    });
  } else {
    const checkId = (c) => c.id || c.label || 'check';
    const renderCheckCard = (c) => {
      const id = checkId(c);
      const meta = HEALTH_CHECK_META[id] || {
        okDetail: 'Check is passing.',
        failDetail: 'Check is failing. Review configuration for this item.',
        autofix: null,
      };
      const sev = healthCheckSeverity(c, healthStatus);
      const detail = c.ok ? meta.okDetail : meta.failDetail;
      const autofix = !c.ok && meta.autofix ? meta.autofix : null;
      const fixPrompt = [`Fix this failing health check: ${c.label || id}`, detail].join('\n');
      const fixBtn = `<button type="button" class="health-autofix-btn" data-focus-key="health-fix-${escapeAttr(id)}" onclick="event.stopPropagation();${copyForPasteHandler(fixPrompt, 'fix prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('fix prompt', 'chatInput'))}">Copy fix prompt</button>`;
      const autofixBtn = autofix
        ? `<button type="button" class="health-autofix-btn" data-focus-key="health-autofix-${escapeAttr(id)}" onclick="event.stopPropagation();${copyForPasteHandler(autofix.text, autofix.subject, autofix.destination)}" title="${escapeAttr(copyActionTitle(autofix.subject, autofix.destination))}">${escapeHtml(autofix.label || 'Autofix')}</button>`
        : '';
      const actions = c.ok
        ? `<span class="health-detail-copy" style="margin:0">No action needed.</span>`
        : `${fixBtn}${autofixBtn}`;
      return `
      <div class="health-card" role="listitem" id="health-card-${escapeAttr(id)}" data-check-id="${escapeAttr(id)}" data-severity="${escapeAttr(sev)}">
        <button type="button" class="health-item" aria-expanded="false" aria-controls="health-detail-${escapeAttr(id)}" aria-label="${escapeAttr(c.label)}: ${escapeAttr(healthSeverityLabel(sev))}" onclick="toggleHealthCheck('${escapeJsString(id)}')">
          <span class="dot ${healthDotClass(sev)}"></span>
          <span class="health-item-label">${escapeHtml(c.label)}</span>
          <span class="health-item-sev" data-sev="${escapeAttr(sev)}">${escapeHtml(healthSeverityLabel(sev))}</span>
          <span class="health-item-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="health-detail" id="health-detail-${escapeAttr(id)}">
          <p class="health-detail-copy">${escapeHtml(detail)}</p>
          <div class="health-detail-actions">${actions}</div>
        </div>
      </div>`;
    };
    const grouped = HEALTH_VITAL_GROUPS.map(g => ({
      label: g.label,
      items: g.checks.map(id => checks.find(c => checkId(c) === id)).filter(Boolean),
    })).filter(g => g.items.length > 0);
    const knownIds = new Set(HEALTH_VITAL_GROUPS.flatMap(g => g.checks));
    const others = checks.filter(c => !knownIds.has(checkId(c)));
    if (others.length > 0) grouped.push({ label: 'Other checks', items: others });
    const vitalsStrip = `
      <div class="health-vitals" role="list" aria-label="Vital systems">
        ${grouped.map(g => {
          const total = g.items.length;
          const okCount = g.items.filter(c => c.ok).length;
          const state = okCount === total ? 'pass' : 'attention';
          return `
          <div class="health-vital-card" role="listitem" data-state="${state}">
            <span class="health-vital-name">${escapeHtml(g.label)}</span>
            <span class="health-vital-score">${okCount}/${total} passing</span>
            <span class="health-vital-state"><span class="dot ${state === 'pass' ? 'dot-green' : 'dot-red'}"></span>${state === 'pass' ? 'Pass' : 'Attention'}</span>
          </div>`;
        }).join('')}
      </div>`;
    healthBody = `${vitalsStrip}
      ${grouped.map(g => `
      <section class="health-group" aria-label="${escapeAttr(g.label)}">
        <div class="health-group-title">${escapeHtml(g.label)}</div>
        <div class="health-grid" role="list">
          ${g.items.map(renderCheckCard).join('')}
        </div>
      </section>`).join('')}`;
  }

  parts.push(`
    <div class="content-section" id="section-health">
      <div class="section-title">
        Health
        <span class="section-subtitle">${escapeHtml(subtitle)}</span>
      </div>
      <div class="healthcenter">
        <div class="healthcenter-presence" role="status" aria-live="polite">
          <span class="dot dot-${presenceTone}${presencePulse}"></span>
          <span>${escapeHtml(presenceLabel)}</span>
        </div>
        ${healthBody}
      </div>
    </div>
  `);

  // ===== Git =====
  parts.push(`
    <div class="content-section" id="section-git">
      <div class="section-title">
        Git
        <span class="section-subtitle">${escapeHtml(d.git?.branch || '\u2014')}${d.git?.branch ? (d.git?.dirty ? ` · ${d.git.dirtyCount} changed` : ' · clean') : ''}</span>
      </div>
      ${!d.git?.branch
        ? renderEmptyStateCta({
            headline: 'No Git signal',
            support: 'No Git data available.',
          })
        : ''}
      <div class="card" style="${d.git?.branch ? '' : 'display:none'}">
        ${renderGitHygieneHint(d.git)}
        ${renderGitFlowCard(d.git)}
        <div class="git-info">
          <div class="git-row">
            <span class="git-label">Last commit</span>
            <span class="git-value">${escapeHtml(d.git?.lastCommit || '\u2014')}</span>
          </div>
        </div>
        ${renderGitGraphCard(d.git)}
        ${d.git?.dirty ? renderGitFileList(d.git) : ''}
      </div>
    </div>
  `);

  // ===== Memory =====
  const recentDecisions = d.memory?.recentDecisions || [];
  const recentErrors = d.memory?.recentErrors || [];
  const errorStats = d.memory?.errorStats || null;
  parts.push(`
    <div class="content-section" id="section-memory">
      <div class="section-title">
        Memory
        <span class="section-subtitle">${d.memory.errors || 0} errors \u00b7 ${d.memory.decisions || 0} decisions</span>
      </div>
      <div class="memory-kpi-grid" aria-label="Error-o-meter: memory error statistics">
        <div class="memory-kpi">
          <div class="memory-kpi-label">Error-o-meter</div>
          <div class="memory-kpi-value">${errorStats ? errorStats.total : (d.memory.errors || 0)}</div>
          <div class="memory-kpi-sub">resolved errors recorded</div>
        </div>
        <div class="memory-kpi">
          <div class="memory-kpi-label">Last 30 days</div>
          <div class="memory-kpi-value">${errorStats ? errorStats.last30d : 0}</div>
          <div class="memory-kpi-sub">new error entries</div>
        </div>
        <div class="memory-kpi">
          <div class="memory-kpi-label">Weekly rate</div>
          <div class="memory-kpi-value">${errorStats ? errorStats.weeklyRate : 0}</div>
          <div class="memory-kpi-sub">errors per week (30d avg)</div>
        </div>
        <div class="memory-kpi">
          <div class="memory-kpi-label">Top tags</div>
          <div class="memory-tag-row">
            ${errorStats && errorStats.topTags.length > 0
              ? errorStats.topTags.map(t => `<span class="memory-tag" title="${escapeAttr(`${t.count} entries tagged ${t.tag}`)}">${escapeHtml(t.tag)} ×${t.count}</span>`).join('')
              : '<span class="memory-kpi-sub">no tags recorded</span>'}
          </div>
        </div>
      </div>
      <div class="grid-2">
        <div class="memory-panel">
          <div class="memory-panel-header">
            <span class="memory-panel-icon memory-panel-icon-green" aria-hidden="true">✓</span>
            <span class="memory-panel-title">Healthy memory</span>
            <span class="memory-panel-sub">${d.memory.decisions || 0} decisions recorded</span>
          </div>
          ${recentDecisions.length > 0 ? `
            <div class="memory-list">
              ${recentDecisions.map(dd => {
                const memPath = dd.path || `.cursor/memory/decisions/${dd.id || dd}.md`;
                const memId = dd.id || dd;
                return `
                <div class="memory-item" role="button" tabindex="0" aria-label="Copy path for ${escapeAttr(memId)}" onclick="${copyRepoPathHandler(memPath)}" title="${escapeAttr(pathActionTitle(memPath))}">
                  <span>${escapeHtml(memId)}</span>
                </div>
              `;
              }).join('')}
            </div>
          ` : renderEmptyStateCta({
            headline: 'No decisions yet',
            support: 'Accepted tradeoffs land in .cursor/memory/decisions/ as ADR-lite entries.',
            compact: true,
          })}
        </div>
        <div class="memory-panel">
          <div class="memory-panel-header">
            <span class="memory-panel-icon memory-panel-icon-red" aria-hidden="true">⚠</span>
            <span class="memory-panel-title">Recent errors</span>
            <span class="memory-panel-sub">${recentErrors.length} of ${d.memory.errors || 0}</span>
          </div>
          ${recentErrors.length > 0
            ? recentErrors.map((entry, idx) => renderMemoryErrorRow(entry, idx)).join('')
            : renderEmptyStateCta({
                headline: 'No errors recorded',
                support: 'Investigated errors with cause and fix land in .cursor/memory/errors/.',
                compact: true,
              })}
        </div>
      </div>
    </div>
  `);

  // ===== Terminals =====
  terminalOutputStore.clear();
  parts.push(`
    <div class="content-section" id="section-terminals">
      <div class="section-title">
        Terminals
        <span class="section-subtitle">${d.terminals.length} active</span>
      </div>
      ${d.terminals.length === 0
        ? renderEmptyStateCta({
            headline: 'No open sessions',
            support: 'No active terminal sessions.',
          })
        : ''}
      <div class="terminal-list">
        ${d.terminals.map(t => {
          const exitOk = t.lastExitCode === '0' || !t.lastExitCode;
          const cwd = t.cwd || t.id;
          const outputPreview = t.lastOutput || '';
          if (outputPreview) {
            terminalOutputStore.set(t.id, {
              content: outputPreview,
              title: `Terminal: ${t.id}`,
            });
          }
          return `
            <div class="terminal-item" role="button" tabindex="0" aria-label="Copy the working directory for terminal ${escapeAttr(t.id)}" onclick="${copyForPasteHandler(cwd, 'terminal working directory', 'terminal')}" title="${escapeAttr(copyActionTitle('terminal working directory', 'terminal'))}">
              <div class="terminal-item-row">
                <span class="dot dot-${exitOk ? 'green' : 'red'} ${t.lastCommand ? 'dot-pulse' : ''}"></span>
                <span style="flex:1">
                  <span style="color:var(--text-primary)">${escapeHtml(t.id)}</span>
                  ${t.lastCommand ? `\u2014 <span style="color:var(--text-muted)">${escapeHtml(t.lastCommand)}</span>` : ''}
                </span>
                <span style="color:var(--text-muted)">${t.outputLines} lines</span>
                ${t.pid ? `<span style="color:var(--text-muted)">PID ${escapeHtml(t.pid)}</span>` : ''}
                ${outputPreview ? `<button type="button" class="terminal-expand-btn" data-terminal-id="${escapeAttr(t.id)}" aria-label="Expand the captured output for terminal ${escapeAttr(t.id)}" title="Expand the captured output for terminal ${escapeAttr(t.id)}">(expand)</button>` : ''}
              </div>
              ${outputPreview ? `<div class="terminal-preview">${escapeHtml(outputPreview)}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `);

  // ===== Processes =====
  const processes = d.processes || [];
  // Detached audit-session visibility (phase3): host-wide agent-kit-audit-* PTYs.
  const auditSessions = d.system?.detachedAuditSessions || null;
  const auditSessionsNote = auditSessions && auditSessions.count > 0
    ? `
      <div class="processes-note">
        <span><strong>${auditSessions.count} detached audit ${auditSessions.count === 1 ? 'session' : 'sessions'}.</strong> Host-wide <code>agent-kit-audit-*</code> plan-review ${auditSessions.count === 1 ? 'PTY is' : 'PTYs are'} still alive (${auditSessions.oldestAgeSeconds != null ? `oldest ~${formatDuration(auditSessions.oldestAgeSeconds)}` : 'oldest age unknown'}). Inspect with <code>tmux attach -t &lt;name&gt;</code> / <code>screen -r &lt;name&gt;</code>, or let the audit launcher's session GC dispose of them on the next spawn.</span>
      </div>`
    : '';
  parts.push(`
    <div class="content-section" id="section-processes">
      <div class="section-title">
        Processes
        <span class="section-subtitle">${processes.length} running</span>
      </div>
      <div class="processes-note">
        <span><strong>Live ps snapshot.</strong> Agent chats spawned inside the IDE do not appear here; the Crew monitor on the Overview tab tracks that activity.</span>
      </div>${auditSessionsNote}
      ${processes.length === 0
        ? renderEmptyStateCta({
            headline: 'All quiet',
            support: 'No relevant processes running. Node, git, and dashboard processes appear here while active.',
          })
        : `
        <div class="process-list">
          ${processes.map(p => {
            const pidStr = String(p.pid ?? '');
            return `
              <div class="process-card">
                <div class="process-card-head">
                  <span class="process-label-badge">${escapeHtml(p.label || 'other')}</span>
                  <span class="process-actions">
                    <button type="button" class="process-copy-btn" onclick="event.stopPropagation();${copyForPasteHandler(pidStr, `PID ${pidStr}`, 'terminal')}" title="${escapeAttr(copyActionTitle(`PID ${pidStr}`, 'terminal'))}">Copy PID</button>
                  </span>
                </div>
                ${p.description ? `<div class="process-desc">${escapeHtml(p.description)}</div>` : ''}
                <div class="process-meta">
                  <span>PID ${escapeHtml(pidStr)}</span>
                  <span>CPU ${escapeHtml(p.cpu || '\u2014')}%</span>
                  <span>MEM ${escapeHtml(p.mem || '\u2014')}%</span>
                  ${p.etime ? `<span>up ${escapeHtml(p.etime)}</span>` : ''}
                </div>
                <div class="process-cmd" title="${escapeAttr(p.command || '\u2014')}">${escapeHtml(p.command || '\u2014')}</div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    </div>
  `);

  // ===== Skills =====
  const skills = d.skills || [];
  const skillLockSvg = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>`;
  const skillCreatePrompt = 'Create a new Agent Skill under .cursor/skills/ (directory with a SKILL.md markdown body). Ask me for the name and behavior first.';
  const skillEditableCount = skills.filter(s => s.kitManaged !== true).length;
  parts.push(`
    <div class="content-section" id="section-skills">
      <div class="section-title">
        Skills
        <span class="section-subtitle">${skills.length} skills · ${skillEditableCount} editable</span>
        <button type="button" class="git-action-btn primary skill-create-btn" data-focus-key="cta-skill-create" onclick="${copyForPasteHandler(skillCreatePrompt, 'create prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('create prompt', 'chatInput'))}">Copy create prompt</button>
      </div>
      ${skills.length === 0
        ? renderEmptyStateCta({
            headline: 'No skills found',
            supportHtml:
              'Skills appear when discovered under <code>.cursor/skills/</code>.',
            cta: {
              text: '.cursor/skills/',
              subject: 'path .cursor/skills/',
              destination: 'filePicker',
              label: 'Copy .cursor/skills/ path',
              focusKey: 'cta-skills-path',
            },
          })
        : ''}
      <div class="skill-grid">
        ${skills.map(s => {
          const skillFile = s.file || `.cursor/skills/${s.id}/SKILL.md`;
          const skillDir = skillFile.replace(/\/SKILL\.md$/, '');
          const kitManaged = s.kitManaged === true;
          const lockBadge = kitManaged
            ? `<span class="skill-lock" title="Kit managed: owned by kit updates, read-only here">${skillLockSvg}Kit managed</span>`
            : '';
          const usePrompt = `Read this skill file and follow its instructions:\n${skillFile}`;
          const useBtn = `<button type="button" class="git-action-btn primary" onclick="${copyForPasteHandler(usePrompt, 'use prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('use prompt', 'chatInput'))}">Copy use prompt</button>`;
          const editPrompt = `Edit this skill file (SKILL.md markdown body):\n${skillFile}`;
          const editBtn = kitManaged
            ? ''
            : `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler(editPrompt, 'edit prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('edit prompt', 'chatInput'))}">Copy edit prompt</button>`;
          const deletePrompt = `Delete this skill directory after confirming with me:\n${skillDir}`;
          const deleteBtn = kitManaged
            ? ''
            : `<button type="button" class="git-action-btn" onclick="${copyForPasteHandler(deletePrompt, 'delete prompt', 'chatInput')}" title="${escapeAttr(copyActionTitle('delete prompt', 'chatInput'))}">Copy delete prompt</button>`;
          return `
          <div class="skill-card"${kitManaged ? ' data-kit-managed="true"' : ''} title="${escapeAttr(s.description || '')}">
            <div class="skill-card-head">
              <span class="skill-name">${escapeHtml(s.title)}</span>
              ${lockBadge}
            </div>
            <span class="skill-cat">${escapeHtml(s.category || 'root')}</span>
            <div class="skill-file">${escapeHtml(skillFile)}</div>
            <div class="skill-actions">${useBtn}${editBtn}${deleteBtn}</div>
          </div>
        `;
        }).join('')}
      </div>
    </div>
  `);

  // ===== Activity =====
  const activityEmpty = unifiedEvents.length === 0
    ? {
        headline: 'Quiet timeline',
        support: 'No meaningful activity recorded yet.',
      }
    : {
        headline: 'Nothing in this filter',
        support: 'No activity for this source.',
      };
  const activityBody = filteredActivityEvents.length === 0
    ? renderEmptyStateCta(activityEmpty)
    : `
        <div class="card">
          <div class="activity-list" role="list" aria-label="Unified activity feed">
            ${filteredActivityEvents.map((ev, idx) => {
              const info = activityEventInfo(ev);
              const stgIdx = Math.min(idx, 5);
              const actionAttrs = activityTargetAttributes(ev, 'unified-activity');
              return `
              <div role="listitem">
                <div class="activity-item stagger-fade stagger-${stgIdx}"${actionAttrs}>
                  <span class="activity-icon" style="background:${info.bg};color:${info.color}" aria-hidden="true">${info.icon}</span>
                  <span class="activity-time">${escapeHtml(unifiedEventTime(ev))}</span>
                  <span class="activity-source">${escapeHtml(ev.source)}</span>
                  <span class="activity-label">${escapeHtml(ev.label)}</span>
                </div>
              </div>
            `;
            }).join('')}
          </div>
        </div>
      `;
  parts.push(`
    <div class="content-section" id="section-activity">
      <div class="section-title">
        Activity
        <span class="section-subtitle">${escapeHtml(activityCountLabel)} · Last refreshed ${escapeHtml(relativeTime(d.generatedAt))}</span>
      </div>
      ${renderActivityFilterChips()}
      ${activityBody}
    </div>
  `);

  parts.push(renderConfigSection(d));

  // Single innerHTML assignment — no layout thrashing
  contentEl.innerHTML = parts.join('');

  wireTerminalExpandButtons();

  updateTransportChrome();

  // Restore the section the user had selected (Cockpit/overview on first paint)
  showSection(activeSectionId || 'overview');

  // Keep expanded agent rows / focus / scroll across SSE snapshot refreshes
  restoreUiState(uiState);
  applyPlanAccordionState();
}

// ===== Auto-refresh (paused while SSE is healthy) =====
function syncPollingWithSseMode() {
  if (sseMode === 'live' && !sseReconnecting && !sseSilentFallback) {
    stopAutoRefresh();
  } else {
    startAutoRefresh();
  }
}

function clearSseSilentFallback() {
  if (!sseSilentFallback) return;
  sseSilentFallback = false;
  syncPollingWithSseMode();
}

/** Open-but-silent SSE: resume poll without tearing down EventSource. */
function checkSseSilence() {
  if (sseMode !== 'live' || !sseSource) return;
  if (Date.now() - lastSseDataTime <= SSE_SILENCE_MS) {
    clearSseSilentFallback();
    return;
  }
  if (!sseSilentFallback) {
    sseSilentFallback = true;
    syncPollingWithSseMode();
    updateTransportChrome();
  }
}

// ===== Broadcast auth (opt-in LAN; loopback needs no token) =====
const MC_TOKEN_STORAGE_KEY = 'agent-kit:mc-broadcast-token';

function missionControlAuthToken() {
  try {
    const u = new URL(location.href);
    const q = u.searchParams.get('token');
    if (q) {
      try {
        sessionStorage.setItem(MC_TOKEN_STORAGE_KEY, q);
      } catch (e) { /* private mode */ }
      u.searchParams.delete('token');
      const next = u.pathname + u.search + u.hash;
      if (typeof history !== 'undefined' && history.replaceState) {
        history.replaceState({}, '', next);
      }
      return q;
    }
    return sessionStorage.getItem(MC_TOKEN_STORAGE_KEY) || '';
  } catch (e) {
    return '';
  }
}

function withMissionControlAuth(url) {
  const t = missionControlAuthToken();
  if (!t) return url;
  const sep = url.indexOf('?') >= 0 ? '&' : '?';
  return url + sep + 'token=' + encodeURIComponent(t);
}

// Warm token from query on first paint (sets cookie via server + sessionStorage).
missionControlAuthToken();

// ===== SSE =====
function connectSSE() {
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  try {
    sseSource = new EventSource(withMissionControlAuth('/api/events'));
    sseSource.onopen = () => {
      sseFailedAttempts = 0;
      sseMode = 'live';
      sseReconnecting = false;
      lastEventTime = Date.now();
      // Do not reset lastSseDataTime here: reconnect storms would keep the
      // silence watchdog from ever resuming poll. Only onmessage counts.
      startSSETimer();
      syncPollingWithSseMode();
      updateTransportChrome();
      if (data) render();
    };

    // Debounced SSE handler avoids rapid re-renders.
    // Do NOT set dataLoading here: that wiped the pane and skipped render forever.
    const debouncedRender = debounce(() => {
      render();
    }, 150);

    sseSource.onmessage = (event) => {
      try {
        const newData = JSON.parse(event.data);
        // Only count validated payloads. Broken multi-line SSE used to deliver
        // `{` fragments that reset silence and permanently suppressed poll.
        if (newData && typeof newData === 'object' && Array.isArray(newData.plans)) {
          lastEventTime = Date.now();
          lastSseDataTime = Date.now();
          clearSseSilentFallback();
          data = newData;
          debouncedRender();
        }
      } catch (e) {
        // ignore parse errors
      }
    };
    sseSource.onerror = () => {
      sseFailedAttempts++;
      if (sseFailedAttempts >= 3) {
        sseReconnecting = true;
        syncPollingWithSseMode();
        if (data) render();
        // Give it a few more attempts before falling back to polling
        setTimeout(() => {
          if (sseFailedAttempts >= 6) {
            if (sseSource) { sseSource.close(); sseSource = null; }
            sseMode = 'polling';
            sseReconnecting = false;
            sseSilentFallback = false;
            stopSSETimer();
            syncPollingWithSseMode();
            if (data) render();
          }
        }, 10000);
      }
    };
  } catch (e) {
    sseMode = 'polling';
    sseSilentFallback = false;
    syncPollingWithSseMode();
  }
}

// ===== Fetch =====
async function fetchData({ force = false } = {}) {
  // When SSE is healthy, skip poll fetches unless forced (Refresh button)
  // or silence fallback has re-enabled polling beside the open stream.
  if (!force && sseMode === 'live' && !sseReconnecting && !sseSilentFallback && data) return;

  const btn = document.getElementById('refreshBtn');
  if (btn) {
    btn.disabled = true;
    btn.classList.add('is-refreshing');
    btn.setAttribute('aria-label', 'Refreshing');
    btn.title = 'Refreshing';
  }

  // Only wipe the pane on the first load; background refresh keeps the last good render.
  if (!data) {
    dataLoading = true;
  }

  // Try multiple URLs — works when served by dashboard/serve.mjs or a static server
  const urls = [
    withMissionControlAuth('/dashboard-data.json?_=' + Date.now()),
    withMissionControlAuth('/api/data?_=' + Date.now()),
    withMissionControlAuth('dashboard-data.json?_=' + Date.now()),
  ];

  for (const url of urls) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) continue;
      const next = await resp.json();
      // Validate it looks like our data
      if (next && typeof next === 'object' && Array.isArray(next.plans)) {
        data = next;
        lastEventTime = Date.now();
        if (sseMode !== 'live') {
          updateSSETimer();
        }
        render();
        resetRefreshBtn();
        return;
      }
    } catch {
      // try next url
    }
  }

  // Fallback: show instructions only when we have no data yet
  resetRefreshBtn();
  if (btn && !data) {
    btn.setAttribute('aria-label', 'Start server');
    btn.title = 'Start server';
  }
  dataLoading = false;
  if (data) return;
  document.getElementById('loading').innerHTML = `
    <div class="empty-state">
      ${renderEmptyStateCta({
        headline: 'Dashboard Server',
        supportHtml:
          'Start the data server for live data. Or generate static data once with <code>node dashboard/dashboard-data.mjs &gt; dashboard/dashboard-data.json</code>.',
        cta: {
          text: 'node dashboard/serve.mjs',
          subject: 'dashboard serve command',
          destination: 'terminal',
          label: 'Copy serve command',
          focusKey: 'cta-dashboard-serve',
        },
      })}
    </div>
  `;
}

// ===== Auto-refresh =====
function refresh() {
  fetchData({ force: true });
}
function startAutoRefresh() {
  stopAutoRefresh();
  timer = setInterval(() => fetchData(), refreshInterval);
}
function stopAutoRefresh() {
  if (timer) { clearInterval(timer); timer = null; }
}

// ===== Init =====
fetchData();
connectSSE();
syncPollingWithSseMode();
startStatusBarTimer();
</script>
</body>
