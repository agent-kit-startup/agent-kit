/**
 * Flight Log panel: HANDOFF Gaps log (live large + earlier smaller) + Warnings lane.
 * When Gaps + Warnings are empty, may show bounded quiet open-triage rows.
 * Field Report attention inbox / bulk CTAs stay off this card.
 */
function renderAttentionPanel(d, attentionChanged) {
  const fl = d.missionControl?.flightLog || null;
  const sourcePath =
    (typeof fl?.sourcePath === 'string' && fl.sourcePath.trim()) ||
    '.cursor/HANDOFF.md';
  const current =
    typeof fl?.current === 'string' && fl.current.trim()
      ? fl.current.trim()
      : typeof d.missionControl?.now?.gaps === 'string' && d.missionControl.now.gaps.trim()
        ? d.missionControl.now.gaps.trim()
        : typeof d.system?.handoff?.gaps === 'string' && d.system.handoff.gaps.trim()
          ? d.system.handoff.gaps.trim()
          : null;
  const past = Array.isArray(fl?.past) ? fl.past : [];
  const warnings = Array.isArray(fl?.warnings) ? fl.warnings : [];
  const quietOpenTriages = Array.isArray(fl?.quietOpenTriages)
    ? fl.quietOpenTriages
    : Array.isArray(d.missionControl?.attention)
      ? d.missionControl.attention.filter(
          (i) => i && i.kind === 'report' && typeof i.sourcePath === 'string' && i.sourcePath.trim(),
        ).slice(0, 5)
      : [];
  const pastCards = past
    .filter((e) => e && typeof e.text === 'string' && e.text.trim())
    .map((e, idx) =>
      renderFlightLogCard(
        {
          text: e.text,
          at: e.at || null,
          sourcePath: e.sourcePath || sourcePath,
          variant: 'past',
          kind: e.kind || null,
        },
        idx,
      ),
    )
    .join('');
  const warningCards = warnings
    .map((w, idx) => renderFlightLogWarningCard(w, idx))
    .filter(Boolean)
    .join('');
  const warningsBlock = warningCards
    ? `<div class="flight-log-warnings" role="list" aria-label="Operator warnings">${warningCards}</div>`
    : '';
  const openTriageCards = quietOpenTriages
    .map((item, idx) => renderFlightLogQuietOpenTriageCard(item, idx))
    .filter(Boolean)
    .join('');
  const hasOpenTriages = openTriageCards.length > 0;

  let body;
  const hasCurrent = Boolean(current);
  const hasPast = pastCards.length > 0;
  const hasWarnings = warningCards.length > 0;
  if (!hasCurrent && !hasPast && !hasWarnings) {
    if (hasOpenTriages) {
      body = `<div class="flight-log-stack" role="list" aria-label="Reviews awaiting triage">${openTriageCards}</div>`;
    } else {
      body = renderEmptyStateCta({
        headline: 'All clear',
        iconKind: 'field-report',
        support: 'Quiet cockpit. Residuals show up here when Gaps change.',
        compact: true,
        className: 'attention-empty',
      });
    }
  } else if (!hasCurrent && !hasPast && hasWarnings) {
    body = `${warningsBlock}`;
  } else {
    const currentCard = hasCurrent
      ? renderFlightLogCard(
          {
            text: current,
            sourcePath,
            variant: 'current',
            kind: typeof fl?.currentKind === 'string' ? fl.currentKind : null,
          },
          0,
        )
      : `<div class="flight-log-card flight-log-card-current flight-log-kind-ok" role="status" data-flight-log-kind="ok" aria-label="No live Gaps">
          <span class="flight-log-card-label">Live</span>
          <div class="flight-log-card-text" style="color:var(--text-muted)">Quiet · nothing live</div>
        </div>`;
    body = `${warningsBlock}<div class="flight-log-stack" role="list">${currentCard}${pastCards}</div>`;
  }

  const countLabel = hasCurrent
    ? hasPast
      ? `1 · ${past.length} earlier${hasWarnings ? ` · ${warnings.length} warn` : ''}`
      : hasWarnings
        ? `1 · ${warnings.length} warn`
        : '1'
    : hasPast
      ? `${past.length} earlier${hasWarnings ? ` · ${warnings.length} warn` : ''}`
      : hasWarnings
        ? `${warnings.length} warn`
        : hasOpenTriages
          ? `${quietOpenTriages.length} review`
          : 'Clear';

  return `
    <div class="card${attentionChanged ? ' card-flash' : ''}" id="attention-panel">
      <div class="card-header now-panel-header">
        <span class="card-title">${spaceIconSvg('field-report')}Flight Log</span>
        <span class="section-subtitle" style="margin-left:auto">${escapeHtml(countLabel)}</span>
      </div>
      <div class="panel-scroll-body">${body}</div>
    </div>
  `;
}

/** 1s text-only tick for live mission elapsed (no animation; reduced-motion safe). */
let nowTimingTickTimer = null;
function stopNowTimingTick() {
  if (nowTimingTickTimer != null) {
    clearInterval(nowTimingTickTimer);
    nowTimingTickTimer = null;
  }
}
function syncNowTimingTick(now) {
  stopNowTimingTick();
  if (!now || now.timingFrozenAt || now.totalElapsedMs == null || !now.timingStartedAt) return;
  const status = now.status || 'idle';
  if (status !== 'executing' && status !== 'awaiting_user') return;
  const tick = () => {
    const valueEl = document.querySelector('[data-now-timing-value]');
    const item = document.querySelector('[data-now-timing]');
    if (!valueEl || !item || item.getAttribute('data-now-timing-frozen') === '1') {
      stopNowTimingTick();
      return;
    }
    const live = computeNowTimingElapsed(now);
    if (!live) return;
    const totalLabel = formatElapsedCompact(live.total);
    const stageLabel =
      live.stage != null && Number.isFinite(live.stage) ? formatElapsedCompact(live.stage) : '';
    const valueText = stageLabel
      ? `${totalLabel} total \u00b7 ${stageLabel} this step`
      : `${totalLabel} total`;
    const ariaPlain = stageLabel
      ? `Total elapsed ${formatElapsedPlain(live.total)}, current step ${formatElapsedPlain(live.stage)}`
      : `Total elapsed ${formatElapsedPlain(live.total)}`;
    valueEl.textContent = valueText;
    valueEl.setAttribute('aria-label', ariaPlain);
    item.setAttribute('title', ariaPlain);
  };
  tick();
  nowTimingTickTimer = setInterval(tick, 1000);
}

/** Optional previous-step duration for stepper title (discreet, no table). */
function previousStageElapsedTitle(now) {
  const prevId = now?.previousTodo?.id;
  if (!prevId || !Array.isArray(now?.stages)) return '';
  const row = now.stages.find((s) => s && s.id === prevId);
  if (!row || row.elapsedMs == null || !Number.isFinite(row.elapsedMs)) return '';
  return `Previous step elapsed ${formatElapsedPlain(row.elapsedMs)}`;
}

function flightLogFingerprint(fl) {
  if (!fl || typeof fl !== 'object') return '';
  const current = typeof fl.current === 'string' ? fl.current : '';
  const past = Array.isArray(fl.past)
    ? fl.past.map((e) => (e && typeof e.text === 'string' ? e.text : '')).join('\n')
    : '';
  const warnings = Array.isArray(fl.warnings)
    ? fl.warnings.map((w) => (w && (w.id || w.text) ? String(w.id || w.text) : '')).join('\n')
    : '';
  const openTriages = Array.isArray(fl.quietOpenTriages)
    ? fl.quietOpenTriages.map((i) => (i && (i.id || i.sourcePath) ? String(i.id || i.sourcePath) : '')).join('\n')
    : '';
  return `${current}\0${past}\0${warnings}\0${openTriages}`;
}

// Step progress bar: one segment per plan step (completed / current / remaining).
function renderNowStepBar(now) {
  const total = now?.progress?.total ?? 0;
  if (total <= 0) return '';
  const completed = Math.min(Math.max(now?.progress?.completed ?? 0, 0), total);
  const hasCurrent = !!now?.currentTodo && completed < total;
  const remaining = Math.max(0, total - completed - (hasCurrent ? 1 : 0));
  const segs =
    '<span class="now-stepbar-seg now-stepbar-seg-done" aria-hidden="true"></span>'.repeat(completed) +
    (hasCurrent ? '<span class="now-stepbar-seg now-stepbar-seg-current" aria-hidden="true"></span>' : '') +
    '<span class="now-stepbar-seg" aria-hidden="true"></span>'.repeat(remaining);
  const aria = `Step progress: ${completed} of ${total} steps complete${hasCurrent ? ', 1 in progress' : ''}`;
  return `
    <div class="now-stepbar-row">
      <div class="now-stepbar" role="img" aria-label="${escapeAttr(aria)}">${segs}</div>
      <span class="now-stepbar-label" aria-hidden="true">${completed} of ${total}</span>
    </div>
  `;
}

function nowStepTodoText(todo) {
  return `<span class="now-todo-id">${escapeHtml(todo.id)}</span>${todo.content ? ` \u2014 ${escapeHtml(todo.content)}` : ''}`;
}

/** Next-up row text for a completed mission inside a /run-plan-all queue. */
function nowNextUpText(nextUpPlan) {
  return `<span class="now-todo-id">${escapeHtml(nextUpPlan)}</span> (next plan in the run queue)`;
}

// Completed mission: the last completed to-do is the terminal step. When the
// HANDOFF run queue (/run-plan-all) holds a later plan, the closing row names
// that plan as Next up; otherwise it states there is no next action. A HANDOFF
// instruction is never promoted here: the run is over.
function renderNowCompletedStepper(now) {
  const total = now?.progress?.total ?? 0;
  const completed = Math.min(Math.max(now?.progress?.completed ?? 0, 0), total);
  const finalTodo = now?.currentTodo || now?.previousTodo || null;
  const finalText = finalTodo ? nowStepTodoText(finalTodo) : escapeHtml('Plan complete');
  const doneCount = total > 0 ? `${completed} of ${total} steps done` : 'no steps recorded';
  const nextUpPlan = now?.nextUpPlan || null;
  const aria = nextUpPlan
    ? `Mission complete: final step done, next up ${nextUpPlan} (${doneCount})`
    : `Mission complete: final step done, no next step (${doneCount})`;
  const nextLabel = nextUpPlan ? 'Next up' : 'Next';
  const nextText = nextUpPlan
    ? nowNextUpText(nextUpPlan)
    : escapeHtml(`None: mission complete (${doneCount})`);
  return `
    <ol class="now-stepper now-stepper-complete" aria-label="${escapeAttr(aria)}">
      <li class="now-step now-step-final now-step-done">
        <span class="now-step-marker" aria-hidden="true">\u2713</span>
        <div class="now-step-body">
          <span class="now-step-label">Final step</span>
          <div class="now-step-text">${finalText}</div>
        </div>
      </li>
      <li class="now-step now-step-next${nextUpPlan ? '' : ' now-step-terminal'}">
        <span class="now-step-marker" aria-hidden="true">${nextUpPlan ? '\u25CB' : '\u2014'}</span>
        <div class="now-step-body">
          <span class="now-step-label">${nextLabel}</span>
          <div class="now-step-text">${nextText}</div>
        </div>
      </li>
    </ol>
  `;
}

// Connected previous → current → next blocks derived from plan todo statuses.
function renderNowStepper(now, handoff, status, meta) {
  if (status === 'completed') return renderNowCompletedStepper(now);
  const total = now?.progress?.total ?? 0;
  const completed = now?.progress?.completed ?? 0;
  const planDone = total > 0 && completed >= total;
  const previousTodo = now?.previousTodo || null;
  const currentTodo = now?.currentTodo || null;
  const nextTodo = now?.nextTodo || null;

  const prevText = previousTodo
    ? nowStepTodoText(previousTodo)
    : escapeHtml('None \u2014 first step');
  const currentText = currentTodo
    ? nowStepTodoText(currentTodo)
    : escapeHtml(
        planDone
          ? 'Plan complete'
          : status === 'awaiting_user'
            ? 'Awaiting user decision'
            : '\u2014',
      );
  const nextText = nextTodo
    ? nowStepTodoText(nextTodo)
    : planDone && now?.nextUpPlan
      ? nowNextUpText(now.nextUpPlan)
      : escapeHtml(
          planDone
            ? 'None \u2014 plan complete'
            : handoff?.instruction
              ? handoff.instruction
              : status === 'awaiting_user'
                ? 'Awaiting user decision'
                : 'None \u2014 last step',
        );

  const currentMark = planDone ? '\u2713' : meta.mark;
  const prevElapsedTitle = previousStageElapsedTitle(now);
  const prevTitleAttr = prevElapsedTitle ? ` title="${escapeAttr(prevElapsedTitle)}"` : '';
  return `
    <ol class="now-stepper" aria-label="Work progression: previous, current, next">
      <li class="now-step now-step-previous${previousTodo ? ' now-step-done' : ' now-step-empty'}"${prevTitleAttr}>
        <span class="now-step-marker" aria-hidden="true">${previousTodo ? '\u2713' : '\u25CB'}</span>
        <div class="now-step-body">
          <span class="now-step-label">Previous</span>
          <div class="now-step-text">${prevText}</div>
        </div>
      </li>
      <li class="now-step now-step-current${planDone ? ' now-step-done' : ''}${currentTodo || planDone ? '' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">${currentMark}</span>
        <div class="now-step-body">
          <span class="now-step-label">Current</span>
          <div class="now-step-text">${currentText}</div>
        </div>
      </li>
      <li class="now-step now-step-next${nextTodo ? '' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">\u25CB</span>
        <div class="now-step-body">
          <span class="now-step-label">Next</span>
          <div class="now-step-text">${nextText}</div>
        </div>
      </li>
    </ol>
  `;
}

function renderNowExecutionPanel(d, nowChanged) {
  const now = d.missionControl?.now || null;
  const handoff = d.system?.handoff || null;
  const status = now?.status || 'idle';
  const isLive = status === 'executing' || status === 'awaiting_user';
  const isCompleted = status === 'completed';
  // Keep the mission card populated for live and completed; IDLE empty card only without a mission.
  const showMission = isLive || isCompleted;
  const meta = nowStatusMeta(status);
  const planName = now?.planId || now?.planFile || handoff?.plan || '';
  const planPath =
    now?.planPath ||
    handoff?.planPath ||
    (handoff?.plan ? `.cursor/plans/${handoff.plan}` : '');
  const modeLabel = now?.mode || handoff?.mode || null;
  const updatedSource = now?.modifiedAt || handoff?.lastUpdated || null;

  const statusClass = `now-status now-status-${meta.key}${meta.live ? ' now-status-live' : ''}`;

  // True idle: no HANDOFF plan reference (or non-mission status). Reserve empty IDLE for that case.
  if (!showMission) {
    stopNowTimingTick();
    return `
      <div class="card${nowChanged ? ' card-flash' : ''}" id="now-execution-panel">
        <div class="card-header now-panel-header">
          <span class="card-title">${spaceIconSvg('current-mission')}Current mission</span>
          <span class="${statusClass}" aria-label="Status: ${escapeAttr(meta.label)}">
            <span class="now-status-mark" aria-hidden="true">${meta.mark}</span>
            ${escapeHtml(meta.label)}
          </span>
        </div>
        <div class="panel-scroll-body">
          ${renderEmptyStateCta({
            headline: 'Quiet cockpit',
            iconKind: 'current-mission',
            support: 'No active plan. Start one when you are ready.',
            compact: true,
            cta: {
              text: '/start-project',
              subject: '/start-project',
              destination: 'chatInput',
              label: 'Copy /start-project',
              focusKey: 'cta-start-project',
            },
          })}
        </div>
      </div>
    `;
  }

  // Schedule text-only elapsed tick after this HTML is inserted (see renderUnsafe).
  queueMicrotask(() => syncNowTimingTick(now));

  return `
    <div class="card${nowChanged ? ' card-flash' : ''}" id="now-execution-panel">
      <div class="card-header now-panel-header">
        <span class="card-title">${spaceIconSvg('current-mission')}Current mission</span>
        <span class="${statusClass}" aria-label="Status: ${escapeAttr(meta.label)}">
          <span class="now-status-mark" aria-hidden="true">${meta.mark}</span>
          ${escapeHtml(meta.label)}
        </span>
      </div>
      <div class="panel-scroll-body">
        <div class="now-plan-name">${escapeHtml(planName)}</div>
        ${renderNowStepBar(now)}
        ${renderNowStepper(now, handoff, status, meta)}
        ${renderNowMeta(modeLabel, updatedSource, now)}
        ${renderNowModeHint(modeLabel)}
        <div class="now-actions">
          <button class="status-bar-btn" data-focus-key="cta-copy-plan-path" onclick="${escapeAttr(`copyPlanPath('${escapeJsString(planPath)}')`)}" style="font-size:11px;padding:4px 14px" title="${escapeAttr(pathActionTitle(planPath))}">Copy plan path</button>
          ${
            isManualPlanMode(modeLabel)
              ? `<button class="status-bar-btn" data-focus-key="cta-copy-continue-plan" onclick="${escapeAttr(`copyContinuePlanCommand('${escapeJsString(planName)}')`)}" style="font-size:11px;padding:4px 14px" title="${escapeAttr(copyActionTitle(continuePlanPasteText(planName), 'chatInput'))}">Copy /continue-plan</button>`
              : ''
          }
          <button class="status-bar-btn" data-focus-key="cta-copy-staging" onclick="copyGitStagingCommand()" style="font-size:11px;padding:4px 14px" title="${escapeAttr(copyActionTitle('/git-staging', 'chatInput'))}">Copy /git-staging</button>
        </div>
      </div>
    </div>
  `;
}

// ===== Render =====
function render() {
  if (!data) return;
  try {
    renderUnsafe();
  } catch (err) {
    console.error('Dashboard render failed', err);
    dataLoading = false;
    const contentEl = document.getElementById('content');
    if (contentEl) {
      const errMsg = err && err.message ? err.message : String(err);
      const errStack = err && err.stack ? err.stack : '';
      contentEl.innerHTML = `
        <div class="empty-state" style="padding:60px 20px">
          <div style="font-size:16px;font-weight:600;color:var(--red)">Render Failed</div>
          <div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">${escapeHtml(errMsg)}</div>
          <button class="error-retry-btn" onclick="refresh()">
            <span>\u21bb</span> Retry
          </button>
          ${errStack ? `
            <div style="margin-top:12px">
              <button class="error-stack-toggle" onclick="(function(el){
                var detail = el.nextElementSibling;
                if(detail) detail.classList.toggle('open');
              })(this)">Show stack trace \u25bc</button>
              <div class="error-stack-detail">${escapeHtml(errStack)}</div>
            </div>
          ` : ''}
        </div>
      `;
    }
    resetRefreshBtn();
  }
}

function renderUnsafe() {
  const d = data;

  // Diffing (compare with prevData)
  if (prevData) {
    diffProcesses(prevData.processes, d.processes);
    diffTerminals(prevData.terminals, d.terminals);
  }
  if (prevData) {
    // Health status change
    if (prevData.health && d.health && prevData.health.status !== d.health.status) {
      addActivity(`Health status changed: ${prevData.health.status} \u2192 ${d.health.status}`, 'warning', {
        id: `diag:health:${diagnosticIdPart(prevData.health.status)}->${diagnosticIdPart(d.health.status)}`,
        kind: 'health',
        source: 'health',
      });
    }
    // Git dirty status change
    if (prevData.git && d.git) {
      if (!prevData.git.dirty && d.git.dirty) {
        addActivity(`Git: ${d.git.dirtyCount} file${d.git.dirtyCount !== 1 ? 's' : ''} modified`, 'git', {
          id: 'diag:git_dirty:dirty',
          kind: 'git_dirty',
          source: 'git',
          replacePrefix: 'diag:git_dirty:',
        });
      } else if (prevData.git.dirty && !d.git.dirty) {
        addActivity('Git: working tree clean', 'git', {
          id: 'diag:git_dirty:clean',
          kind: 'git_dirty',
          source: 'git',
          replacePrefix: 'diag:git_dirty:',
        });
      }
    }
  }
  const handoffChanged = prevData && JSON.stringify(d.system?.handoff) !== JSON.stringify(prevData.system?.handoff);
  const nowChanged = prevData && nowFingerprint(d.missionControl?.now) !== nowFingerprint(prevData.now);
  const attentionChanged =
    prevData &&
    flightLogFingerprint(d.missionControl?.flightLog) !==
      flightLogFingerprint(prevData.flightLog);
  prevData = snapshotPrevData(d);

  dataLoading = false;

  const contentEl = document.getElementById('content');
  const uiState = captureUiState();

  // Update SSE timer
  updateSSETimer();

  // Meta (hidden chrome; kept for tooling / future use)
  const versionEl = document.getElementById('version');
  if (versionEl) versionEl.textContent = `v${d.system?.version || '\u2014'}`;
  const dataVersionEl = document.getElementById('dataVersion');
  if (dataVersionEl) dataVersionEl.textContent = `schema ${d.dashboardDataVersion || '\u2014'}`;
  const lastUpdatedEl = document.getElementById('lastUpdated');
  if (lastUpdatedEl) lastUpdatedEl.textContent = `Updated ${fmtTime(d.generatedAt)}`;

  const workspaceEl = document.getElementById('headerWorkspace');
  if (workspaceEl) {
    const root = typeof d.system?.repoRoot === 'string' ? d.system.repoRoot.trim() : '';
    const base = root ? root.replace(/\\/g, '/').replace(/\/$/, '').split('/').pop() : '';
    const port = d.system?.port;
    if (base) {
      workspaceEl.hidden = false;
      workspaceEl.textContent = base;
      workspaceEl.title = port ? `${root} · :${port}` : root;
      document.title = `Mission Control · ${base}`;
    } else {
      workspaceEl.hidden = true;
      workspaceEl.textContent = '';
      workspaceEl.removeAttribute('title');
      document.title = 'Mission Control';
    }
  }

  const health = d.health;
  updateTransportChrome();

  // Nav badges (counts only; no decorative pulse)
  const navOverviewBadge = document.getElementById('navOverviewBadge');
  navOverviewBadge.textContent = d.plans.length;
  navOverviewBadge.className = 'top-tab-badge';
  const navPlansBadge = document.getElementById('navPlansBadge');
  navPlansBadge.textContent = d.plans.length;
  navPlansBadge.className = 'top-tab-badge';
  const navAgentsBadge = document.getElementById('navAgentsBadge');
  navAgentsBadge.textContent = d.agents.length;
  navAgentsBadge.className = 'top-tab-badge';
  const navSkillsBadge = document.getElementById('navSkillsBadge');
  navSkillsBadge.textContent = d.skills.length;
  navSkillsBadge.className = 'top-tab-badge';
  const navCommandsBadge = document.getElementById('navCommandsBadge');
  navCommandsBadge.textContent = d.commands.length;
  navCommandsBadge.className = 'top-tab-badge';
  const navTerminalsBadge = document.getElementById('navTerminalsBadge');
  navTerminalsBadge.textContent = d.terminals.length;
  navTerminalsBadge.className = 'top-tab-badge';
  const navProcessesBadge = document.getElementById('navProcessesBadge');
  navProcessesBadge.textContent = d.processes.length;
  navProcessesBadge.className = 'top-tab-badge';

  // Nav health dot
  const healthDot = document.getElementById('navHealthDot');
  healthDot.className = `dot dot-${health.status === 'ok' ? 'green' : health.status === 'warning' ? 'yellow' : 'red'}`;

  // Git nav dot
  const gitDot = document.getElementById('navGitDot');
  if (d.git?.dirty) {
    gitDot.className = 'dot dot-yellow';
  } else if (d.git?.branch) {
    gitDot.className = 'dot dot-green';
  }

  // Terminals / processes: steady state color only
  const termDot = document.getElementById('navTerminalsDot');
  termDot.className = `dot dot-${d.terminals.length > 0 ? 'blue' : 'gray'}`;

  const procDot = document.getElementById('navProcessesDot');
  if (procDot) {
    procDot.className = `dot dot-${d.processes.length > 0 ? 'green' : 'gray'}`;
  }

  // Build full HTML string once
  const parts = [];

  // ===== Overview (narrow plugin shell: now stack first) =====
  // Primary history = semantic sequence (run-plan ticks, merges, staging, plan progress).
  // Raw terminal/process churn stays in the Activity diagnostic tab.
  const semanticEvents = semanticFeedEvents(d);
  const feedEvents = semanticEvents.filter((ev) => MONITOR_ACTIVITY_KINDS.has(ev?.kind)).slice(0, monitorFeedCap(d));
  const unifiedEvents = unifiedActivityEvents(semanticEvents);
  const filteredActivityEvents = filterUnifiedActivityEvents(unifiedEvents, activitySourceFilter);
  const activityFilterId = activityFilterDef(activitySourceFilter).id;
  const activityCountLabel = activityFilterId === 'all'
    ? `${unifiedEvents.length} events`
    : `${filteredActivityEvents.length} of ${unifiedEvents.length} events`;

  const navActivityBadge = document.getElementById('navActivityBadge');
  navActivityBadge.textContent = unifiedEvents.length;
  navActivityBadge.className = 'top-tab-badge';
  parts.push(`
    <div class="content-section active" id="section-overview">
      <div class="overview-stack">
        ${renderNowExecutionPanel(d, !!(nowChanged || handoffChanged))}

        <div class="section-hero" id="hero-activity">
          <div class="live-activity-header">
            <span class="card-title">${spaceIconSvg('monitor')}Crew Monitor</span>
            <span class="section-subtitle" style="margin-left:auto">${feedEvents.length} shown</span>
          </div>
          <div class="live-activity-feed">
            ${feedEvents.length === 0
              ? renderEmptyStateCta({
                  headline: 'Listening',
                  iconKind: 'monitor',
                  support:
                    'No agent activity yet. Events appear as agents run plans and ship deliveries.',
                  compact: true,
                  className: 'activity-feed-empty',
                })
              : feedEvents.map((ev, idx) => {
                  const info = semanticEventInfo(ev.kind, ev.refs?.commitType);
                  const gloss = info.gloss || info.tag || ev.kind || 'event';
                  const staggerIdx = Math.min(idx, 5);
                  const actionAttrs = activityTargetAttributes(ev, 'monitor-activity', { kindGloss: gloss });
                  const rowA11y = actionAttrs
                    ? actionAttrs
                    : ` aria-label="${escapeAttr(`${gloss}: ${ev.label || ''}`)}"`;
                  return `
                    <div class="monitor-row stagger-fade stagger-${staggerIdx}"${rowA11y}>
                      <span class="monitor-row-chip" style="background:${info.bg};color:${info.color}" title="${escapeAttr(gloss)}" aria-hidden="true"><span class="monitor-row-icon">${info.icon}</span></span>
                      <span class="feed-label">${escapeHtml(ev.label)}</span>
                      <span class="feed-time">${semanticEventTime(ev, info)}</span>
                    </div>`;
                }).join('')}
          </div>
        </div>

        ${renderAttentionPanel(d, !!attentionChanged)}

        ${renderRecentPlanCards(d)}
      </div>
    </div>
  `);

  // ===== Plans (accordion portfolio) =====
  parts.push(`
    <div class="content-section" id="section-plans">
      <div class="section-title">
        <span class="dot dot-green"></span> Plans
        <span class="section-subtitle">${d.plans.length} total</span>
      </div>
      ${renderPlansAccordion(d)}
    </div>
  `);

  // ===== Agents =====
  parts.push(`
    <div class="content-section" id="section-agents">
      <div class="section-title">
        <span class="dot dot-purple"></span> Agents
        <span class="section-subtitle">${d.agents.length} available</span>
      </div>
      ${d.agents.length === 0
        ? renderEmptyStateCta({
            headline: 'No agents aboard',
            supportHtml: 'Add <code>.md</code> files under <code>.cursor/agents/</code>.',
            cta: {
              text: '.cursor/agents/',
              subject: 'path .cursor/agents/',
              destination: 'filePicker',
              label: 'Copy .cursor/agents/ path',
              focusKey: 'cta-agents-path',
            },
          })
        : ''}
      <div class="agent-list">
        ${d.agents.map(a => {
          const colors = ['#3b82f6','#a855f7','#22c55e','#eab308','#ef4444','#06b6d4','#f97316','#ec4899'];
          const c = colors[a.id.length % colors.length];
          const agentId = a.id.replace(/[^a-zA-Z0-9_-]/g, '_');
          return `
            <div class="agent-item" role="button" tabindex="0" aria-label="Toggle details for ${escapeAttr(a.id)}" onclick="toggleAgentDetails('${escapeJsString(agentId)}')">
              <span class="agent-icon" style="background:${c}20;color:${c}">${escapeHtml(a.id.slice(0, 2).toUpperCase())}</span>
              <span style="flex:1">${escapeHtml(a.id)}</span>
              <span style="font-size:11px;color:var(--text-muted)">${escapeHtml(a.description || '')}</span>
              <span style="font-size:10px;color:var(--text-muted);transition:transform 0.2s" id="agent-arrow-${escapeAttr(agentId)}">\u25bc</span>
            </div>
            <div class="agent-details" id="agent-details-${escapeAttr(agentId)}">
              <p>${escapeHtml(a.description || 'No description available.')}</p>
              <div class="agent-path">${escapeHtml(a.path || 'Path not available')}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `);

  // ===== Commands =====
  parts.push(`
    <div class="content-section" id="section-commands">
      <div class="section-title">
        <span class="dot" style="background:var(--cyan)"></span> Commands
        <span class="section-subtitle">${d.commands.length} slash commands</span>
      </div>
      ${d.commands.length === 0
        ? renderEmptyStateCta({
            headline: 'No slash commands',
            supportHtml:
              'L0 setup required: commands live in <code>.cursor/commands/</code>.',
            cta: {
              text: '.cursor/commands/',
              subject: 'path .cursor/commands/',
              destination: 'filePicker',
              label: 'Copy .cursor/commands/ path',
              focusKey: 'cta-commands-path',
            },
          })
        : ''}
      <div class="command-grid">
        ${d.commands.map(c => {
          const slash = `/${c.id}`;
          return `
          <div class="command-item" role="button" tabindex="0" aria-label="Copy ${escapeAttr(slash)}" onclick="${copyForPasteHandler(slash, slash, 'chatInput')}" title="${escapeAttr(copyActionTitle(slash, 'chatInput'))}">
            <span class="dot" style="background:var(--cyan);width:6px;height:6px"></span>

  `);

  // ===== Health =====
  const checks = health.checks || [];
  parts.push(`
    <div class="content-section" id="section-health">
      <div class="section-title">
        <span class="dot dot-${health.status === 'ok' ? 'green' : health.status === 'warning' ? 'yellow' : 'red'}"></span>
        Health
        <span class="section-subtitle">${checks.filter(c => c.ok).length}/${checks.length} checks passing</span>
      </div>
      ${checks.length === 0
        ? renderEmptyStateCta({
            headline: 'Health offline',
            support: 'No health data available.',
          })
        : ''}
      <div class="health-grid">
        ${checks.map(c => `
          <div style="position:relative">
            <div class="health-item" role="button" tabindex="0" aria-label="Show info for ${escapeAttr(c.label)}" onclick="showHealthInfo(this, ${c.ok})">
              <span class="dot dot-${c.ok ? 'green' : 'red'}"></span>
              <span>${escapeHtml(c.label)}</span>
            </div>

    </div>
  `);

  // ===== Git =====
  parts.push(`
    <div class="content-section" id="section-git">
      <div class="section-title">
        <span class="dot dot-${d.git?.dirty ? 'yellow' : 'green'}"></span>
        Git
        <span class="section-subtitle">${escapeHtml(d.git?.branch || '\u2014')}</span>
      </div>
      ${!d.git?.branch
        ? renderEmptyStateCta({

        <div class="git-info">

            <span class="git-label">Branch</span>

  // ===== Memory =====
  const recentDecisions = d.memory?.recentDecisions || [];
  parts.push(`
    <div class="content-section" id="section-memory">

        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">Decisions</span>

      </div>
      ${recentDecisions.length > 0 ? `
        <div class="card" style="margin-top:16px">

            <span class="card-title">Recent Decisions</span>

          <div class="memory-list">
            ${recentDecisions.map(dd => {
              const memPath = dd.path || `.cursor/memory/decisions/${dd.id || dd}.md`;
              const memId = dd.id || dd;
              return `
              <div class="memory-item" role="button" tabindex="0" aria-label="Copy path for ${escapeAttr(memId)}" onclick="${copyRepoPathHandler(memPath)}" title="${escapeAttr(pathActionTitle(memPath))}">

  // ===== Terminals =====
  terminalOutputStore.clear();
  parts.push(`
    <div class="content-section" id="section-terminals">
      <div class="section-title">
        <span class="dot dot-${d.terminals.length > 0 ? 'blue dot-pulse' : 'gray'}"></span>
        Terminals
        <span class="section-subtitle">${d.terminals.length} active</span>
      </div>
      ${d.terminals.length === 0
        ? renderEmptyStateCta({
            headline: 'No open sessions',
            support: 'No active terminal sessions.',
          })
        : ''}
      <div class="terminal-list">
        ${d.terminals.map(t => {
          const exitOk = t.lastExitCode === '0' || !t.lastExitCode;
          const cwd = t.cwd || t.id;
          const outputPreview = t.lastOutput || '';
          if (outputPreview) {
            terminalOutputStore.set(t.id, {
              content: outputPreview,
              title: `Terminal: ${t.id}`,

          }
          return `
            <div class="terminal-item" role="button" tabindex="0" aria-label="Copy the working directory for terminal ${escapeAttr(t.id)}" onclick="${copyForPasteHandler(cwd, 'terminal working directory', 'terminal')}" title="${escapeAttr(copyActionTitle('terminal working directory', 'terminal'))}">
              <div class="terminal-item-row">
                <span class="dot dot-${exitOk ? 'green' : 'red'} ${t.lastCommand ? 'dot-pulse' : ''}"></span>
                <span style="flex:1">
                  <span style="color:var(--text-primary)">${escapeHtml(t.id)}</span>
                  ${t.lastCommand ? `\u2014 <span style="color:var(--text-muted)">${escapeHtml(t.lastCommand)}</span>` : ''}
                </span>
                <span style="color:var(--text-muted)">${t.outputLines} lines</span>
                ${t.pid ? `<span style="color:var(--text-muted)">PID ${escapeHtml(t.pid)}</span>` : ''}
                ${outputPreview ? `<button type="button" class="terminal-expand-btn" data-terminal-id="${escapeAttr(t.id)}" aria-label="Expand the captured output for terminal ${escapeAttr(t.id)}" title="Expand the captured output for terminal ${escapeAttr(t.id)}">(expand)</button>` : ''}
              </div>
              ${outputPreview ? `<div class="terminal-preview">${escapeHtml(outputPreview)}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `);

  // ===== Processes =====
  const processes = d.processes || [];
  parts.push(`
    <div class="content-section" id="section-processes">
      <div class="section-title">
        <span class="dot dot-${processes.length > 0 ? 'green' : 'gray'}"></span>
        Processes
        <span class="section-subtitle">${processes.length} running</span>
      </div>
      ${processes.length === 0
        ? renderEmptyStateCta({
            headline: 'All quiet',
            support: 'No relevant processes running.',
          })
        : `
        <div class="card" style="overflow-x:auto">
          <table class="processes-table">
            <thead>
              <tr>
                <th>Process</th>
                <th>PID</th>
                <th>CPU%</th>
                <th>MEM%</th>
                <th>Command</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${processes.map(p => {
                const dotClass = p.label === 'dashboard-server' ? 'dot-green dot-pulse'
                  : p.label === 'node' ? 'dot-blue'
                  : p.label === 'git' ? 'dot-yellow'
                  : 'dot-gray';
                const pidStr = String(p.pid ?? '');
                return `
                  <tr>
                    <td>
                      <span class="process-label">
                        <span class="dot ${dotClass}"></span>
                        <span>${escapeHtml(p.label || 'other')}</span>
                      </span>
                    </td>
                    <td style="color:var(--text-muted)">${escapeHtml(pidStr)}</td>
                    <td>${escapeHtml(p.cpu || '\u2014')}</td>
                    <td>${escapeHtml(p.mem || '\u2014')}</td>
                    <td style="color:var(--text-muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeAttr(p.command || '\u2014')}">${escapeHtml(p.command || '\u2014')}</td>
                    <td class="process-actions">
                      <button type="button" class="process-copy-btn" onclick="event.stopPropagation();${copyForPasteHandler(pidStr, `PID ${pidStr}`, 'terminal')}" title="${escapeAttr(copyActionTitle(`PID ${pidStr}`, 'terminal'))}">Copy PID</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `);

  // ===== Skills =====
  const skills = d.skills || [];
  const categories = {};
  skills.forEach(s => {
    const cat = s.category || 'other';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(s);
  });
  const catColors = ['#a855f7','#3b82f6','#22c55e','#eab308','#f97316','#06b6d4','#ec4899','#ef4444'];
  let catIdx = 0;
  parts.push(`
    <div class="content-section" id="section-skills">
      <div class="section-title">
        <span class="dot dot-orange" style="background:var(--orange)"></span> Skills
        <span class="section-subtitle">${skills.length} discovered</span>
      </div>
      ${skills.length === 0
        ? renderEmptyStateCta({
            headline: 'No skills found',
            supportHtml:
              'Skills appear when discovered under <code>.cursor/skills/</code>.',
            cta: {
              text: '.cursor/skills/',
              subject: 'path .cursor/skills/',
              destination: 'filePicker',
              label: 'Copy .cursor/skills/ path',
              focusKey: 'cta-skills-path',
            },
          })
        : Object.entries(categories).map(([cat, items]) => {
        const catColor = catColors[catIdx++ % catColors.length];
        return `
          <div class="skills-category">
            <div class="skills-category-title">${escapeHtml(cat)}</div>
            <div class="skills-tags">
              ${items.map(s => `
                <div class="skill-tag" title="${escapeAttr(s.description || '')}">
                  <span class="skill-cat-dot" style="background:${catColor}"></span>
                  <span class="skill-title">${escapeHtml(s.title)}</span>
                  ${s.description ? `<span class="skill-desc">\u2014 ${escapeHtml(s.description)}</span>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `);

  // ===== Activity =====
  const activityEmpty = unifiedEvents.length === 0
    ? {
        headline: 'Quiet timeline',
        support: 'No meaningful activity recorded yet.',
      }
    : {
        headline: 'Nothing in this filter',
        support: 'No activity for this source.',
      };
  const activityBody = filteredActivityEvents.length === 0
    ? renderEmptyStateCta(activityEmpty)
    : `
        <div class="card">
          <div class="activity-list" role="list" aria-label="Unified activity feed">
            ${filteredActivityEvents.map((ev, idx) => {
              const info = activityEventInfo(ev);
              const stgIdx = Math.min(idx, 5);
              const actionAttrs = activityTargetAttributes(ev, 'unified-activity');
              return `
              <div role="listitem">
                <div class="activity-item stagger-fade stagger-${stgIdx}"${actionAttrs}>
                  <span class="activity-icon" style="background:${info.bg};color:${info.color}" aria-hidden="true">${info.icon}</span>
                  <span class="activity-time">${escapeHtml(unifiedEventTime(ev))}</span>
                  <span class="activity-source">${escapeHtml(ev.source)}</span>
                  <span class="activity-label">${escapeHtml(ev.label)}</span>
                </div>
              </div>
            `;
            }).join('')}
          </div>
        </div>
      `;
  parts.push(`
    <div class="content-section" id="section-activity">
      <div class="section-title">
        <span class="dot" style="background:var(--cyan)"></span> Activity
        <span class="section-subtitle">${escapeHtml(activityCountLabel)} · Last refreshed ${escapeHtml(relativeTime(d.generatedAt))}</span>
      </div>
      ${renderActivityFilterChips()}
      ${activityBody}
    </div>
  `);

  parts.push(renderConfigSection(d));

  // Single innerHTML assignment — no layout thrashing
  contentEl.innerHTML = parts.join('');

  wireTerminalExpandButtons();

  updateTransportChrome();

  // Restore the section the user had selected (Cockpit/overview on first paint)
  showSection(activeSectionId || 'overview');

  // Keep expanded agent rows / focus / scroll across SSE snapshot refreshes
  restoreUiState(uiState);
  applyPlanAccordionState();
}

// ===== Auto-refresh (paused while SSE is healthy) =====
function syncPollingWithSseMode() {
  if (sseMode === 'live' && !sseReconnecting && !sseSilentFallback) {
    stopAutoRefresh();
  } else {
    startAutoRefresh();
  }
}

function clearSseSilentFallback() {
  if (!sseSilentFallback) return;
  sseSilentFallback = false;
  syncPollingWithSseMode();
}

/** Open-but-silent SSE: resume poll without tearing down EventSource. */
function checkSseSilence() {
  if (sseMode !== 'live' || !sseSource) return;
  if (Date.now() - lastSseDataTime <= SSE_SILENCE_MS) {
    clearSseSilentFallback();
    return;
  }
  if (!sseSilentFallback) {
    sseSilentFallback = true;
    syncPollingWithSseMode();
    updateTransportChrome();
  }
}

// ===== Broadcast auth (opt-in LAN; loopback needs no token) =====
const MC_TOKEN_STORAGE_KEY = 'agent-kit:mc-broadcast-token';

function missionControlAuthToken() {
  try {
    const u = new URL(location.href);
    const q = u.searchParams.get('token');
    if (q) {
      try {
        sessionStorage.setItem(MC_TOKEN_STORAGE_KEY, q);
      } catch (e) { /* private mode */ }
      u.searchParams.delete('token');
      const next = u.pathname + u.search + u.hash;
      if (typeof history !== 'undefined' && history.replaceState) {
        history.replaceState({}, '', next);
      }
      return q;
    }
    return sessionStorage.getItem(MC_TOKEN_STORAGE_KEY) || '';
  } catch (e) {
    return '';
  }
}

function withMissionControlAuth(url) {
  const t = missionControlAuthToken();
  if (!t) return url;
  const sep = url.indexOf('?') >= 0 ? '&' : '?';
  return url + sep + 'token=' + encodeURIComponent(t);
}

// Warm token from query on first paint (sets cookie via server + sessionStorage).
missionControlAuthToken();

// ===== SSE =====
function connectSSE() {
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  try {
    sseSource = new EventSource(withMissionControlAuth('/api/events'));
    sseSource.onopen = () => {
      sseFailedAttempts = 0;
      sseMode = 'live';
      sseReconnecting = false;
      lastEventTime = Date.now();
      // Do not reset lastSseDataTime here: reconnect storms would keep the
      // silence watchdog from ever resuming poll. Only onmessage counts.
      startSSETimer();
      syncPollingWithSseMode();
      updateTransportChrome();
      if (data) render();
    };

    // Debounced SSE handler avoids rapid re-renders.
    // Do NOT set dataLoading here: that wiped the pane and skipped render forever.
    const debouncedRender = debounce(() => {
      render();
    }, 150);

    sseSource.onmessage = (event) => {
      try {
        const newData = JSON.parse(event.data);
        // Only count validated payloads. Broken multi-line SSE used to deliver
        // `{` fragments that reset silence and permanently suppressed poll.
        if (newData && typeof newData === 'object' && Array.isArray(newData.plans)) {
          lastEventTime = Date.now();
          lastSseDataTime = Date.now();
          clearSseSilentFallback();
          data = newData;
          debouncedRender();
        }
      } catch (e) {
        // ignore parse errors
      }
    };
    sseSource.onerror = () => {
      sseFailedAttempts++;
      if (sseFailedAttempts >= 3) {
        sseReconnecting = true;
        syncPollingWithSseMode();
        if (data) render();
        // Give it a few more attempts before falling back to polling
        setTimeout(() => {
          if (sseFailedAttempts >= 6) {
            if (sseSource) { sseSource.close(); sseSource = null; }
            sseMode = 'polling';
            sseReconnecting = false;
            sseSilentFallback = false;
            stopSSETimer();
            syncPollingWithSseMode();
            if (data) render();
          }
        }, 10000);
      }
    };
  } catch (e) {
    sseMode = 'polling';
    sseSilentFallback = false;
    syncPollingWithSseMode();
  }
}

// ===== Fetch =====
async function fetchData({ force = false } = {}) {
  // When SSE is healthy, skip poll fetches unless forced (Refresh button)
  // or silence fallback has re-enabled polling beside the open stream.
  if (!force && sseMode === 'live' && !sseReconnecting && !sseSilentFallback && data) return;

  const btn = document.getElementById('refreshBtn');
  if (btn) {
    btn.disabled = true;
    btn.classList.add('is-refreshing');
    btn.setAttribute('aria-label', 'Refreshing');
    btn.title = 'Refreshing';
  }

  // Only wipe the pane on the first load; background refresh keeps the last good render.
  if (!data) {
    dataLoading = true;
  }

  // Try multiple URLs — works when served by dashboard/serve.mjs or a static server
  const urls = [
    withMissionControlAuth('/dashboard-data.json?_=' + Date.now()),
    withMissionControlAuth('/api/data?_=' + Date.now()),
    withMissionControlAuth('dashboard-data.json?_=' + Date.now()),
  ];

  for (const url of urls) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) continue;
      const next = await resp.json();
      // Validate it looks like our data
      if (next && typeof next === 'object' && Array.isArray(next.plans)) {
        data = next;
        lastEventTime = Date.now();
        if (sseMode !== 'live') {
          updateSSETimer();
        }
        render();
        resetRefreshBtn();
        return;
      }
    } catch {
      // try next url
    }
  }

  // Fallback: show instructions only when we have no data yet
  resetRefreshBtn();
  if (btn && !data) {
    btn.setAttribute('aria-label', 'Start server');
    btn.title = 'Start server';
  }
  dataLoading = false;
  if (data) return;
  document.getElementById('loading').innerHTML = `
    <div class="empty-state">
      ${renderEmptyStateCta({
        headline: 'Dashboard Server',
        supportHtml:
          'Start the data server for live data. Or generate static data once with <code>node dashboard/dashboard-data.mjs &gt; dashboard/dashboard-data.json</code>.',
        cta: {
          text: 'node dashboard/serve.mjs',
          subject: 'dashboard serve command',
          destination: 'terminal',
          label: 'Copy serve command',
          focusKey: 'cta-dashboard-serve',
        },
      })}
    </div>
  `;
}

// ===== Auto-refresh =====
function refresh() {
  fetchData({ force: true });
}
function startAutoRefresh() {
  stopAutoRefresh();
  timer = setInterval(() => fetchData(), refreshInterval);
}
function stopAutoRefresh() {
  if (timer) { clearInterval(timer); timer = null; }
}

// ===== Init =====
fetchData();
connectSSE();
syncPollingWithSseMode();
startStatusBarTimer();
</script>
