    showToast(`Copy failed - select manually: ${text}`, true);
  }
}

// ===== Show toast notification (Phase 1/3) =====
let toastTimeout = null;
function showToast(message, isError) {
  let toast = document.querySelector('.copied-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'copied-toast';
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    toast.setAttribute('aria-atomic', 'true');
    document.body.appendChild(toast);
  }
  toast.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  toast.style.color = isError ? 'var(--red)' : 'var(--green)';
  toast.innerHTML = (isError ? '<span>\u2715</span> ' : '<span>\u2713</span> ') + escapeHtml(message);
  // Remove any previous animation class to restart
  toast.classList.remove('visible', 'animating');
  void toast.offsetWidth;
  toast.classList.add('animating');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('animating');
  }, 2000);
}

// ===== Toggle agent details (Phase 1) =====
function toggleAgentDetails(id) {
  const el = document.getElementById('agent-details-' + id);
  if (!el) return;
  el.classList.toggle('open');
  const arrow = document.getElementById('agent-arrow-' + id);
  if (arrow) {
    arrow.style.transform = el.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
  }
}

// ===== Health check info (Phase 1) =====
function showHealthInfo(el, ok) {
  // Remove any existing message siblings
  const parent = el.parentElement;
  const existing = parent.querySelector('.health-message');
  if (existing) { existing.remove(); return; }
  const msg = document.createElement('div');
  msg.className = 'health-message';
  msg.textContent = ok
    ? 'All good \u2014 no action needed.'
    : 'Check may indicate an issue. Review the relevant logs or configuration.';
  parent.appendChild(msg);
}

// ===== Get connection uptime (Phase 2) =====
function getConnectionUptime() {
  if (sseMode !== 'live') return '';
  const secs = Math.round((Date.now() - lastEventTime) / 1000);
  if (secs < 5) return 'just connected';
  if (secs < 60) return `Live for ${secs}s`;
  const mins = Math.floor(secs / 60);
  const remainSecs = secs % 60;
  if (mins < 60) return `Live for ${mins}m ${remainSecs}s`;
  const hrs = Math.floor(mins / 60);
  return `Live for ${hrs}h ${mins % 60}m`;
}

// ===== Show terminal popup (Phase 2) =====
function showTerminalPopup(content, title) {
  const overlay = document.createElement('div');
  overlay.className = 'terminal-popup-overlay';

  const popup = document.createElement('div');
  popup.className = 'terminal-popup';

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'terminal-popup-close';
  closeBtn.textContent = '\u2715';
  closeBtn.addEventListener('click', () => overlay.remove());

  const titleEl = document.createElement('div');
  titleEl.style.fontWeight = '600';
  titleEl.style.color = 'var(--text-primary)';
  titleEl.style.marginBottom = '10px';
  titleEl.textContent = title;

  const pre = document.createElement('pre');
  pre.style.margin = '0';
  pre.style.whiteSpace = 'pre-wrap';
  pre.style.wordBreak = 'break-all';
  pre.textContent = content;

  popup.appendChild(closeBtn);
  popup.appendChild(titleEl);
  popup.appendChild(pre);
  overlay.appendChild(popup);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function wireTerminalExpandButtons() {

    btn.addEventListener('click', (e) => {

// ===== Single header transport + freshness signal =====
function updateTransportChrome() {
  const statusDot = document.getElementById('statusDot');
  const statusLabel = document.getElementById('statusLabel');
  const sseTimer = document.getElementById('sseTimer');
  const headerStatus = document.getElementById('headerStatus');
  if (!statusDot || !statusLabel) return;

  const healthStatus = data?.health?.status || 'ok';
  const healthTone = healthStatus === 'ok' ? 'green' : healthStatus === 'warning' ? 'yellow' : 'red';

  if (sseReconnecting) {
    statusDot.className = 'dot dot-yellow dot-pulse reconnecting-pulse';
    statusLabel.textContent = sseFailedAttempts > 0
      ? `Reconnecting (${sseFailedAttempts})`
      : 'Reconnecting…';
  } else if (sseMode === 'live') {
    // Steady dot while healthy; pulse only when health is not ok
    statusDot.className = healthStatus === 'ok'
      ? 'dot dot-green'
      : `dot dot-${healthTone} dot-pulse`;
    statusLabel.textContent = healthStatus === 'ok' ? 'Live' : healthStatus === 'warning' ? 'Warning' : 'Degraded';
  } else {
    statusDot.className = `dot dot-${healthStatus === 'ok' ? 'yellow' : healthTone}`;
    statusLabel.textContent = healthStatus === 'ok' ? 'Polling' : healthStatus === 'warning' ? 'Warning' : 'Degraded';
  }

  if (sseTimer) {
    if (sseMode === 'live') {
      const secs = Math.round((Date.now() - lastEventTime) / 1000);
      sseTimer.textContent = secs < 60 ? `${secs}s ago` : `${Math.floor(secs / 60)}m ago`;
    } else if (sseMode === 'polling') {
      sseTimer.textContent = 'every 5s';
    } else {
      sseTimer.textContent = '';
    }
  }

  if (headerStatus) {
    const secs = Math.round((Date.now() - lastEventTime) / 1000);
    const freshness = Number.isFinite(secs)
      ? (secs < 60 ? `${secs}s since last event` : `${Math.floor(secs / 60)}m since last event`)
      : 'awaiting first event';
    headerStatus.title = `${statusLabel.textContent} · ${freshness}`;
  }
}

function startStatusBarTimer() {
  stopStatusBarTimer();
  updateTransportChrome();
  statusBarInterval = setInterval(updateTransportChrome, 2000);
}
function stopStatusBarTimer() {
  if (statusBarInterval) { clearInterval(statusBarInterval); statusBarInterval = null; }
}

function startSSETimer() {

}
function stopSSETimer() {

}

// ===== Diffing helpers =====
function diffProcesses(prev, curr) {
  if (!prev || !curr) return;
  const prevPids = new Set(prev.map(p => p.pid));
  const currPids = new Set(curr.map(p => p.pid));
  for (const p of curr) {
    if (!prevPids.has(p.pid)) {
      addActivity(`Process started: ${p.label} (PID ${p.pid})`, 'started');
    }
  }
  for (const p of prev) {
    if (!currPids.has(p.pid)) {
      addActivity(`Process stopped: ${p.label} (PID ${p.pid})`, 'stopped');
    }
  }
}

function diffTerminals(prev, curr) {
  if (!prev || !curr) return;
  const prevMap = new Map(prev.map(t => [t.id, t]));
  const currMap = new Map(curr.map(t => [t.id, t]));
  for (const t of curr) {
    const prevT = prevMap.get(t.id);
    if (!prevT) {
      addActivity(`Terminal added: ${t.id}`, 'started');
    } else if (t.outputLines > prevT.outputLines) {
      addActivity(`Terminal activity: ${t.id} (${prevT.outputLines} -> ${t.outputLines} lines)`, 'info');
    }
  }
  for (const t of prev) {
    if (!currMap.has(t.id)) {
      addActivity(`Terminal removed: ${t.id}`, 'stopped');
    }
  }
}

function computeSectionHash(d) {

}

function snapshotPrevData(d) {

function captureUiState() {
  const contentEl = document.getElementById('content');
  const active = document.activeElement;
  let focusKey = null;
  if (active && contentEl && contentEl.contains(active)) {
    if (active.id) focusKey = { type: 'id', value: active.id };
    else if (active.getAttribute('data-focus-key')) {
      focusKey = { type: 'focus-key', value: active.getAttribute('data-focus-key') };
    } else if (active.classList.contains('status-bar-btn') || active.classList.contains('empty-state-btn')) {
      focusKey = { type: 'text', value: (active.textContent || '').trim() };
    }
  }
  return {
    scrollTop: contentEl ? contentEl.scrollTop : 0,
    focusKey,
    openAgents: Array.from(document.querySelectorAll('.agent-details.open')).map((el) => el.id),
  };
}

function restoreUiState(state) {
  if (!state) return;
  for (const id of state.openAgents || []) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.classList.add('open');
    const arrowId = id.replace(/^agent-details-/, 'agent-arrow-');
    const arrow = document.getElementById(arrowId);
    if (arrow) arrow.style.transform = 'rotate(180deg)';
  }
  const contentEl = document.getElementById('content');
  if (contentEl) {
    if (pendingAnchorScroll && Date.now() < pendingAnchorScroll.until) {
      // Keep the deadline: repeated ticks must not extend the takeover.
      scrollToCockpitAnchor(pendingAnchorScroll.id, { track: false });
    } else {
      pendingAnchorScroll = null;
      contentEl.scrollTop = state.scrollTop || 0;
    }
  }
  if (!state.focusKey) return;
  let target = null;
  if (state.focusKey.type === 'id') {
    target = document.getElementById(state.focusKey.value);
  } else if (state.focusKey.type === 'focus-key') {
    target = document.querySelector(`[data-focus-key="${CSS.escape(state.focusKey.value)}"]`);
  } else if (state.focusKey.type === 'text') {
    target = Array.from(document.querySelectorAll('button')).find(
      (btn) => (btn.textContent || '').trim() === state.focusKey.value,
    );
  }
  if (target && typeof target.focus === 'function') {
    try {
      target.focus({ preventScroll: true });
    } catch {
      target.focus();
    }
  }
}

function nowStatusMeta(status) {
  if (status === 'executing') {
    return { key: 'executing', label: 'Executing', mark: '\u25B6', live: true };
  }
  if (status === 'awaiting_user') {
    return { key: 'awaiting', label: 'Awaiting user', mark: '\u23F8', live: false };
  }
  return { key: 'idle', label: 'Idle', mark: '\u25CB', live: false };
}

function lifecycleMeta(lifecycle) {
  const map = {
    executing: { key: 'executing', label: 'Executing', mark: '\u25B6', dot: 'dot-blue' },
    awaiting_user: { key: 'awaiting', label: 'Awaiting user', mark: '\u23F8', dot: 'dot-yellow' },
    parked: { key: 'parked', label: 'Parked', mark: '\u23F8', dot: 'dot-purple' },
    incomplete: { key: 'incomplete', label: 'Incomplete', mark: '\u25CF', dot: 'dot-yellow' },
    completed: { key: 'completed', label: 'Completed', mark: '\u2713', dot: 'dot-green' },
  };
  return map[lifecycle] || { key: 'unknown', label: lifecycle || 'Unknown', mark: '\u25CB', dot: 'dot-gray' };
}

function planDomKey(plan) {
  return String(plan?.file || plan?.id || plan?.path || 'plan')
    .replace(/[^a-zA-Z0-9_-]/g, '_');
}

/** Merge snapshot plans with missionControl lifecycle enrichment. */
function mergePlansForUi(d) {
  const classified = d.missionControl?.plans || [];
  const byKey = new Map();
  for (const c of classified) {
    const key = String(c.file || c.path || c.id || '')
      .split('/')
      .pop();
    if (key) byKey.set(key, c);
  }
  return (d.plans || []).map((raw) => {
    const key = String(raw.file || raw.path || raw.id || '')
      .split('/')
      .pop();
    const enriched = byKey.get(key) || {};
    const completed = raw.todos?.completed ?? enriched.progress?.completed ?? 0;
    const total = raw.todos?.total ?? enriched.progress?.total ?? 0;
    let lifecycle = enriched.lifecycle;
    if (!lifecycle) {
      if (total > 0 && completed >= total && (raw.todos?.inProgress || 0) === 0) {
        lifecycle = 'completed';
      } else {
        lifecycle = 'incomplete';
      }
    }
    return {
      id: raw.id,
      file: raw.file,
      path: raw.path || enriched.path || '',
      overview: raw.overview || enriched.overview || '',
      modifiedAt: raw.modifiedAt || enriched.modifiedAt || null,
      progressPct:
        typeof raw.progress === 'number'
          ? raw.progress
          : total > 0
            ? Math.round((completed / total) * 100)
            : 0,
      progressLabel: enriched.progress?.label || `${completed} of ${total}`,
      progressCompleted: completed,
      progressTotal: total,
      lifecycle,
      todos: raw.todos || {
        items: [],
        total: 0,
        completed: 0,
        pending: 0,
        inProgress: 0,
      },
    };
  });
}

/** executing first, attention states next, then most recently modified. */
function sortPlansForPortfolio(plans) {
  return [...plans].sort((a, b) => {
    const ra = LIFECYCLE_SORT_RANK[a.lifecycle] ?? 9;
    const rb = LIFECYCLE_SORT_RANK[b.lifecycle] ?? 9;
    if (ra !== rb) return ra - rb;
    const ta = a.modifiedAt ? new Date(a.modifiedAt).getTime() : 0;
    const tb = b.modifiedAt ? new Date(b.modifiedAt).getTime() : 0;
    return tb - ta;
  });
}

function togglePlanAccordion(planKey, event) {
  if (!planKey) return;
  const exclusive =
    isNarrowPanel() &&
    !planAccordionAllowMulti &&
    !(event && (event.shiftKey || event.metaKey || event.ctrlKey));
  if (openPlanAccordions.has(planKey)) {
    openPlanAccordions.delete(planKey);
  } else {
    if (exclusive) openPlanAccordions.clear();
    openPlanAccordions.add(planKey);
  }
  applyPlanAccordionState();
}

function setPlanAccordionMulti(enabled) {
  planAccordionAllowMulti = !!enabled;
  const toggle = document.getElementById('plan-accordion-multi-toggle');
  if (toggle) {
    toggle.setAttribute('aria-pressed', planAccordionAllowMulti ? 'true' : 'false');
    toggle.textContent = planAccordionAllowMulti
      ? 'Multiple open: on'
      : 'Multiple open: off';
  }
  if (!planAccordionAllowMulti && isNarrowPanel() && openPlanAccordions.size > 1) {
    const keep = [...openPlanAccordions].pop();
    openPlanAccordions.clear();
    if (keep) openPlanAccordions.add(keep);
    applyPlanAccordionState();
  }
}

function applyPlanAccordionState() {
  document.querySelectorAll('.plan-accordion-item').forEach((item) => {
    const key = item.getAttribute('data-plan-key');
    const open = openPlanAccordions.has(key);
    item.classList.toggle('open', open);
    const trigger = item.querySelector('.plan-accordion-trigger');
    if (trigger) trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    const panel = item.querySelector('.plan-accordion-panel');
    if (panel) panel.hidden = !open;
  });
  const toggle = document.getElementById('plan-accordion-multi-toggle');
  if (toggle) {
    toggle.setAttribute('aria-pressed', planAccordionAllowMulti ? 'true' : 'false');
    toggle.textContent = planAccordionAllowMulti
      ? 'Multiple open: on'
      : 'Multiple open: off';
  }
}

/**
 * Pure half of the Checklist notes group: a note whose plan already renders as
 * a card in the same section is dropped, so a parked or incomplete plan is
 * never stated twice. Readiness notes carry no plan and always survive.
 */
function checklistNotesForRender(notes, renderedPlans) {
  const shown = new Set(
    (renderedPlans || [])
      .map((p) => String(p?.file || '').split('/').pop())
      .filter(Boolean),
  );
  return orderAttentionBySeverity(
    (notes || []).filter(
      (note) => !note?.planFile || !shown.has(String(note.planFile).split('/').pop()),
    ),
  );
}

/** Plan-state and readiness rows that moved out of Field Report. */
function renderChecklistNotes(d, renderedPlans) {
  const notes = checklistNotesForRender(
    d.missionControl?.checklistNotes,
    renderedPlans,
  );
  if (notes.length === 0) return '';
  const rows = notes
    .map((item, idx) => renderAttentionItem(item, idx))
    .join('');
  return `
    <div class="attention-group-label">Plan states and readiness needing a decision</div>
    <div class="attention-stack" role="list">${rows}</div>
  `;
}

        onclick="setPlanAccordionMulti(!planAccordionAllowMulti)"

        title="On narrow panels, keep more than one plan accordion expanded">${planAccordionAllowMulti ? 'Multiple open: on' : 'Multiple open: off'}</button>
    </div>
    <div class="plan-accordion-list" role="list">${items}</div>
  `;
}

function formatNowUpdated(modifiedAt) {
  if (!modifiedAt) return '\u2014';
  if (/^\d{4}-\d{2}-\d{2}T/.test(modifiedAt)) return fmtDate(modifiedAt);
  return escapeHtml(modifiedAt);
}

/** Plain display string for tooltips (no HTML entities). */
function formatNowUpdatedPlain(modifiedAt) {
  if (!modifiedAt) return '\u2014';
  if (/^\d{4}-\d{2}-\d{2}T/.test(modifiedAt)) return fmtDate(modifiedAt);
  return String(modifiedAt);
}

/** Inline SVG meta icons (no icon font). Accessible name via aria-label + title. */
function nowMetaIconSvg(kind) {
  if (kind === 'mode') {
    return `<svg class="now-meta-icon" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Mode" title="Mode"><circle cx="8" cy="8" r="2.25"/><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M12.6 3.4l-1.06 1.06M4.46 11.54l-1.06 1.06"/></svg>`;
  }
  // kind === 'updated' (clock)
  return `<svg class="now-meta-icon" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Updated" title="Updated"><circle cx="8" cy="8" r="5.25"/><path d="M8 5.25V8l1.75 1.75"/></svg>`;
}

/**
 * Space-theme Cockpit/nav icon set (inline SVG, no font/fetch/dependency).
 * Same stroke idiom as nowMetaIconSvg: viewBox 0 0 16 16, stroke 1.5, round caps/joins.
 * Static path markup only; never concatenate untrusted text into the SVG.
 * @param {'current-mission'|'monitor'|'field-report'|'checklist'|'more-sections'} kind
 * @param {{ decorative?: boolean }} [opts] decorative true (default): aria-hidden next to a visible label.
 *   decorative false: role=img + aria-label + title for icon-only controls (e.g. more-sections).
 */
function spaceIconSvg(kind, opts) {
  const decorative = !opts || opts.decorative !== false;
  const names = {
    'current-mission': 'Current mission',
    monitor: 'Monitor',
    'field-report': 'Field Report',
    checklist: 'Checklist',
    'more-sections': 'More sections',
  };
  const paths = {
    // Rocket (mission)
    'current-mission':
      '<path d="M8 1.75c1.6 2.1 2.85 4.15 2.85 6.35a2.85 2.85 0 01-5.7 0C5.15 5.9 6.4 3.85 8 1.75z"/>' +
      '<circle cx="8" cy="7.25" r="1"/>' +
      '<path d="M5.6 11.1L4.25 13.5M10.4 11.1L11.75 13.5M6.75 13.75h2.5"/>',
    // Radar sweep (monitor)
    monitor:
      '<circle cx="8" cy="8" r="5.25"/>' +
      '<path d="M8 8l3.6-3.2"/>' +
      '<path d="M8 2.75a5.25 5.25 0 014.35 2.5"/>' +
      '<path d="M8 4.85a3.15 3.15 0 012.7 1.55"/>' +
      '<circle cx="8" cy="8" r="0.85"/>',
    // Antenna + signal arcs (field report)
    'field-report':
      '<path d="M8 13.25V7.5"/>' +
      '<circle cx="8" cy="5.5" r="1.65"/>' +
      '<path d="M4.75 8.75a3.75 3.75 0 016.5 0"/>' +
      '<path d="M3.15 10.6a5.75 5.75 0 019.7 0"/>',
    // Checklist with check (checklist)
    checklist:
      '<path d="M3.25 4.25h9.5M3.25 8h6.25M3.25 11.75h5"/>' +
      '<path d="M10.25 10.35l1.35 1.35 2.4-2.55"/>',
    // Constellation dots (more sections / overflow)
    'more-sections':
      '<circle cx="3.5" cy="8" r="1.1"/>' +
      '<circle cx="8" cy="8" r="1.1"/>' +
      '<circle cx="12.5" cy="8" r="1.1"/>',
  };
  const body = paths[kind];
  const label = names[kind];
  if (!body || !label) return '';
  const a11y = decorative
    ? 'aria-hidden="true"'
    : `role="img" aria-label="${label}" title="${label}"`;
  return `<svg class="space-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${body}</svg>`;
}

/** Discreet Mode + Updated row: icons replace bold text labels. */
function renderNowMeta(modeLabel, updatedSource) {
  const updatedLabel = formatNowUpdated(updatedSource);
  const updatedPlain = formatNowUpdatedPlain(updatedSource);
  const modeItem = modeLabel
    ? `<span class="now-meta-item" title="${escapeAttr('Mode: ' + modeLabel)}">${nowMetaIconSvg('mode')}<span class="now-meta-value">${escapeHtml(modeLabel)}</span></span>`
    : '';
  const updatedItem = `<span class="now-meta-item" title="${escapeAttr('Updated: ' + updatedPlain)}">${nowMetaIconSvg('updated')}<span class="now-meta-value">${updatedLabel}</span></span>`;
  return `<div class="now-meta" role="group" aria-label="Plan metadata">${modeItem}${updatedItem}</div>`;
}

function attentionFingerprint(items) {
  return JSON.stringify(
    (items || []).map((item) => (typeof item === 'string' ? item : item?.id || '')),
  );
}

function attentionSeverityMeta(severity) {
  if (severity === 'action') {
    return { key: 'action', label: 'Action', mark: '\u23F8' };
  }
  if (severity === 'warning') {
    return { key: 'warning', label: 'Warning', mark: '\u26A0' };
  }
  return { key: 'info', label: 'Note', mark: '\u2139' };
}

function attentionKindLabel(kind) {
  const map = {
    prompt: 'Agent prompt',
    report: 'External review',
    handoff: 'Handoff',
    parked: 'Parked',
    incomplete: 'Incomplete',
    readiness: 'Readiness',
  };
  return map[kind] || kind || 'Attention';
}

/**
 * Every Field Report and Checklist action copies. The label, tooltip, and
 * confirmation name what was copied and which destination receives the paste.
 */
function attentionActionButton(item, idx) {
  const action = item?.action;
  if (!action?.target) return '';
  let label;
  let onclick;
  let title;
  if (action.type === 'copy') {
    const subject = action.subject || action.target;
    const destination = action.pasteDestination || 'chatInput';
    label = action.label || 'Copy';
    onclick = copyForPasteHandler(action.target, subject, destination);
    title = copyActionTitle(subject, destination);
  } else if (isSafeRepoRelativePath(action.target)) {
    label = PATH_COPY_LABEL;
    onclick = copyRepoPathHandler(action.target);
    title = pathActionTitle(action.target);
  } else {
    label = 'Copy reference';
    onclick = copyForPasteHandler(action.target, 'reference', 'chatInput');
    title = copyActionTitle('reference', 'chatInput');
  }
  const focusKey = `attention-action-${idx}-${escapeAttr(item.id || 'item')}`;
  return `<button type="button" class="status-bar-btn" data-focus-key="${focusKey}" onclick="${onclick}" style="font-size:11px;padding:3px 10px" title="${escapeAttr(title)}">${escapeHtml(label)}</button>`;
}

// One Field Report row. `item.label` is derived from untrusted conversation
// text, so every dynamic value is escaped on the way into the document.
function renderAttentionItem(item, idx) {
  const sev = attentionSeverityMeta(item.severity);
  const progressLabel = item.progress?.label
    || (item.progress && item.progress.total > 0
      ? `${item.progress.completed} of ${item.progress.total}`
      : '');
  const updated = item.modifiedAt ? formatNowUpdated(item.modifiedAt) : '';
  const metaParts = [];
  if (progressLabel) metaParts.push(escapeHtml(progressLabel));
  // Prompts have no plan progress; show when the question went quiet instead.
  // Reports show when the review landed in memory.
  if (updated) {
    if (item.kind === 'prompt') metaParts.push(`Quiet since ${updated}`);
    else if (item.kind === 'report') metaParts.push(`Landed ${updated}`);
    else metaParts.push(`Updated ${updated}`);
  }
  if (item.sourcePath) metaParts.push(`<code>${escapeHtml(item.sourcePath)}</code>`);
  return `
    <div class="attention-item attention-item-${sev.key}" role="listitem" data-attention-id="${escapeAttr(item.id || '')}">
      <div class="attention-item-header">
        <span class="attention-severity attention-severity-${sev.key}" aria-label="Severity: ${escapeAttr(sev.label)}">
          <span aria-hidden="true">${sev.mark}</span>
          ${escapeHtml(sev.label)}
        </span>
        <span class="attention-kind">${escapeHtml(attentionKindLabel(item.kind))}</span>
      </div>
      <div class="attention-label">${escapeHtml(item.label || 'Attention item')}</div>
      ${metaParts.length ? `<div class="attention-meta">${metaParts.join(' \u00b7 ')}</div>` : ''}
      <div class="attention-actions">${attentionActionButton(item, idx)}</div>
    </div>
  `;
}

/** Severity-first ordering shared by Field Report rows and Checklist notes. */
function orderAttentionBySeverity(items) {
  const actionable = items.filter(
    (item) => item.severity === 'action' || item.severity === 'warning',
  );
  const notes = items.filter(
    (item) => item.severity !== 'action' && item.severity !== 'warning',
  );
  return [...actionable, ...notes];
}

function renderAttentionPanel(d, attentionChanged) {
  const items = d.missionControl?.attention || [];
  const prompts = items.filter((item) => item.kind === 'prompt');
  const reports = items.filter((item) => item.kind === 'report');
  const rest = items.filter((item) => item.kind !== 'prompt' && item.kind !== 'report');
  const ordered = orderAttentionBySeverity(rest);
  const total = prompts.length + reports.length + ordered.length;
  const countLabel = total === 0 ? 'Clear' : `${total}`;

  // Distinct labelled group so the transcript-derived source stays legible next
  // to the active handoff gate.
  const promptGroup = prompts.length
    ? `<div class="attention-group-label">Agent prompts awaiting a reply</div>
       <div class="attention-stack" role="list">${prompts.map((item, idx) => renderAttentionItem(item, idx)).join('')}</div>`
    : '';

  // Same treatment for reviews that never reached a triage outcome.
  const reportGroup = reports.length
    ? `<div class="attention-group-label">External reviews awaiting triage</div>
       <div class="attention-stack" role="list">${reports.map((item, idx) => renderAttentionItem(item, prompts.length + idx)).join('')}</div>`
    : '';

  const restGroup = ordered.length
    ? `<div class="attention-stack" role="list">${ordered.map((item, idx) => renderAttentionItem(item, prompts.length + reports.length + idx)).join('')}</div>`
    : '';

  const rows = total === 0
    ? `<div class="attention-empty">Nothing needs attention. Agent prompts awaiting a reply, external reviews awaiting triage, and active handoff gates appear here. Plan states and readiness notes live in Checklist.</div>`
    : `${promptGroup}${reportGroup}${restGroup}`;

  return `
    <div class="card${attentionChanged ? ' card-flash' : ''}" id="attention-panel">
      <div class="card-header now-panel-header">
        <span class="card-title">${spaceIconSvg('field-report')}Field Report</span>
        <span class="section-subtitle" style="margin-left:auto">${escapeHtml(countLabel)}</span>
      </div>
      ${rows}
    </div>
  `;
}

// Step progress bar: one segment per plan step (completed / current / remaining).
function renderNowStepBar(now) {
  const total = now?.progress?.total ?? 0;
  if (total <= 0) return '';
  const completed = Math.min(Math.max(now?.progress?.completed ?? 0, 0), total);
  const hasCurrent = !!now?.currentTodo && completed < total;
  const remaining = Math.max(0, total - completed - (hasCurrent ? 1 : 0));
  const segs =
    '<span class="now-stepbar-seg now-stepbar-seg-done" aria-hidden="true"></span>'.repeat(completed) +
    (hasCurrent ? '<span class="now-stepbar-seg now-stepbar-seg-current" aria-hidden="true"></span>' : '') +
    '<span class="now-stepbar-seg" aria-hidden="true"></span>'.repeat(remaining);
  const aria = `Step progress: ${completed} of ${total} steps complete${hasCurrent ? ', 1 in progress' : ''}`;
  return `
    <div class="now-stepbar-row">
      <div class="now-stepbar" role="img" aria-label="${escapeAttr(aria)}">${segs}</div>
      <span class="now-stepbar-label" aria-hidden="true">${completed} of ${total}</span>
    </div>
  `;
}

function nowStepTodoText(todo) {
  return `<span class="now-todo-id">${escapeHtml(todo.id)}</span>${todo.content ? ` \u2014 ${escapeHtml(todo.content)}` : ''}`;
}

// Connected previous → current → next blocks derived from plan todo statuses.
function renderNowStepper(now, handoff, status, meta) {
  const total = now?.progress?.total ?? 0;
  const completed = now?.progress?.completed ?? 0;
  const planDone = total > 0 && completed >= total;
  const previousTodo = now?.previousTodo || null;
  const currentTodo = now?.currentTodo || null;
  const nextTodo = now?.nextTodo || null;

  const prevText = previousTodo
    ? nowStepTodoText(previousTodo)
    : escapeHtml('None \u2014 first step');
  const currentText = currentTodo
    ? nowStepTodoText(currentTodo)
    : escapeHtml(
        planDone
          ? 'Plan complete'
          : status === 'awaiting_user'
            ? 'Awaiting user decision'
            : '\u2014',
      );
  const nextText = nextTodo
    ? nowStepTodoText(nextTodo)
    : escapeHtml(
        planDone
          ? 'None \u2014 plan complete'
          : handoff?.instruction
            ? handoff.instruction
            : status === 'awaiting_user'
              ? 'Awaiting user decision'
              : 'None \u2014 last step',
      );

  const currentMark = planDone ? '\u2713' : meta.mark;
  return `
    <ol class="now-stepper" aria-label="Work progression: previous, current, next">
      <li class="now-step now-step-previous${previousTodo ? ' now-step-done' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">${previousTodo ? '\u2713' : '\u25CB'}</span>
        <div class="now-step-body">
          <span class="now-step-label">Previous</span>
          <div class="now-step-text">${prevText}</div>
        </div>
      </li>
      <li class="now-step now-step-current${planDone ? ' now-step-done' : ''}${currentTodo || planDone ? '' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">${currentMark}</span>
        <div class="now-step-body">
          <span class="now-step-label">Current</span>
          <div class="now-step-text">${currentText}</div>
        </div>
      </li>
      <li class="now-step now-step-next${nextTodo ? '' : ' now-step-empty'}">
        <span class="now-step-marker" aria-hidden="true">\u25CB</span>
        <div class="now-step-body">
          <span class="now-step-label">Next</span>
          <div class="now-step-text">${nextText}</div>
        </div>
      </li>
    </ol>
  `;
}

function renderNowExecutionPanel(d, nowChanged) {
  const now = d.missionControl?.now || null;
  const handoff = d.system?.handoff || null;
  const hasPlan = !!(now?.planFile || handoff?.plan);
  const status = now?.status || (hasPlan ? 'awaiting_user' : 'idle');
  const meta = nowStatusMeta(status);
  const planName = now?.planId || now?.planFile || handoff?.plan || '';
  const planPath =
    now?.planPath ||
    handoff?.planPath ||
    (handoff?.plan ? `.cursor/plans/${handoff.plan}` : '');
  const modeLabel = now?.mode || handoff?.mode || null;
  const updatedSource = now?.modifiedAt || handoff?.lastUpdated || null;

  const statusClass = `now-status now-status-${meta.key}${meta.live ? ' now-status-live' : ''}`;

  if (!hasPlan) {
    return `
      <div class="card" id="now-execution-panel">
        <div class="card-header now-panel-header">
          <span class="card-title">${spaceIconSvg('current-mission')}Current mission</span>
          <span class="${statusClass}" aria-label="Status: Idle">
            <span class="now-status-mark" aria-hidden="true">${meta.mark}</span>
            Idle
          </span>
        </div>
        <div class="empty-state" style="padding:16px 8px">
          <div style="margin-bottom:8px">No active plan</div>
          <button class="empty-state-btn" data-focus-key="cta-start-project" onclick="${copyForPasteHandler('/start-project', '/start-project', 'chatInput')}" title="${escapeAttr(copyActionTitle('/start-project', 'chatInput'))}">\u2192 Copy /start-project</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="card${nowChanged ? ' card-flash' : ''}" id="now-execution-panel">
      <div class="card-header now-panel-header">
        <span class="card-title">${spaceIconSvg('current-mission')}Current mission</span>
        <span class="${statusClass}" aria-label="Status: ${escapeAttr(meta.label)}">
          <span class="now-status-mark" aria-hidden="true">${meta.mark}</span>
          ${escapeHtml(meta.label)}
        </span>
      </div>
      <div class="now-plan-name">${escapeHtml(planName)}</div>
      ${renderNowStepBar(now)}
      ${renderNowStepper(now, handoff, status, meta)}
      ${renderNowMeta(modeLabel, updatedSource)}
      <div class="now-actions">
        <button class="status-bar-btn" data-focus-key="cta-copy-plan-path" onclick="${escapeAttr(`copyPlanPath('${escapeJsString(planPath)}')`)}" style="font-size:11px;padding:4px 14px" title="${escapeAttr(pathActionTitle(planPath))}">Copy plan path</button>
        <button class="status-bar-btn" data-focus-key="cta-copy-staging" onclick="copyGitStagingCommand()" style="font-size:11px;padding:4px 14px" title="${escapeAttr(copyActionTitle('/git-staging', 'chatInput'))}">Copy /git-staging</button>
      </div>
    </div>
  `;
}

// ===== Render =====
function render() {
  if (!data) return;
  try {
    renderUnsafe();
  } catch (err) {
    console.error('Dashboard render failed', err);
    dataLoading = false;
    const contentEl = document.getElementById('content');
    if (contentEl) {
      const errMsg = err && err.message ? err.message : String(err);
      const errStack = err && err.stack ? err.stack : '';
      contentEl.innerHTML = `
        <div class="empty-state" style="padding:60px 20px">
          <div style="font-size:16px;font-weight:600;color:var(--red)">Render Failed</div>
          <div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">${escapeHtml(errMsg)}</div>
          <button class="error-retry-btn" onclick="refresh()">
            <span>\u21bb</span> Retry
          </button>
          ${errStack ? `
            <div style="margin-top:12px">
              <button class="error-stack-toggle" onclick="(function(el){
                var detail = el.nextElementSibling;
                if(detail) detail.classList.toggle('open');
              })(this)">Show stack trace \u25bc</button>
              <div class="error-stack-detail">${escapeHtml(errStack)}</div>
            </div>
          ` : ''}
        </div>
      `;
    }
    const btn = document.getElementById('refreshBtn');
    if (btn) {
      btn.disabled = false;
      const btnText = btn.querySelector('.btn-refresh-text');
      if (btnText) btnText.textContent = 'Refresh';
      const spinner = btn.querySelector('.inline-spinner');
      if (spinner) spinner.remove();
    }
  }
}

function renderUnsafe() {
  const d = data;

  // Diffing (compare with prevData)
  if (prevData) {
    diffProcesses(prevData.processes, d.processes);
    diffTerminals(prevData.terminals, d.terminals);
  }
  // Metric diff tracking for delta badges (only non-zero deltas animate)
  const delta = {};
  const currMetrics = {
    plans: d.plans.length,
    agents: d.agents.length,
    skills: d.skills.length,
    commands: d.commands.length,
    memory: (d.memory.errors || 0) + (d.memory.decisions || 0),
    terminals: d.terminals.length,
    processes: d.processes.length,
    activity: activityLog.length,
  };
  if (prevData) {
    for (const key of Object.keys(currMetrics)) {
      const diff = currMetrics[key] - prevMetrics[key];
      if (diff !== 0) delta[key] = diff;
    }
    // Health status change
    if (prevData.health && d.health && prevData.health.status !== d.health.status) {
      addActivity(`Health status changed: ${prevData.health.status} \u2192 ${d.health.status}`, 'warning');
    }
    // Git dirty status change
    if (prevData.git && d.git) {
      if (!prevData.git.dirty && d.git.dirty) {
        addActivity(`Git: ${d.git.dirtyCount} file${d.git.dirtyCount !== 1 ? 's' : ''} modified`, 'git');
      } else if (prevData.git.dirty && !d.git.dirty) {
        addActivity('Git: working tree clean', 'git');
      }
    }
  }
  prevMetrics = { ...currMetrics };
  const isFirstRender = !prevData;
  const sectionHash = computeSectionHash(d);
  const sectionChanged = prevData && prevSectionHash !== sectionHash;
  prevSectionHash = sectionHash;
  const handoffChanged = prevData && JSON.stringify(d.system?.handoff) !== JSON.stringify(prevData.system?.handoff);
  const nowChanged = prevData && nowFingerprint(d.missionControl?.now) !== nowFingerprint(prevData.now);
  const attentionChanged = prevData && attentionFingerprint(d.missionControl?.attention) !== attentionFingerprint(prevData.attention);
  const gitChanged = prevData && d.git && prevData.git && (
    prevData.git.dirty !== d.git.dirty ||
    prevData.git.dirtyCount !== d.git.dirtyCount ||
    prevData.git.branch !== d.git.branch
  );
  const hasMetricDelta = Object.keys(delta).length > 0;
  const hasVisualChange = isFirstRender || hasMetricDelta || sectionChanged || nowChanged || attentionChanged;
  const healthStatusChanged = prevData && prevData.health && d.health &&
    prevData.health.status !== d.health.status;
  prevData = snapshotPrevData(d);

  dataLoading = false;

  const contentEl = document.getElementById('content');
  const uiState = captureUiState();

  // Flash animations only when payload actually changed (skip if reduced motion)
  if (hasVisualChange && !isFirstRender && !prefersReducedMotion()) {
    contentEl.classList.remove('data-refreshing');
    void contentEl.offsetWidth;
    contentEl.classList.add('data-refreshing');

    const headerStatus = document.getElementById('headerStatus');
    headerStatus.classList.remove('header-status-flash');
    void headerStatus.offsetWidth;
    headerStatus.classList.add('header-status-flash');

    const heroEl = document.getElementById('hero-activity');
    if (heroEl && !prefersReducedMotion()) {
      heroEl.classList.remove('glow');
      void heroEl.offsetWidth;
      heroEl.classList.add('glow');
      setTimeout(() => heroEl.classList.remove('glow'), 1500);
    }
  } else if (isFirstRender) {
    contentEl.classList.remove('data-refreshing');
  }

  // Update SSE timer
  updateSSETimer();

  // Meta (hidden chrome; kept for tooling / future use)
  const versionEl = document.getElementById('version');
  if (versionEl) versionEl.textContent = `v${d.system?.version || '\u2014'}`;
  const dataVersionEl = document.getElementById('dataVersion');
  if (dataVersionEl) dataVersionEl.textContent = `schema ${d.dashboardDataVersion || '\u2014'}`;
  const lastUpdatedEl = document.getElementById('lastUpdated');
  if (lastUpdatedEl) lastUpdatedEl.textContent = `Updated ${fmtTime(d.generatedAt)}`;

  const health = d.health;
  updateTransportChrome();

  // Nav badges (counts only; no decorative pulse)
  const navOverviewBadge = document.getElementById('navOverviewBadge');
  navOverviewBadge.textContent = d.plans.length;
  navOverviewBadge.className = 'top-tab-badge';
  const navPlansBadge = document.getElementById('navPlansBadge');
  navPlansBadge.textContent = d.plans.length;
  navPlansBadge.className = 'top-tab-badge';
  const navAgentsBadge = document.getElementById('navAgentsBadge');
  navAgentsBadge.textContent = d.agents.length;
  navAgentsBadge.className = 'top-tab-badge';
  const navSkillsBadge = document.getElementById('navSkillsBadge');
  navSkillsBadge.textContent = d.skills.length;
  navSkillsBadge.className = 'top-tab-badge';
  const navCommandsBadge = document.getElementById('navCommandsBadge');
  navCommandsBadge.textContent = d.commands.length;
  navCommandsBadge.className = 'top-tab-badge';
  const navTerminalsBadge = document.getElementById('navTerminalsBadge');
  navTerminalsBadge.textContent = d.terminals.length;
  navTerminalsBadge.className = 'top-tab-badge';
  const navProcessesBadge = document.getElementById('navProcessesBadge');
  navProcessesBadge.textContent = d.processes.length;
  navProcessesBadge.className = 'top-tab-badge';
  const navActivityBadge = document.getElementById('navActivityBadge');
  navActivityBadge.textContent = activityLog.length;
  navActivityBadge.className = 'top-tab-badge';

  // Nav health dot
  const healthDot = document.getElementById('navHealthDot');
  healthDot.className = `dot dot-${health.status === 'ok' ? 'green' : health.status === 'warning' ? 'yellow' : 'red'}`;

  // Git nav dot
  const gitDot = document.getElementById('navGitDot');
  if (d.git?.dirty) {
    gitDot.className = 'dot dot-yellow';
  } else if (d.git?.branch) {

// ===== Auto-refresh (paused while SSE is healthy) =====
function syncPollingWithSseMode() {
  if (sseMode === 'live' && !sseReconnecting && !sseSilentFallback) {
    stopAutoRefresh();
  } else {
    startAutoRefresh();
  }
}

function clearSseSilentFallback() {
  if (!sseSilentFallback) return;
  sseSilentFallback = false;
  syncPollingWithSseMode();
}

/** Open-but-silent SSE: resume poll without tearing down EventSource. */
function checkSseSilence() {
  if (sseMode !== 'live' || !sseSource) return;
  if (Date.now() - lastSseDataTime <= SSE_SILENCE_MS) {
    clearSseSilentFallback();
    return;
  }
  if (!sseSilentFallback) {
    sseSilentFallback = true;
    syncPollingWithSseMode();
    updateTransportChrome();
  }
}

// ===== SSE =====
function connectSSE() {
  if (sseSource) {
    sseSource.close();
    sseSource = null;
  }
  try {
    sseSource = new EventSource('/api/events');
    sseSource.onopen = () => {
      sseFailedAttempts = 0;
      sseMode = 'live';
      sseReconnecting = false;
      lastEventTime = Date.now();
      lastSseDataTime = Date.now();
      clearSseSilentFallback();
      startSSETimer();
      syncPollingWithSseMode();
      if (data) render();
    };

    // Debounced SSE handler avoids rapid re-renders.
    // Do NOT set dataLoading here: that wiped the pane and skipped render forever.
    const debouncedRender = debounce(() => {
      render();
    }, 150);

    sseSource.onmessage = (event) => {
      try {
        lastEventTime = Date.now();
        lastSseDataTime = Date.now();
        clearSseSilentFallback();
        const newData = JSON.parse(event.data);
        if (newData && typeof newData === 'object' && Array.isArray(newData.plans)) {
          data = newData;
          debouncedRender();
        }
      } catch (e) {
        // ignore parse errors
      }
    };
    sseSource.onerror = () => {
      sseFailedAttempts++;
      if (sseFailedAttempts >= 3) {
        sseReconnecting = true;
        syncPollingWithSseMode();
        if (data) render();
        // Give it a few more attempts before falling back to polling
        setTimeout(() => {
          if (sseFailedAttempts >= 6) {
            if (sseSource) { sseSource.close(); sseSource = null; }
            sseMode = 'polling';
            sseReconnecting = false;
            sseSilentFallback = false;
            stopSSETimer();
            syncPollingWithSseMode();
            if (data) render();
          }
        }, 10000);
      }
    };
  } catch (e) {
    sseMode = 'polling';
    sseSilentFallback = false;
    syncPollingWithSseMode();
  }
}

// ===== Fetch =====
async function fetchData({ force = false } = {}) {
  // When SSE is healthy, skip poll fetches unless forced (Refresh button)
  // or silence fallback has re-enabled polling beside the open stream.
  if (!force && sseMode === 'live' && !sseReconnecting && !sseSilentFallback && data) return;

  const btn = document.getElementById('refreshBtn');
  const btnText = btn.querySelector('.btn-refresh-text');
  btn.disabled = true;
  if (btnText) {
    btnText.textContent = 'Refreshing...';
  } else {
    btn.textContent = 'Refreshing...';
  }
  // Add inline spinner
  let spinner = btn.querySelector('.inline-spinner');
  if (!spinner) {
    spinner = document.createElement('span');
    spinner.className = 'inline-spinner';
    spinner.style.marginRight = '4px';
    btn.insertBefore(spinner, btn.firstChild);
  }

  // Only wipe the pane on the first load; background refresh keeps the last good render.
  if (!data) {
    dataLoading = true;
  }

  // Try multiple URLs — works when served by dashboard/serve.mjs or a static server
  const urls = [
    '/dashboard-data.json?_=' + Date.now(),
    '/api/data?_=' + Date.now(),
    'dashboard-data.json?_=' + Date.now(),
  ];

  for (const url of urls) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) continue;
      const next = await resp.json();
      // Validate it looks like our data
      if (next && typeof next === 'object' && Array.isArray(next.plans)) {
        data = next;
        lastEventTime = Date.now();
        if (sseMode !== 'live') {
          updateSSETimer();
        }
        render();
        resetRefreshBtn();
        return;
      }
    } catch {
      // try next url
    }
  }

  // Fallback: show instructions only when we have no data yet
  resetRefreshBtn();
  btn.textContent = data ? 'Refresh' : 'Start server';
  dataLoading = false;
  if (data) return;
  document.getElementById('loading').innerHTML = `
    <div class="empty-state">
      <div style="font-size:40px;margin-bottom:16px">\u26a1</div>
      <div style="font-size:16px;font-weight:600;color:var(--text-primary)">Dashboard Server</div>
      <div style="margin-top:8px;font-size:13px;color:var(--text-secondary)">Start the data server to get live data:</div>
      <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
        <code style="background:var(--bg-card);padding:8px 14px;border-radius:6px;border:1px solid var(--border);font-size:13px;color:var(--cyan)">node dashboard/serve.mjs</code>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--text-muted)">Or generate static data once:</div>
      <div style="margin-top:6px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
        <code style="background:var(--bg-card);padding:6px 12px;border-radius:6px;border:1px solid var(--border);font-size:12px;color:var(--text-muted)">node dashboard/dashboard-data.mjs > dashboard/dashboard-data.json</code>
      </div>
    </div>
  `;
}

// ===== Auto-refresh =====
function refresh() {
  fetchData({ force: true });
}
function startAutoRefresh() {
  stopAutoRefresh();
  timer = setInterval(() => fetchData(), refreshInterval);
}
function stopAutoRefresh() {
  if (timer) { clearInterval(timer); timer = null; }
}

// ===== Init =====
fetchData();
connectSSE();
syncPollingWithSseMode();
startStatusBarTimer();
</script>
