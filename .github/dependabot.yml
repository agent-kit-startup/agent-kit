# Dependabot: GitHub Actions and npm only (supply-chain-scanner-true-positives plan).
# Grouped and monthly: one PR per ecosystem instead of one per package, each of
# which ran full CI and re-ran it on every rebase (Actions minutes, 2026-09-24).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Groups take minor/patch only; each major opens its own PR so one breaking
    # upgrade cannot redden the whole batch (PR #1056, 2026-10-12).
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native port): held until tsup --dts supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the runtime Node major (CI + engines), not npm latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
