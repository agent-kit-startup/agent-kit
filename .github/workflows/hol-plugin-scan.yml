name: HOL plugin scan

# The pinned action README does not name a HOL detection event.
# Run on pull requests, pushes to main and staging, and manual dispatch.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled; main and staging runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@c96833de5070fab4e564010b5ab6e3c3d7e07a3e # v1.2.806
        with:
          plugin_dir: "."
          fail_on_severity: high
          # Tracked checkout, plugin-scanner 3.0.123: Final Score 94/100 while
          # SECURITY.md lived under .github/ (its only low). SECURITY.md is at
          # the repo root since 2026-10-19 (ADR 2026-08-05 amend).
          min_score: 80
