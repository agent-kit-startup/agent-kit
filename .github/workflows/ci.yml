name: CI

on:
  # Branch pushes are covered by pull_request; listing "**" here as well ran the
  # whole build twice for every PR push. Keep the direct pushes that have no PR
  # of their own: the two long-lived branches and release tags.
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      sync_public:
        description: "Sync to public repo"
        type: boolean
        default: false
      sync_landing:
        description: "Stamp and promote missionkit.io from public Release Latest"
        type: boolean
        default: false
      landing_version:
        description: "X.Y.Z when sync_landing runs on a branch (tag ref supplies it)"
        type: string
        default: ""

# Read-only GITHUB_TOKEN by default. Public pushes and Releases use a
# public-sync GitHub App installation token (vars.PUBLIC_SYNC_APP_CLIENT_ID +
# the public-sync Environment key); there is no PAT path. publish-npm runs only
# on the public origin and adds id-token: write there (npm trusted publishing
# with provenance, ADR 2026-10-26_npm-publish-from-public-repo-oidc-provenance).
permissions:
  contents: read

# Superseded PR runs are cancelled; main, staging and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The staging -> main promote PR head is the staging tip, which its own
    # staging push run already built (main is FF-synced into staging after
    # every promote). A skipped job still reports success to required checks.
    if: >-
      ${{ !(github.event_name == 'pull_request'
        && github.base_ref == 'main'
        && github.head_ref == 'staging') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history is required for git-range evidence checks (e.g. delivery
          # reconciliation SHAs) and the private-origin allowlist pin work. Mirrors
          # sync-public at line 98. The shallow-checkout default caused R1/R2 in
          # close-bigfix-pty-monitor-residuals; see plan-monitor-close-public-ci-skip
          # for the allowlist pin work it unblocks.
          fetch-depth: 0

      - name: Guard public tree (no tracked local-only Cursor paths)
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '^\.cursor/HANDOFF\.md$|^\.cursor/plans/.+\.plan\.md$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::These paths must not be tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Registry catalog parity
        if: github.repository == 'agent-kit-startup/agent-kit-dev'
        run: node scripts/build-registry.mjs && git diff --exit-code registry/registry.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Build before the guard steps: test:root-node includes the session-start
      # hook diagnostic, which asserts the hook resolves the CLI via
      # packages/cli/dist instead of falling back to degraded mode.
      - name: Build
        run: pnpm build

      # Private-origin allowlist (SoT: agent-kit-startup/agent-kit-dev).
      # Fail-safe: forks / renames / second mirrors skip private-only steps.
      # Adding another allowlisted step requires updating the exact-count pin in
      # packages/cli/src/dashboard/ci-private-origin-allowlist.test.ts.
      # Job-level `if` cannot read vars.PUBLIC_REPO_URL; that var redirects the
      # sync target (push + gh --repo) below, never this guard. See ADR 2026-07-29.
      - name: Authority graph parity
        if: github.repository == 'agent-kit-startup/agent-kit-dev'
        run: pnpm evidence:authority-graph:check

      - name: Public-deny-link guard
        if: github.repository == 'agent-kit-startup/agent-kit-dev'
        run: |
          pnpm check:public-deny-links
          # Content denylist + allowlist dry-run (same guards as tag-gated sync-public).
          # Catches inline denylist terms in synced docs before a v* tag.
          node scripts/sync-public.mjs --dry-run

      - name: Evidence checks
        if: github.repository == 'agent-kit-startup/agent-kit-dev'
        run: |
          # Closed CHANGELOG section for package.json version must carry public
          # notes, or tag CI sync-landing fails closed after the tag.
          pnpm check:release-preflight
          pnpm evidence:codebase-findings:check
          pnpm evidence:risk-hotspots:check
          pnpm evidence:knowledge-classification:check
          # Guards that shipped with tests but no runner until the 10-cycle audit.
          pnpm check:guidance-claims
          pnpm check:memory-index
          # Game content canon: private path, so this stays in the private-origin step.
          pnpm check:game-content
          pnpm landing:build
          pnpm landing:build:check
          pnpm landing:build -- --site colony
          pnpm landing:build:check -- --site colony
          pnpm landing:build -- --site oligarchy
          pnpm landing:build:check -- --site oligarchy
          # Test files for root node --test suites. Scan scripts already run
          # above (deny-links) and on publish-npm (verify-cli-dashboard-pack.mjs).
          # Factory-only suites (not in public-sync.manifest) stay on
          # test:factory-root-node so the synced test:root-node path stays
          # portable after Path C (errors/2026-08-13_public-ci-factory-only-test-files.md).
          pnpm test:root-node
          pnpm test:factory-root-node

      # Engine artifact (ADR 2026-10-19_colony-managed-engine-distribution): the npm
      # package contents plus the runtime node_modules and engine.json, as one tarball.
      # Built and self-verified (extract, --version, engine-info) on every run so a tag
      # never finds it broken; publish-engine attaches it to the Release. No secrets.
      - name: Engine artifact
        run: node scripts/build-engine-artifact.mjs --out dist/engine

      - name: Guard generated CLI dashboard is untracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files packages/cli/dashboard || true)"
          if [ -n "$tracked" ]; then
            echo "::error::packages/cli/dashboard must remain gitignored generated output:"
            echo "$tracked"
            exit 1
          fi


  # ── Sync to public mirror (tag or manual trigger) ──
  # Credential: the public-sync GitHub App only (vars.PUBLIC_SYNC_APP_CLIENT_ID +
  # secrets.PUBLIC_SYNC_APP_PRIVATE_KEY, installed on the public repo and listed as
  # a bypass actor on its ruleset). The PUBLIC_REPO_TOKEN PAT fallback was removed
  # after the v6.15.0 tag run (42590953824) proved the App path.
  # The App key lives in the public-sync Environment, which limits it to v* tags and
  # main. A sync_public dispatch from any other ref does not reach a runner.
  # The App needs Contents, Pull requests and Workflows: write on the public repo, no
  # Administration: its bypass actor entry on Protect main (one required review,
  # squash only, auto-merge disabled) lets the --admin squash retry land. Opt out:
  # PUBLIC_SYNC_AUTO_MERGE=false.
  # The job fails if the public build is red or the squash merge does not land.
  # Private-origin allowlist only (SoT: agent-kit-startup/agent-kit-dev).
  # Path C mirrors ci.yml; public / forks have no App key by design.
  # Adding another allowlisted site (this job `if` counts) requires updating the
  # exact-count pin in packages/cli/src/dashboard/ci-private-origin-allowlist.test.ts.
  # The secrets context is not allowed in job-level `if`; the guard step
  # below fails loudly when the App variable or key is missing on private tag/manual sync paths.
  # vars.PUBLIC_REPO_URL redirects push + gh --repo (slug derived from URL); it cannot override this `if`.
  sync-public:
    needs: build
    if: >-
      github.repository == 'agent-kit-startup/agent-kit-dev'
      && (startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch'
              && github.event.inputs.sync_public == 'true'))
    environment: public-sync
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # setup-node@v5 enables package-manager-cache by default when package.json
      # has "packageManager". This job only runs node (no pnpm install), so disable
      # the cache and install pnpm first so the resolver does not fail the job.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # GitHub App installation token for the public repo (ADR
      # 2026-10-21_ci-auth-without-expiring-secrets point 3): minted per run, lasts
      # one hour, nothing to expire between releases. The only credential: the guard
      # step below fails the job when the App variable or key is missing.
      - name: Require the public-sync App
        run: |
          missing=""
          [ -n "$APP_CLIENT_ID" ] || missing="repository variable PUBLIC_SYNC_APP_CLIENT_ID"
          if [ "$APP_KEY_SET" != "true" ]; then
            missing="${missing:+$missing and }secret PUBLIC_SYNC_APP_PRIVATE_KEY in the public-sync Environment"
          fi
          if [ -n "$missing" ]; then
            echo "::error::public-sync GitHub App not configured: missing $missing on $GITHUB_REPOSITORY. It is the only public repo credential (no PAT fallback); sync did not run. See docs/repository-boundaries.md (Public-sync GitHub App)."
            exit 1
          fi
        env:
          APP_CLIENT_ID: ${{ vars.PUBLIC_SYNC_APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY != '' }}

      - name: Mint public repo App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.PUBLIC_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ vars.PUBLIC_SYNC_APP_OWNER || 'agent-kit-startup' }}
          repositories: ${{ vars.PUBLIC_SYNC_APP_REPOSITORIES || 'agent-kit' }}

      - name: Run sync
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The public-sync App token step produced no token; sync did not run."
            exit 1
          fi
          gh auth setup-git
          node scripts/sync-public.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Slug for gh --repo is derived from this URL in sync-public.mjs (no hardcoded PUBLIC_REPO_SLUG).
          PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL || 'https://github.com/agent-kit-startup/agent-kit.git' }}
          PUBLIC_BRANCH: main
          # Default: auto-merge after create/update. Set repo/org var to "false" to opt out.
          PUBLIC_SYNC_AUTO_MERGE: ${{ vars.PUBLIC_SYNC_AUTO_MERGE || 'true' }}
          # After the sync PR merges, create/update the public GitHub Release for this version.
          PUBLIC_SYNC_CREATE_RELEASE: ${{ vars.PUBLIC_SYNC_CREATE_RELEASE || 'true' }}
          GIT_AUTHOR_NAME: agent-kit-sync
          GIT_AUTHOR_EMAIL: sync@agent-kit.dev

  # ── Publish @dadado/agent-kit-cli to npm (public tag only) ──
  # Public-origin only (ADR 2026-10-26_npm-publish-from-public-repo-oidc-provenance):
  # runs on the public v* tag that sync-public creates for the synced commit, never
  # on the private origin or a fork. npm trusted publishing (OIDC) needs no secret,
  # rejects self-hosted runners and makes provenance only from a public repo, so
  # runs-on is pinned to ubuntu-latest and not to vars.CI_RUNNER. The trust binds
  # the repository and this workflow filename only. The public `v*` tag ruleset
  # (operator, plan p2, `Protect release tags`) blocks deletion, update and
  # force-move of `v*` tags for everyone (no bypass actor); it has no creation
  # rule, so who can create the triggering tag is limited by the public repo's
  # collaborator set (sole admin today). Accepted as applied on 2026-10-27: an
  # admin bypass for a creation rule would also re-allow tag delete/move.
  # Pinned in packages/cli/src/dashboard/ci-private-origin-allowlist.test.ts
  # (exactly one public-origin site, no secrets, ubuntu-latest, id-token: write).
  publish-npm:
    needs: build
    if: >-
      github.repository == 'agent-kit-startup/agent-kit'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14; Node 22 bundles npm 10.
      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<14)) { console.error(`::error::Node ${process.versions.node} < 22.14`); process.exit(1) }'
          npm_v="$(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error(`::error::npm ${process.argv[1]} < 11.5.1`); process.exit(1) }' "$npm_v"
          echo "node $(node --version), npm $npm_v"

      # Publish only the synced commit, at most once: the tag must name the CLI
      # package version, and a version that is already on npm is a notice, not a
      # failure (npm versions are immutable; a re-run must stay green).
      - name: Check tag and published version
        id: version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/cli/package.json version $version; npm publish did not run."
            exit 1
          fi
          published="$(npm view "@dadado/agent-kit-cli@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "::notice::@dadado/agent-kit-cli@$version is already on npm; publish skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & Build
        if: steps.version.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile=false && pnpm build

      - name: Verify Path C pack
        if: steps.version.outputs.skip != 'true'
        run: node scripts/verify-cli-dashboard-pack.mjs

      # npm (not pnpm) publishes, so the npm >= 11.5.1 above does the OIDC exchange.
      # The CLI package has no workspace: dependencies to rewrite.
      - name: Publish (trusted publishing, provenance)
        if: steps.version.outputs.skip != 'true'
        working-directory: packages/cli
        run: npm publish --provenance --access public

  # Oligarchy rules engine (packages/game-engine, @dadado/oligarchy-engine, Apache-2.0):
  # same trust as publish-npm (public origin, hosted runner, OIDC, provenance, no secret),
  # its own npm Trusted Publisher row (workflow ci.yml, no environment). The tag names the
  # CLI version, so the gate here is the engine version: publish only a version npm does
  # not have. npm binds a Trusted Publisher only to a package that already exists, so
  # while the name is absent from npm this job packs with --dry-run and stops (the first
  # publish is the operator's). packages/game (story, catalog, art) is never published.
  publish-oligarchy-engine:
    needs: build
    if: >-
      github.repository == 'agent-kit-startup/agent-kit'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14; Node 22 bundles npm 10.
      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<14)) { console.error(`::error::Node ${process.versions.node} < 22.14`); process.exit(1) }'
          npm_v="$(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error(`::error::npm ${process.argv[1]} < 11.5.1`); process.exit(1) }' "$npm_v"
          echo "node $(node --version), npm $npm_v"

      # Three outcomes: the package is absent from npm (dry run only), this version is
      # already on npm (skip, a re-run stays green), or a new version (publish). Any
      # npm view error other than E404 fails the job instead of guessing.
      - name: Check published engine version
        id: version
        working-directory: packages/game-engine
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "$name" != "@dadado/oligarchy-engine" ]; then
            echo "::error::packages/game-engine/package.json name is $name, not @dadado/oligarchy-engine."
            exit 1
          fi
          if ! npm view "$name" name > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            if grep -q 'E404' "$RUNNER_TEMP/view.err"; then
              echo "::notice::$name is not on npm yet. A Trusted Publisher needs an existing package, so the first publish is the operator's; this run packs $version with --dry-run only."
              echo "mode=dry-run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/view.err"
            echo "::error::npm view $name failed (not E404); nothing was published."
            exit 1
          fi
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; publish skipped."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the engine
        if: steps.version.outputs.mode != 'skip'
        working-directory: packages/game-engine
        run: node --test test/*.test.mjs

      # The tarball holds the engine and its placeholder catalog only, never game content.
      - name: Check the pack contents
        if: steps.version.outputs.mode != 'skip'
        working-directory: packages/game-engine
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const out = require(process.argv[1]);
            // npm 11 prints an array, npm 12 an object keyed by package name.
            const files = (Array.isArray(out) ? out[0] : Object.values(out)[0]).files.map((f) => f.path);
            const ok = (p) => ["package.json", "LICENSE", "README.md"].includes(p) || /^(src|placeholder)\//.test(p);
            const bad = files.filter((p) => !ok(p));
            if (bad.length) { console.error(`::error::unexpected files in the engine tarball: ${bad.join(", ")}`); process.exit(1) }
            console.log(files.join("\n"));
          ' "$RUNNER_TEMP/pack.json"

      - name: Publish dry run
        if: steps.version.outputs.mode != 'skip'
        working-directory: packages/game-engine
        run: npm publish --dry-run --access public

      # npm (not pnpm) publishes, so the npm >= 11.5.1 above does the OIDC exchange.
      # The engine package has no dependencies to rewrite.
      - name: Publish (trusted publishing, provenance)
        if: steps.version.outputs.mode == 'publish'
        working-directory: packages/game-engine
        run: npm publish --provenance --access public

  # ── Stamp + promote missionkit.io from public GitHub Release Latest ──
  # Private-origin allowlist only (same SoT as sync-public).
  # Adding another allowlisted site (this job `if` counts) requires updating the
  # exact-count pin in packages/cli/src/dashboard/ci-private-origin-allowlist.test.ts.
  # Secret HOSTINGER_API_TOKEN: fail loud when unset on tag/manual landing sync.
  # Staging hop is required: deploy:staging, field-check, then promote the same dist/.
  # Does not merge the public sync PR. On tag runs it waits until sync-public
  # has squash-merged and published the public Release. A landing-only dispatch
  # still runs when sync-public is skipped.
  sync-landing:
    needs: [build, sync-public]
    if: >-
      always()
      && github.repository == 'agent-kit-startup/agent-kit-dev'
      && needs.build.result == 'success'
      && (needs.sync-public.result == 'success' || needs.sync-public.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch'
              && github.event.inputs.sync_landing == 'true'))
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Sync landing from public Release Latest
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "::error::HOSTINGER_API_TOKEN is not configured. Tag and manual landing sync require this secret; missionkit.io was not updated."
            exit 1
          fi
          # Dispatch input arrives via env, never as an inline expression (script injection).
          if [ -n "$LANDING_VERSION_INPUT" ]; then
            if ! [[ "$LANDING_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::landing_version must be X.Y.Z; missionkit.io was not updated."
              exit 1
            fi
            export LANDING_RELEASE_VERSION="$LANDING_VERSION_INPUT"
          fi
          node scripts/sync-landing-release.mjs
        env:
          LANDING_VERSION_INPUT: ${{ github.event.inputs.landing_version }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_LANDING_LATEST_ATTEMPTS: "24"
          PUBLIC_LANDING_LATEST_DELAY_MS: "15000"

  # ── Engine artifact on the public GitHub Release (tag only) ──
  # agent-kit-engine-<version>.tar.gz + engine.json + SHA256SUMS (scripts/build-engine-artifact.mjs),
  # attached to the public Release that sync-public creates for this tag; an IDE host installs
  # the engine from there (ADR 2026-10-19_colony-managed-engine-distribution). Does not
  # touch npm: publish-npm runs on the public tag and is independent of this job.
  # Private-origin allowlist only (same SoT as sync-public).
  # Adding another allowlisted site (this job `if` counts) requires updating the
  # exact-count pin in packages/cli/src/dashboard/ci-private-origin-allowlist.test.ts.
  # Public repo credential: the same public-sync App as sync-public (key in the same
  # public-sync Environment); fail loud when the App variable or key is missing.
  # Secret ENGINE_SIGNING_KEY (passwordless minisign key): SHA256SUMS.minisig; skipped while
  # the key does not exist.
  publish-engine:
    needs: [build, sync-public]
    if: >-
      github.repository == 'agent-kit-startup/agent-kit-dev'
      && startsWith(github.ref, 'refs/tags/v')
    environment: public-sync
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install & Build
        run: pnpm install --frozen-lockfile=false && pnpm build

      - name: Build engine artifact
        run: node scripts/build-engine-artifact.mjs --out dist/engine

      # The signing key is operator-owned (ADR 2026-10-19_colony-managed-engine-distribution,
      # Consequence 4). Without it the artifact ships with SHA256SUMS only, as before. With it,
      # scripts/sign-engine-artifact.mjs writes SHA256SUMS.minisig (minisign, prehashed
      # Ed25519; Colony engine.rs verifies it) and fails the job on any key or signature
      # problem. vars.ENGINE_SIGNING_PUBKEY (the RW... line), when set, must be this key.
      - name: Sign engine artifact
        run: |
          if [ -z "$ENGINE_SIGNING_KEY" ]; then
            echo "ENGINE_SIGNING_KEY not configured: engine artifact ships unsigned (SHA256SUMS only)."
            exit 0
          fi
          node scripts/sign-engine-artifact.mjs --file dist/engine/SHA256SUMS --comment "agent-kit-engine ${GITHUB_REF_NAME#v} file:SHA256SUMS"
        env:
          ENGINE_SIGNING_KEY: ${{ secrets.ENGINE_SIGNING_KEY }}
          ENGINE_SIGNING_PUBKEY: ${{ vars.ENGINE_SIGNING_PUBKEY }}

      # Same App token as sync-public (the only credential; no PAT fallback).
      - name: Require the public-sync App
        run: |
          missing=""
          [ -n "$APP_CLIENT_ID" ] || missing="repository variable PUBLIC_SYNC_APP_CLIENT_ID"
          if [ "$APP_KEY_SET" != "true" ]; then
            missing="${missing:+$missing and }secret PUBLIC_SYNC_APP_PRIVATE_KEY in the public-sync Environment"
          fi
          if [ -n "$missing" ]; then
            echo "::error::public-sync GitHub App not configured: missing $missing on $GITHUB_REPOSITORY. It is the only public repo credential (no PAT fallback); the engine artifact was not uploaded. See docs/repository-boundaries.md (Public-sync GitHub App)."
            exit 1
          fi
        env:
          APP_CLIENT_ID: ${{ vars.PUBLIC_SYNC_APP_CLIENT_ID }}
          APP_KEY_SET: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY != '' }}

      - name: Mint public repo App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.PUBLIC_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ vars.PUBLIC_SYNC_APP_OWNER || 'agent-kit-startup' }}
          repositories: ${{ vars.PUBLIC_SYNC_APP_REPOSITORIES || 'agent-kit' }}

      - name: Upload to the public Release
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The public-sync App token step produced no token. The engine artifact was not uploaded."
            exit 1
          fi
          slug="$(printf '%s' "$PUBLIC_REPO_URL" | sed -E 's#^(https://github\.com/|git@github\.com:)##; s#\.git$##')"
          tag="$GITHUB_REF_NAME"
          tarball="dist/engine/agent-kit-engine-${tag#v}.tar.gz"
          if [ ! -f "$tarball" ]; then
            echo "::error::$tarball not found: the tag does not match the CLI package version."
            exit 1
          fi
          if ! gh release view "$tag" --repo "$slug" > /dev/null; then
            echo "::error::Public Release $tag not found on $slug (sync-public creates it); the engine artifact was not uploaded."
            exit 1
          fi
          files=("$tarball" dist/engine/engine.json dist/engine/SHA256SUMS)
          if [ -f dist/engine/SHA256SUMS.minisig ]; then files+=(dist/engine/SHA256SUMS.minisig); fi
          gh release upload "$tag" "${files[@]}" --repo "$slug" --clobber
          echo "Uploaded ${files[*]} to $slug Release $tag."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL || 'https://github.com/agent-kit-startup/agent-kit.git' }}
